}

// 终焉段：战斗框外圈长出一整排细骨牙，参考三审的锯齿轮廓
function drawEndBoneFrame(b) {
  const e = endurance;
  const t = time * (e ? 0.8 + e.phase * 0.12 : 1);
  const pulse = 0.45 + 0.25 * Math.sin(t * 2.4);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.34 * pulse + 0.16).toFixed(3) + ')';
  const pitch = 7;
  for (let x = b.x + 2; x < b.x + b.w - 2; x += pitch) {
    const k = 7 + 3 * Math.sin(x * 0.09 + t * 3);
    const hh = Math.max(2, Math.round(k * 0.5));
    ctx.fillRect(x, b.y - 2 - hh, 2, hh);
    ctx.fillRect(x, b.y + b.h + 2, 2, hh);
  }
  const vpitch = 6;
  for (let y = b.y + 2; y < b.y + b.h - 2; y += vpitch) {
    const k = 6 + 2 * Math.sin(y * 0.12 + t * 3.4);
    const ww = Math.max(2, Math.round(k * 0.5));
    ctx.fillRect(b.x - 2 - ww, y, ww, 2);
    ctx.fillRect(b.x + b.w + 2, y, ww, 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.16 + 0.1 * pulse).toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.strokeRect(b.x - 11, b.y - 11, b.w + 22, b.h + 22);
  ctx.restore();
}

function drawEndWindow(b, idx) {
  const e = endurance;
  const active = !player || (player.arena || 0) === idx;
  const tint = e.tint;

  ctx.save();
  if (e.windowId === 'fluid') {
    const g = ctx.createRadialGradient(
      b.x + b.w / 2, b.y + b.h / 2, 10,
      b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h) * 0.72
    );
    g.addColorStop(0, 'rgba(6,4,10,0.97)');
    g.addColorStop(0.7, 'rgba(14,8,22,0.92)');
    g.addColorStop(1, 'rgba(30,12,42,0.55)');
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = 'rgba(5,4,7,0.96)';
  }
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.12 + 0.04 * Math.sin(time * 3) + (active ? 0.06 : 0);
  ctx.strokeStyle = tint;
  ctx.lineWidth = 6;
  ctx.strokeRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
  ctx.restore();

  if (e.mandala) drawEndBoneFrame(b);
  drawEndCorners(b);

  if (e.windowId === 'glitch') drawEndGlitch(b);
  else if (e.windowId === 'fisheye') drawEndFisheye(b);
  else if (e.windowId === 'fluid') drawEndFluid(b);
  else if (e.windowId === 'cracked') drawEndCracked(b);
  else if (e.windowId === 'ring') drawEndRing(b);
  else if (e.windowId === 'rotate') drawEndRotate(b);
  else if (e.windowId === 'fold') drawEndFold(b);
  else if (e.windowId === 'offset') drawEndOffset(b, idx);
  else drawEndPlain(b);

  if (arenaBoxes.length > 1 && active) {
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.2 * Math.sin(time * 4);
    ctx.strokeStyle = tint;
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10);
    ctx.restore();
  }
}

function drawEndPlain(b) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 4;
  ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
  ctx.restore();
}

function drawEndGlitch(b) {
  const e = endurance;
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.clip();

  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  for (let y = b.y; y < b.y + b.h; y += 4) ctx.fillRect(b.x, y, b.w, 1);

  for (let i = 0; i < 7; i++) {
    const y = b.y + ((i * 61 + e.glitchSeed + time * 74) % b.h);
    const h = 1 + (i * 7) % 3;
    const off = Math.sin(time * 13 + i) * 11;
    ctx.fillStyle = i % 2 ? 'rgba(255,60,90,0.16)' : 'rgba(90,200,255,0.12)';
    ctx.fillRect(b.x, y, b.w, h);
    ctx.fillRect(b.x + off, y, b.w * 0.42, h + 1);
  }

  for (let i = 0; i < 24; i++) {
    const x = b.x + ((i * 97 + e.glitchSeed * 3 + time * 160) % b.w);
    const y = b.y + ((i * 43 + time * 120) % b.h);
    ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.12)' : 'rgba(255,70,100,0.16)';
    ctx.fillRect(x, y, 2 + (i % 3), 1);
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  const n = 22;
  const step = b.w / n;
  ctx.moveTo(b.x, b.y);
  for (let i = 0; i < n; i++) {
    const x = b.x + i * step;
    ctx.lineTo(x + step / 2, b.y + (i % 2 ? -3 : 3));
    ctx.lineTo(x + step, b.y);
  }
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b.x, b.y + b.h);
  for (let i = 0; i < n; i++) {
    const x = b.x + i * step;
    ctx.lineTo(x + step / 2, b.y + b.h + (i % 2 ? 3 : -3));
    ctx.lineTo(x + step, b.y + b.h);
  }
  ctx.stroke();
  ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
  ctx.restore();
}

function drawEndFisheye(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.clip();
  ctx.strokeStyle = 'rgba(150,215,255,0.10)';
  ctx.lineWidth = 1;
  for (let r = 18; r < Math.max(b.w, b.h); r += 24) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 0.94, r * 0.55, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(190,235,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.quadraticCurveTo(cx, b.y - 14, b.x + b.w, b.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b.x, b.y + b.h);
  ctx.quadraticCurveTo(cx, b.y + b.h + 14, b.x + b.w, b.y + b.h);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.quadraticCurveTo(b.x - 12, cy, b.x, b.y + b.h);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b.x + b.w, b.y);
  ctx.quadraticCurveTo(b.x + b.w + 12, cy, b.x + b.w, b.y + b.h);
  ctx.stroke();
  ctx.restore();
}

function drawEndFluid(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(125,255,207,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const steps = 44;
  for (let i = 0; i <= steps; i++) {
    const a = i / steps * Math.PI * 2;
    const rx = b.w / 2 + 3 * Math.sin(time * 2 + i * 0.7);
    const ry = b.h / 2 + 3 * Math.cos(time * 1.7 + i * 0.6);
    const x = cx + Math.cos(a) * rx;
    const y = cy + Math.sin(a) * ry;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.globalAlpha = 0.3;
  ctx.fillStyle = 'rgba(125,255,207,0.5)';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + time * 0.2;
    const x = cx + Math.cos(a) * (b.w / 2 + 4);
    const y = cy + Math.sin(a) * (b.h / 2 + 4);
    const s = 1 + Math.abs(Math.sin(time * 3 + i)) * 2;
    ctx.fillRect(Math.round(x), Math.round(y), s, s);
  }
  ctx.restore();
}

function drawEndCracked(b) {
  const e = endurance;
  const act = e.crackActive;
  ctx.save();
  for (const seg of e.cracks) {
    ctx.strokeStyle = act ? 'rgba(255,215,240,0.95)' : 'rgba(255,160,210,0.42)';
    ctx.lineWidth = act ? 2 : 1;
    ctx.beginPath();
    seg.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
    ctx.stroke();
  }
  if (act) {
    ctx.globalAlpha = 0.10 + 0.06 * Math.sin(time * 22);
    ctx.fillStyle = '#ffd6ee';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
  }
  ctx.restore();
  drawEndPlain(b);
}

function drawEndRing(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  const rr = Math.min(b.w, b.h) * 0.24;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, rr, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8,3,16,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,120,255,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([6, 6]);
  ctx.lineDashOffset = -time * 24;
  ctx.beginPath();
  ctx.arc(cx, cy, rr + 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(210,170,255,0.45)';
  ctx.stroke();
  ctx.restore();
  drawEndPlain(b);
}

function drawEndRotate(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * 0.18 + (endurance ? endurance.rotateBase : 0));
  ctx.strokeStyle = 'rgba(160,230,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-b.w / 2 - 14, -b.h / 2 - 14, b.w + 28, b.h + 28);
  ctx.rotate(-time * 0.36);
  ctx.strokeStyle = 'rgba(160,230,255,0.22)';
  ctx.strokeRect(-b.w / 2 - 22, -b.h / 2 - 22, b.w + 44, b.h + 44);
  ctx.restore();
  drawEndPlain(b);
}

function drawEndFold(b) {
  const e = endurance;
  const cx = b.x + b.w / 2;
  const active = e.foldPhase > 1.4 && e.foldPhase < 2.1;
  ctx.save();
  ctx.strokeStyle = active ? 'rgba(255,190,235,0.95)' : 'rgba(255,150,220,0.4)';
  ctx.lineWidth = active ? 6 : 2;
  ctx.beginPath();
  ctx.moveTo(cx, b.y + 4);
  ctx.lineTo(cx, b.y + b.h - 4);
  ctx.stroke();

  ctx.globalAlpha = 0.35;
  for (let i = 0; i < 9; i++) {
    const y = b.y + 10 + i * (b.h - 20) / 8;
    ctx.beginPath();
    ctx.moveTo(cx - 8, y);
    ctx.lineTo(cx, y + 4);
    ctx.lineTo(cx + 8, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.lineDashOffset = time * 18;
  ctx.strokeRect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);
  ctx.restore();
  drawEndPlain(b);
}

function drawEndOffset(b, idx) {
  ctx.save();
  ctx.globalAlpha = idx === 0 ? 0.5 : 0.3;
  ctx.strokeStyle = idx === 0 ? 'rgba(160,140,255,0.8)' : 'rgba(120,210,255,0.8)';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x + (idx === 0 ? 5 : -5), b.y + (idx === 0 ? -5 : 5), b.w, b.h);
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = idx === 0 ? 'rgba(160,140,255,0.7)' : 'rgba(120,210,255,0.7)';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(b.x + 8 + i * 6, b.y + b.h - 12, 4, 4);
  }
  ctx.restore();
  drawEndPlain(b);
}

function drawEndHazards() {
  for (const h of hazards) {
    const warn = h.t < h.warn;
    const active = !warn && h.t < h.warn + h.fire;
    if (h.kind === 'after') {
      ctx.save();
      ctx.globalAlpha = warn ? 0.18 + 0.12 * Math.sin(time * 14) : 0.55;
      ctx.fillStyle = '#3ff2e0';
      ctx.fillRect(h.x - 5, h.y - 5, 10, 10);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.strokeRect(h.x - 5, h.y - 5, 10, 10);
      ctx.restore();
      continue;
    }
    if (warn) {
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.3 * Math.sin(time * 22);
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -time * 34;
      ctx.strokeRect(h.x, h.y, h.w, h.h);
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.restore();
      continue;
    }
    if (!active) continue;
    ctx.save();
    if (h.kind === 'chain') {
      ctx.fillStyle = 'rgba(255,55,85,0.22)';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.strokeStyle = 'rgba(255,80,105,0.9)';
      ctx.lineWidth = 2;
      const vertical = h.h >= h.w;
      if (vertical) {
        for (let y = h.y; y < h.y + h.h; y += 11) {
          ctx.strokeRect(h.x + 2, y, Math.max(4, h.w - 4), 8);
        }
      } else {
        for (let x = h.x; x < h.x + h.w; x += 11) {
          ctx.strokeRect(x, h.y + 2, 8, Math.max(4, h.h - 4));
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(h.x, h.y, h.w, h.h);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x - 3, h.y - 3, h.w + 6, h.h + 6);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(h.x - 1, h.y - 1, h.w + 2, h.h + 2);
    }
    ctx.restore();
  }
}

function drawEndHud() {
  const e = endurance;
  if (!e) return;

  const x = 18, y = 10, w = 604, h = 5;
  const k = clamp(e.t / ENDURANCE_DURATION, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = e.tint;
  ctx.fillRect(x, y, w * k, h);
  for (let i = 0; i < 5; i++) {
    const segW = w / 5;
    ctx.globalAlpha = e.phase > i ? 0.85 : 0.22;
    ctx.fillStyle = e.phase > i ? e.tint : '#ffffff';
    ctx.fillRect(x + i * segW, y + 7, segW - 3, 2);
  }
  ctx.restore();

  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = `bold 20px ${MONO}`;
  ctx.fillStyle = e.t > 240 ? '#ff6070' : C.white;
  ctx.fillText(String(Math.max(0, Math.ceil(ENDURANCE_DURATION - e.t))), W - 18, 16);
  ctx.font = `10px ${CN}`;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('秒', W - 18, 40);

  ctx.textAlign = 'left';
  ctx.font = `bold 11px ${MONO}`;
  ctx.fillStyle = e.tint;
  ctx.fillText('PHASE ' + e.phase + ' / 5', 18, 18);
  ctx.font = `10px ${CN}`;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(END_FORM_NAME[e.windowId] || '', 96, 19);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(END_SOUL_NAME[e.soulId] || '', 18, 34);
  // 当前招式名
  if (e.seg && e.seg.name) {
    ctx.textAlign = 'center';
    ctx.font = `bold 12px ${CN}`;
    ctx.fillStyle = 'rgba(255,255,255,0.66)';
    ctx.fillText(e.seg.name, W / 2, 18);
    ctx.textAlign = 'left';
  }
  // 彩色骨提示
  if (e.boneHint) {
    const hk = e.boneHint.kind;
    const fade = Math.min(1, e.boneHint.t * 2);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    ctx.font = `bold 13px ${CN}`;
    ctx.fillStyle = hk === 'blue' ? '#a9d6ff' : '#ffc98f';
    ctx.fillText(hk === 'blue' ? '蓝骨 · 保持静止' : '橙骨 · 保持移动', W / 2, box.y - 16);
    ctx.restore();
    ctx.textAlign = 'left';
  }
  if (e.soulId === 'blue') {
    const map = { down: '↓ 下', up: '↑ 上', left: '← 左', right: '→ 右' };
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText('重力 ' + (map[e.gravityDir] || '↓ 下') + '　空格 / 反方向 起跳', 18, 49);
  } else if (e.soulId === 'green') {
    const map = ['↑ 上', '→ 右', '↓ 下', '← 左'];
    ctx.fillStyle = '#d8ffe0';
    ctx.fillText('护盾 ' + (map[(player && player.gdir) || 0]) + '　方向键转向格挡', 18, 49);
  } else if (arenaBoxes.length > 1) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('Q 切换分镜', 18, 49);
  }

  const hx = 96, hy = HP_Y, hw = 150, hh = 14;
  ctx.textAlign = 'left';
  ctx.font = `bold 13px ${MONO}`;
  ctx.fillStyle = C.white;
  ctx.fillText('HP', 58, hy + 1);

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(hx, hy, hw, hh);
  const ratio = clamp(player.hp / player.max, 0, 1);
  ctx.fillStyle = player.hp <= player.max * 0.3 ? '#ff5240' : C.yellow;
  ctx.fillRect(hx + 2, hy + 2, Math.max(0, (hw - 4) * ratio), hh - 4);
  if (player.kr > 0) {
    const krW = (hw - 4) * clamp(player.kr / player.max, 0, 1);
    ctx.fillStyle = C.purple;
    ctx.fillRect(hx + hw - 2 - krW, hy + 2, krW, hh - 4);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.strokeRect(hx - 1, hy - 1, hw + 2, hh + 2);

  ctx.font = `12px ${MONO}`;
  ctx.fillStyle = C.white;
  ctx.fillText(Math.max(0, Math.ceil(player.hp)) + ' / ' + player.max, hx + hw + 12, hy + 2);

  ctx.textAlign = 'right';
  ctx.font = `10px ${CN}`;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('撑满 300 秒即通关', W - 18, hy + 2);
  ctx.textAlign = 'left';
}

/* ========================= DIALOG / MENUS ========================= */

function drawDialog() {
  if (!dialog) return;
  const line = dialog.lines[dialog.idx];
  if (!line) return;
  const isBoss = line.who === 'boss';
  // 打字机计数只统计台词本身，"* " 前缀始终直接显示，否则会吞掉最后两个字
  const prefix = isBoss ? '' : '* ';
  const text = prefix + line.text;
  const font = `16px ${CN}`;
  const maxW = box.w - 52;

  if (isBoss) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = `bold 12px ${MONO}`;
    ctx.fillStyle = spareReady() ? C.yellow : '#ff4656';
    ctx.fillText('LFELKEEA', box.x + 24, box.y + 12);
  }

  const lines = wrapText(text, maxW, font);
  let remain = Math.floor(dialog.shown) + prefix.length;
  let y = box.y + (isBoss ? 36 : 22);
  ctx.font = font;
  ctx.fillStyle = isBoss ? C.white : '#dcd8d0';
  for (const ln of lines) {
    if (remain <= 0) break;
    ctx.fillText(ln.slice(0, remain), box.x + 24, y);
    remain -= ln.length;
    y += 23;
  }

  if (dialog.shown >= line.text.length && Math.floor(time * 2) % 2 === 0) {
    ctx.textAlign = 'right';
    ctx.font = `13px ${MONO}`;
    ctx.fillStyle = C.red;
    ctx.fillText('▼', box.x + box.w - 22, box.y + box.h - 26);
  }
  ctx.textAlign = 'left';
}

const MENU_ITEMS = [
  { label: 'FIGHT', x: 64 },
  { label: 'ACT', x: 200 },
  { label: 'ITEM', x: 336 },
  { label: 'MERCY', x: 470 }
];

function drawMenu() {
  for (let i = 0; i < MENU_ITEMS.length; i++) {
    const it = MENU_ITEMS[i];
    const sel = menuIndex === i;
    ctx.font = `bold 16px ${MONO}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = sel ? C.yellow : (darkMode() ? '#7d746c' : '#8a8177');
    ctx.fillText(it.label, it.x, MENU_Y + 3);
    if (sel) drawHeart(it.x - 16, MENU_Y + 10, 1.4, C.red);
  }

  const lines = ['她挡在走廊中央，没有让路的意思。'];
  if (spareReady()) lines.push('她的敌意已经散了。也许可以饶恕她。');
  else if (mercyCount >= 2) lines.push('她的态度松了一点。继续和她说话。');
  else lines.push('眼神很冷。可以试 ACT，也可以直接 FIGHT。');

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = `14px ${CN}`;
  ctx.fillStyle = '#dcd8d0';
  ctx.fillText('* ' + lines[0], box.x + 24, box.y + 26);
  ctx.fillStyle = '#9d968d';
  ctx.fillText('* ' + lines[1], box.x + 24, box.y + 54);

  if (isGenocideRoute()) {
    ctx.fillStyle = 'rgba(255,90,100,0.75)';
    ctx.font = `11px ${CN}`;
    ctx.fillText('* 她的手一直没有放下。空气里有血腥味。', box.x + 24, box.y + 82);
  }

function drawFight() {
  if (!fight) return;
  const bx = box.x + 52;
  const bw = box.w - 104;
  const by = box.y + box.h / 2 + 6;
  const bh = 15;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `12px ${CN}`;
  ctx.fillStyle = '#9d968d';
  ctx.fillText(fight.stopped ? '审判' : '按下 Z 停止', box.x + box.w / 2, box.y + 24);

  ctx.fillStyle = '#2b2422';
  ctx.fillRect(bx, by - bh / 2, bw, bh);
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 1, by - bh / 2 - 1, bw + 2, bh + 2);

  ctx.fillStyle = 'rgba(255,207,31,0.35)';
  ctx.fillRect(bx + bw * 0.46, by - bh / 2 + 2, bw * 0.08, bh - 4);

  if (!fight.stopped) {
    const mx = bx + bw * fight.pos;
    ctx.save();
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 10;
    ctx.fillStyle = C.white;
    ctx.fillRect(mx - 1.5, by - bh / 2 - 8, 3, bh + 16);

    ctx.font = `bold 20px ${MONO}`;

    ctx.fillText('MISS', box.x + box.w / 2, box.y + box.h - 82);
    ctx.font = `12px ${CN}`;
    ctx.fillStyle = '#9d968d';
    ctx.fillText('她侧身闪开了。', box.x + box.w / 2, box.y + box.h - 44);
  } else {
    const acc = fight.acc;
    ctx.font = `bold 15px ${CN}`;
    ctx.fillStyle = acc > 0.92 ? C.yellow : (acc > 0.55 ? C.white : '#9d968d');
    ctx.fillText(acc > 0.92 ? '会心一击！' : (acc > 0.55 ? '不错' : '偏了'), box.x + box.w / 2, box.y + box.h - 44);

    ctx.fillStyle = '#ff4656';
    ctx.fillText('-' + fight.dmg, box.x + box.w / 2, box.y + box.h - 82);
  }
  ctx.textAlign = 'left';
}

// 场外飞入的弹幕只画在战斗框附近的带状区域，避免糊到立绘和血条上
function drawOuterBullets() {
  let any = false;
  for (const b of bullets) if (b.outer) { any = true; break; }
  if (!any) return;
  ctx.save();
  ctx.beginPath();
  for (const b of arenaBoxes) ctx.rect(b.x, b.y, b.w, b.h);
  ctx.clip();
  for (const bullet of bullets) if (bullet.outer) drawBullet(bullet);
  ctx.restore();
}

function drawDriftRails() {
  const b = arenaBoxes[0] || box;
  const y1 = b.y - 14, y2 = b.y + b.h + 12;
  ctx.save();
  ctx.strokeStyle = 'rgba(48,38,34,0.27)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([7, 8]);
  ctx.lineDashOffset = -time * 26;
  for (const y of [y1, y2]) {
    ctx.beginPath();
    ctx.moveTo(-60, y);
    ctx.lineTo(W + 60, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAttackScene() {
  drawMotes();
  for (const b of arenaBoxes) drawBox(b);
  if (attack && attack.id === 'drift') drawDriftRails();

  // 场外元素：屏幕激光、魔瞳、恶魔鞭、从框外飞进来的弹幕
  for (const beam of beams) if (beam.full) drawLaser(beam);
  for (const beam of beams) if (!beam.full) drawBeamEye(beam);
  for (const l of lashes) drawLash(l);
  drawOuterBullets();

  for (let ai = 0; ai < arenaBoxes.length; ai++) {
    const b = arenaBoxes[ai];

    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
    ctx.clip();

    for (const beam of beams) {
      if (beam.full) continue;
      if ((beam.arena || 0) === ai) drawBeam(beam);
    }
    for (const w of wheels) {
      if ((w.arena || 0) === ai) drawWheel(w);
    }
    for (const bullet of bullets) {
      if (bullet.outer) continue;
      if ((bullet.arena || 0) !== ai) continue;
      drawBullet(bullet);
    }
    for (const s of shots) {
      if ((s.arena || 0) === ai) drawShot(s);
    }
    if (ai === 0) drawSoul(player);
    else drawSoul(player2);

    ctx.restore();

    ctx.strokeStyle = C.white;
    ctx.lineWidth = 4;
    ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);

    if (dualMode) {
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.font = `9px ${CN}`;
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      const label = ai === 0 ? 'WASD' : '方向键 / 小键盘';
      ctx.strokeText(label, b.x + 10, b.y + 7);
      ctx.fillText(label, b.x + 10, b.y + 7);
    }

    if (attack && attack.id === 'blueorange') {
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.font = `9px ${CN}`;
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.fillStyle = C.blue;
      ctx.strokeText('静止安全', b.x + 10, b.y + 7);
      ctx.fillText('静止安全', b.x + 10, b.y + 7);
      ctx.textAlign = 'right';
      ctx.fillStyle = C.orange;
      ctx.strokeText('移动安全', b.x + b.w - 10, b.y + 7);
      ctx.fillText('移动安全', b.x + b.w - 10, b.y + 7);
      ctx.textAlign = 'left';
    }
  }

  drawHint(attack ? attack.hint : '');
}

function drawFallScene() {
  drawMotes();
  const b = box;
  drawBox(b);

  for (const beam of beams) if (beam.full) drawLaser(beam);
  for (const beam of beams) if (!beam.full) drawBeamEye(beam);
  for (const l of lashes) drawLash(l);
  drawOuterBullets();

  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
  ctx.clip();

  // scroll lines to sell the fall
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 24; i++) {
    const x = b.x + ((i * 61) % (b.w - 16)) + 8;
    const y = b.y + ((i * 83 + time * 260) % (b.h + 60)) - 30;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 16);
    ctx.stroke();
  }
  ctx.restore();

  for (const beam of beams) if (!beam.full) drawBeam(beam);
  for (const bullet of bullets) {
    if (bullet.outer) continue;
    drawBullet(bullet);
  }
  for (const s of shots) drawShot(s);
  drawSoul(player);

  // floor line
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(b.x + 4, b.y + b.h - 5);
  ctx.lineTo(b.x + b.w - 4, b.y + b.h - 5);
  ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = C.white;
  ctx.lineWidth = 4;
  ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);

  // boss bust on the right
  if (bustImg.complete && bustImg.naturalWidth) {
    const g = ctx.createRadialGradient(BUST.x + BUST.w / 2, BUST.y + BUST.h / 2, 20, BUST.x + BUST.w / 2, BUST.y + BUST.h / 2, 180);
    g.addColorStop(0, enraged ? 'rgba(200,18,31,0.35)' : 'rgba(200,18,31,0.10)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(BUST.x - 40, BUST.y - 30, BUST.w + 80, BUST.h + 60);

    ctx.save();
    if (enraged) {
      ctx.shadowColor = 'rgba(220,20,40,0.6)';
      ctx.shadowBlur = 24;
    }
    const art = enraged && bustArt.red ? bustArt.red : (bustArt.ready ? bustArt.canvas : bustImg);
    ctx.drawImage(art, BUST.x, BUST.y, BUST.w, BUST.h);
    ctx.restore();
    if (enraged && !bustArt.ready) enragedBlend(BUST.x, BUST.y, BUST.w, BUST.h);
    if (boss.flash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.6, boss.flash * 1.8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(BUST.x, BUST.y, BUST.w, BUST.h);
      ctx.restore();
    }
    ctx.strokeStyle = enraged ? 'rgba(255,40,60,0.6)' : 'rgba(200,18,31,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(BUST.x - 4, BUST.y - 4, BUST.w + 8, BUST.h + 8);
    ctx.font = `bold 11px ${MONO}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = enraged ? '#ff4a5a' : C.blood;
    ctx.fillText('LFELKEEA', BUST.x, BUST.y + BUST.h + 8);
  }

  if (enraged) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `bold 13px ${MONO}`;
    ctx.fillStyle = 'rgba(255,60,70,0.8)';
    ctx.fillText('ENEMY  ATTACK', 320, 16);
  }

  drawHint(attack ? attack.hint : '');
}

/* ========================= ENTITIES ========================= */

function drawSoul(p) {
  if (!p) return;
  // 绿魂受击不闪烁（护盾期间仍然可见、照常挡弹）；其他灵魂保留无敌帧闪烁提示
  if (p.invuln > 0 && p.mode !== 'green' && Math.floor(time * 16) % 2 === 0) return;
  const s = soulPos(p);
  const color = p.mode === 'blue' ? C.blue
    : p.mode === 'green' ? C.green
      : p.mode === 'orange' ? C.orange
        : p.mode === 'yellow' ? C.yellow
          : p.mode === 'cyan' ? '#35e0e0'
            : p.mode === 'purple' ? C.purple
              : p.mode === 'aqua' ? '#3ff2e0'
                : C.red;

  // 第三阶段：红环改成像素点阵，绕着灵魂转
  if (thirdPhase) {
    ctx.save();
    const n = 18;
    for (let i = 0; i < n; i++) {
      const a = time * 1.2 + i / n * Math.PI * 2;
      const rr = 16 + Math.sin(time * 3 + i) * 1.5;
      ctx.globalAlpha = 0.28 + 0.22 * Math.sin(time * 4 + i);
      ctx.fillStyle = 'rgba(255,50,70,0.9)';
      ctx.fillRect(Math.round(s.x + Math.cos(a) * rr), Math.round(s.y + Math.sin(a) * rr * 0.62), 1, 1);
    }
    ctx.restore();
  }

  if (p.mode === 'yellow') {
    // 黄魂：爱心尖端朝向移动方向，尖端就是枪口
    const ang = [Math.PI, -Math.PI / 2, 0, Math.PI / 2][p.face == null ? 2 : p.face];
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(ang);
    drawHeart(0, 0, 2, color);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, 6, 4, 3);
    ctx.fillStyle = C.yellow;
    ctx.fillRect(-2, 9, 4, 2);
    ctx.restore();
  } else {
    drawHeart(s.x, s.y, 2, color);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(Math.round(s.x - 4), Math.round(s.y - 4), 2, 2);
  }

  if (p.mode === 'green') {
    const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    // 终焉模式的护盾角度由 shieldA 平滑插值，普通战斗由方向键直接指定
    const ang = p.endure ? (p.shieldA || 0) : Math.atan2(dirs[p.gdir][1], dirs[p.gdir][0]);
    const flash = p.shieldFlash > 0 ? p.shieldFlash / 0.3 : 0;
    const halfW = p.endure ? 0.95 : 0.72;
    const rad = p.endure ? 34 : 25;
    // 护盾也改成像素块，不再画抗锯齿圆弧
    const blocks = p.endure ? 20 : 14;
    for (let i = 0; i <= blocks; i++) {
      const a0 = ang - halfW + halfW * 2 * i / blocks;
      const x = Math.round(s.x + Math.cos(a0) * rad);
      const y = Math.round(s.y + Math.sin(a0) * rad);
      const sz = flash > 0.5 ? 4 : 3;
      ctx.fillStyle = flash > 0.5 ? '#d8ffe0' : C.green;
      ctx.fillRect(x - (sz >> 1), y - (sz >> 1), sz, sz);
    }
    // 护盾上的三道猫爪痕
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let k = -1; k <= 1; k++) {
      const a0 = ang + k * 0.22;
      for (let rr = rad - 4; rr <= rad + 4; rr += 3) {
        ctx.fillRect(Math.round(s.x + Math.cos(a0) * rr), Math.round(s.y + Math.sin(a0) * rr), 1, 2);
      }
    }
    if (p.endure) {
      // 护盾朝向的小箭头，方便看清当前挡哪边
      ctx.save();
      ctx.globalAlpha = 0.7 + 0.2 * Math.sin(time * 8);
      ctx.fillStyle = '#d8ffe0';
      for (let i = 0; i < 5; i++) {
        const rr = rad + 7 + i * 2;
        const w = 5 - i;
        ctx.fillRect(Math.round(s.x + Math.cos(ang) * rr) - (w >> 1), Math.round(s.y + Math.sin(ang) * rr) - (w >> 1), w, w);
      }
      ctx.restore();
    }
  }

  if (p.endure && p.mode === 'blue') {
    // 重力方向指示：灵魂旁的像素箭头，外加墙跑时的小拖尾
    const g = endGravityVec();
    const ang = Math.atan2(g.y, g.x);
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.2 * Math.sin(time * 6);
    ctx.fillStyle = '#9fd8ff';
    for (let i = 0; i < 5; i++) {
      const rr = 18 + i * 3;
      const w = 4 - (i >> 1);
      ctx.fillRect(Math.round(s.x + Math.cos(ang) * rr) - (w >> 1), Math.round(s.y + Math.sin(ang) * rr) - (w >> 1), w, w);
    }
    ctx.restore();
  }

  if (p.endure && (p.mode === 'cyan' || p.mode === 'purple')) {
    // 单轴移动提示：贯穿战斗框的虚线 + 两端箭头
    const b = arenaBoxes[p.arena] || box;
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.lineDashOffset = -time * 24;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (p.mode === 'cyan') {
      ctx.moveTo(b.x + 6, Math.round(s.y) + 0.5);
      ctx.lineTo(b.x + b.w - 6, Math.round(s.y) + 0.5);
    } else {
      ctx.moveTo(Math.round(s.x) + 0.5, b.y + 6);
      ctx.lineTo(Math.round(s.x) + 0.5, b.y + b.h - 6);
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ============ 像素工具：1 逻辑像素 = 1 美术像素 ============ */
// 游戏逻辑分辨率就是 640×480（Undertale 原生大小），所以所有美术都按 1px 方块画，
// 有机形状一律用离屏小画布预渲染，再关掉平滑贴回来，保证放大/运镜时不糊。
const spriteCache = new Map();

function pixelSprite(key, w, h, paint) {
  let c = spriteCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  paint(g, c.width, c.height);
  spriteCache.set(key, c);
  return c;
}

function blitSprite(c, cx, cy, alpha) {
  ctx.save();
  if (alpha != null) ctx.globalAlpha *= alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, Math.round(cx - c.width / 2), Math.round(cy - c.height / 2));
  ctx.restore();
}

function pixLine(g, x0, y0, x1, y1, color, thick) {
  thick = thick || 1;
  x0 = Math.round(x0); y0 = Math.round(y0);
  x1 = Math.round(x1); y1 = Math.round(y1);
  g.fillStyle = color;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  let guard = 0;
  while (guard++ < 600) {
    g.fillRect(x0, y0, thick, thick);
    if (x0 === x1 && y0 === y1) break;
    const e2 = err * 2;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}

function pixDiamond(cx, cy, rx, ry, color, thick) {
  ctx.save();
  pixLine(ctx, cx, cy - ry, cx + rx, cy, color, thick || 1);
  pixLine(ctx, cx + rx, cy, cx, cy + ry, color, thick || 1);
  pixLine(ctx, cx, cy + ry, cx - rx, cy, color, thick || 1);
  pixLine(ctx, cx - rx, cy, cx, cy - ry, color, thick || 1);
  ctx.restore();
}

function pixEllipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    const dy = (y - cy) / ry;
    const w = Math.sqrt(Math.max(0, 1 - dy * dy)) * rx;
    if (w < 0.4) continue;
    g.fillRect(Math.round(cx - w), y, Math.round(w * 2) || 1, 1);
  }
}

function pixelDisc(cx, cy, n, cell, color, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  for (let i = -n; i <= n; i++) {
    const half = Math.sqrt(Math.max(0, n * n - i * i)) * cell;
    const hw = Math.round(half / cell) * cell;
    ctx.fillRect(Math.round(cx - hw), Math.round(cy + i * cell), hw * 2, cell);
  }
  ctx.restore();
}

function pixCircle(cx, cy, r, color, alpha) {
  const R = Math.max(1, Math.round(r));
  ctx.save();
  ctx.globalAlpha *= alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  for (let dy = -R; dy <= R; dy++) {
    const w = Math.floor(Math.sqrt(Math.max(0, R * R - dy * dy)));
    if (w < 0) continue;
    ctx.fillRect(Math.round(cx) - w, Math.round(cy) + dy, w * 2 + 1, 1);
  }
  ctx.restore();
}

function pixRing(cx, cy, r, lw, color, alpha) {
  const R = Math.max(1, Math.round(r));
  const r0 = Math.max(0, R - Math.max(1, Math.round(lw)));
  ctx.save();
  ctx.globalAlpha *= alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  for (let dy = -R; dy <= R; dy++) {
    const o = Math.floor(Math.sqrt(Math.max(0, R * R - dy * dy)));
    const i = r0 > 0 ? Math.floor(Math.sqrt(Math.max(0, r0 * r0 - dy * dy))) : -1;
    if (o <= i) continue;
    const x = Math.round(cx), y = Math.round(cy) + dy;
    ctx.fillRect(x - o, y, o - i, 1);
    ctx.fillRect(x + i + 1, y, o - i, 1);
  }
  ctx.restore();
}

function pixDashRect(x, y, w, h, color, alpha, dash, gap, offset) {
  ctx.save();
  ctx.globalAlpha *= alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y);
  w = Math.round(w); h = Math.round(h);
  const step = dash + gap;
  const o = ((Math.round(offset || 0) % step) + step) % step;
  for (let t = -o; t < w; t += step) {
    const s = Math.max(0, t), e = Math.min(w, t + dash);
    if (e > s) {
      ctx.fillRect(x + s, y, e - s, 1);
      ctx.fillRect(x + s, y + h - 1, e - s, 1);
    }
  }
  for (let t = -o; t < h; t += step) {
    const s = Math.max(0, t), e = Math.min(h, t + dash);
    if (e > s) {
      ctx.fillRect(x, y + s, 1, e - s);
      ctx.fillRect(x + w - 1, y + s, 1, e - s);
    }
  }
  ctx.restore();
}

function pixDashPolyline(pts, color, alpha, dash, gap, offset, thick) {
  ctx.save();
  ctx.globalAlpha *= alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  const step = dash + gap;
  let travel = offset || 0;
  for (let i = 1; i < pts.length; i++) {
    const ax = pts[i - 1].x, ay = pts[i - 1].y, bx = pts[i].x, by = pts[i].y;
    const len = Math.hypot(bx - ax, by - ay);
    const n = Math.max(1, Math.ceil(len * 1.5));
    for (let s = 0; s <= n; s++) {
      const t = s / n;
      const d = travel + len * t;
      if (((d % step) + step) % step < dash) {
        ctx.fillRect(Math.round(ax + (bx - ax) * t), Math.round(ay + (by - ay) * t), thick || 1, thick || 1);
      }
    }
    travel += len;
  }
  ctx.restore();
}

function orbSprite(r, tint, karmic) {
  const S = 2 * r + 3, c = r + 1;
  return pixelSprite('orb-' + r + '-' + tint + (karmic ? '-k' : ''), S, S, (g) => {
    g.fillStyle = tint;
    for (let dy = -r; dy <= r; dy++) {
      const hw = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
      g.fillRect(c - hw, c + dy, hw * 2 + 1, 1);
    }
    // 下缘一像素暗边，给球一点体积
    g.fillStyle = 'rgba(18,10,14,0.22)';
    for (let dy = 1; dy <= r; dy++) {
      const hw = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
      if (hw > 0) g.fillRect(c + hw, c + dy, 1, 1);
    }
    if (karmic) {
      g.fillStyle = '#ff2f45';
      g.fillRect(c - 1, c - 1, 3, 3);
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.fillRect(c - 1, c - 1, 1, 1);
    }
  });
}

function boneSprite(w, h, color) {
  return pixelSprite('bone-' + w + 'x' + h + '-' + color, w, h, (g) => {
    const vertical = h >= w;
    const fill = color === 'blue' ? '#a9d6ff' : color === 'orange' ? '#ffc98f' : '#ffffff';
    g.fillStyle = fill;
    // 像素圆角：四个角各切 1px
    g.fillRect(1, 0, Math.max(1, w - 2), h);
    g.fillRect(0, 1, w, Math.max(1, h - 2));
    // 骨端鼓起一格，读起来像骨头而不再是色块
    if (vertical && w > 4) {
      g.fillRect(0, 1, w, 2);
      g.fillRect(0, Math.max(1, h - 3), w, 2);
    } else if (!vertical && h > 4) {
      g.fillRect(1, 0, 2, h);
      g.fillRect(Math.max(1, w - 3), 0, 2, h);
    }
    // 高光：迎光面一条 1px 亮线
    g.fillStyle = 'rgba(255,255,255,0.55)';
    if (vertical) g.fillRect(1, 1, 1, Math.max(1, h - 2));
    else g.fillRect(1, 1, Math.max(1, w - 2), 1);
    // 右下 1px 暗面
    g.fillStyle = 'rgba(18,10,14,0.26)';
    if (vertical) g.fillRect(w - 1, 2, 1, Math.max(1, h - 4));
    else g.fillRect(2, h - 1, Math.max(1, w - 4), 1);
    // 关节缝：每 14px 一道，长骨看起来是一节节接起来的
    g.fillStyle = '#0b0709';
    if (vertical) {
      for (let y = 8; y < h - 4; y += 14) g.fillRect(1, y, Math.max(1, w - 2), 1);
      if (h > 13) { g.fillRect(1, 4, Math.max(1, w - 2), 1); g.fillRect(1, h - 5, Math.max(1, w - 2), 1); }
    } else if (w > 13) {
      for (let x = 8; x < w - 4; x += 14) g.fillRect(x, 1, 1, Math.max(1, h - 2));
      g.fillRect(4, 1, 1, Math.max(1, h - 2));
      g.fillRect(w - 5, 1, 1, Math.max(1, h - 2));
    }
    // 彩色骨：内部一层同色微光，黑底上更容易分辨
    if (color === 'blue' || color === 'orange') {
      g.fillStyle = color === 'blue' ? 'rgba(80,160,255,0.35)' : 'rgba(255,150,40,0.35)';
      if (vertical) g.fillRect(Math.max(1, w - 3), 2, 1, Math.max(1, h - 4));
      else g.fillRect(2, Math.max(1, h - 3), Math.max(1, w - 4), 1);
    }
  });
}

function shardSprite(r) {
  const S = 2 * r + 10, c = Math.floor(S / 2);
  return pixelSprite('shard-' + r, S, S, (g) => {
    g.fillStyle = '#ffffff';
    for (let k = -1; k <= 1; k++) {
      const y0 = c + k * 5;
      for (let x = -r; x <= r; x++) {
        if (k !== 0 && Math.abs(x) > r - 2) continue;
        const y = y0 - Math.round(x * 0.22);
        g.fillRect(c + x, y, 1, 2);
      }
    }
  });
}

function pawSprite() {
  const S = 20, c = 10;
  return pixelSprite('paw', S, S, (g) => {
    // 猫爪印：一块掌垫 + 上方四颗脚趾，黑白分明
    pixEllipse(g, c, c + 3, 4.6, 4.2, '#ffffff');
    const toes = [[c - 6, c - 3], [c - 2, c - 5.5], [c + 2, c - 5.5], [c + 6, c - 3]];
    for (const t of toes) pixEllipse(g, t[0], t[1], 1.9, 2.1, '#ffffff');
  });
}

function bellSprite() {
  return pixelSprite('bell', 20, 22, (g) => {
    // 红绳
    g.fillStyle = 'rgba(255,60,80,0.9)';
    g.fillRect(10, 0, 1, 3);
    g.fillStyle = 'rgba(18,10,14,0.55)';
    g.fillRect(9, 3, 3, 1);
    // 铃身
    g.fillStyle = '#ffffff';
    for (let y = 4; y <= 13; y++) {
      const half = 2 + Math.floor((y - 4) * 0.72);
      g.fillRect(10 - half, y, half * 2 + 1, 1);
    }
    // 铃口
    g.fillStyle = 'rgba(18,10,14,0.55)';
    g.fillRect(2, 13, 17, 1);
    // 铃舌
    g.fillStyle = '#ffffff';
    g.fillRect(9, 14, 3, 3);
    g.fillStyle = 'rgba(18,10,14,0.5)';
    g.fillRect(9, 16, 3, 1);
    // 内侧暗线
    g.fillStyle = 'rgba(18,10,14,0.2)';
    g.fillRect(6, 7, 1, 5);
  });
}

function sigilInnerSprite() {
  return pixelSprite('sigil-inner', 28, 28, (g) => {
    g.fillStyle = '#ffffff';
    pixLine(g, 14, 3, 25, 14, '#ffffff');
    pixLine(g, 25, 14, 14, 25, '#ffffff');
    pixLine(g, 14, 25, 3, 14, '#ffffff');
    pixLine(g, 3, 14, 14, 3, '#ffffff');
  });
}

function catEyeSprite() {
  return pixelSprite('cateye', 36, 15, (g) => {
    // 外框：扁菱形
    pixLine(g, 2, 7, 18, 2, 'rgba(255,255,255,0.95)');
    pixLine(g, 18, 2, 34, 7, 'rgba(255,255,255,0.95)');
    pixLine(g, 34, 7, 18, 12, 'rgba(255,255,255,0.95)');
    pixLine(g, 18, 12, 2, 7, 'rgba(255,255,255,0.95)');
    // 虹膜：更小的菱形
    for (let y = 4; y <= 10; y++) {
      const hw = Math.round((1 - Math.abs(y - 7) / 3.4) * 10);
      if (hw > 0) {
        g.fillStyle = 'rgba(255,34,58,0.92)';
        g.fillRect(18 - hw, y, hw * 2 + 1, 1);
      }
    }
    // 竖瞳
    g.fillStyle = 'rgba(20,4,10,0.95)';
    g.fillRect(17, 4, 1, 7);
    // 高光
    g.fillStyle = 'rgba(255,190,200,0.95)';
    g.fillRect(14, 6, 1, 1);
  });
}

function tipSprite(red) {
  return pixelSprite('tip-' + (red ? 'red' : 'white'), 24, 20, (g) => {
    g.fillStyle = '#ffffff';
    pixLine(g, 21, 10, 9, 2, '#ffffff');
    pixLine(g, 9, 2, 6, 10, '#ffffff');
    pixLine(g, 6, 10, 9, 18, '#ffffff');
    pixLine(g, 9, 18, 21, 10, '#ffffff');
    if (red) {
      pixLine(g, 17, 10, 9, 5, '#e81633', 2);
      pixLine(g, 9, 5, 8, 10, '#e81633', 2);
      pixLine(g, 8, 10, 9, 15, '#e81633', 2);
      pixLine(g, 9, 15, 17, 10, '#e81633', 2);
      g.fillStyle = 'rgba(255,235,240,0.95)';
      g.fillRect(11, 9, 2, 2);
    }
  });
}


// 恶魔猫尾：白色像素尾巴 / 蓝色静止尾 / 橙色业火尾。
// 矩形判定不变，视觉上一节一节的白骨尾巴，带关节缝和 1px 暗面。
function drawBone(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  const w = Math.max(3, Math.round(b.w)), h = Math.max(3, Math.round(b.h));

  // 出场预警：逐格虚线框
  if (b.delay > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 26);
    pixDashRect(x - 3, y - 3, w + 6, h + 6, '#ffffff', 0.25 + 0.3 * pulse, 4, 4, -time * 30);
  }
  if (b.growState === 'warn') return;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(boneSprite(w, h, b.color), x, y);
  ctx.restore();

  // 二阶段：只在一侧留 1px 红边
  if (darkMode()) {
    ctx.fillStyle = 'rgba(255,60,80,0.55)';
    if (h >= w) ctx.fillRect(x + w - 1, y + 3, 1, Math.max(0, h - 6));
    else ctx.fillRect(x + 3, y + h - 1, Math.max(0, w - 6), 1);
  }

  if (b.hitT > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(x - 1, y - 1, w + 2, 1);
    ctx.fillRect(x - 1, y + h, w + 2, 1);
    ctx.fillRect(x - 1, y, 1, h);
    ctx.fillRect(x + w, y, 1, h);
  }
}


// 毛线球：像素圆 + 一像素暗边 + 线头，运行时只贴图
function drawOrb(b) {
  const r = Math.max(3, Math.round(b.r || 5));
  const col = b.color || C.white;
  const tint = col === C.green ? '#5ee07f'
    : col === C.yellow ? '#ffd84a'
      : col === C.blue ? '#7ec2ff'
        : col === C.orange ? '#ffb066'
          : '#ffffff';
  const karmic = !!b.karmic;
  const cx = Math.round(b.x), cy = Math.round(b.y);

  // 残影：像素点
  if (b.tr && b.tr.length > 1) {
    for (let i = 0; i < b.tr.length - 1; i++) {
      const g = b.tr[i];
      ctx.fillStyle = tint;
      ctx.globalAlpha = 0.1 + i * 0.05;
      ctx.fillRect(Math.round(g.x), Math.round(g.y), 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // 线头：沿速度反方向铺 1px 点
  const ang = Math.atan2(b.vy || 0, b.vx || 0) + Math.PI;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  ctx.fillStyle = '#ffffff';
  for (let i = r + 1; i < r + 11; i++) {
    ctx.globalAlpha = 0.8 - (i - r) * 0.06;
    ctx.fillRect(Math.round(cx + ca * i), Math.round(cy + sa * i), 1, 1);
  }
  ctx.globalAlpha = 1;

  // 放射光尾：太阳芒弹幕用渐细长尾，远看就是一束光
  if (b.ray) {
    const len = b.ray;
    const steps = 12;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(b.vy || 0, b.vx || 0));
    ctx.fillStyle = tint;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const w2 = Math.max(1, Math.round(r * (1 - t) + 1));
      ctx.globalAlpha = (1 - t) * (0.5 + 0.3 * (b.rayPulse || 0));
      ctx.fillRect(-Math.round(len * t), -(w2 >> 1), w2, w2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  blitSprite(orbSprite(r, tint, karmic), cx, cy);

  // 分裂倒计时：像素点环
  if (b.split > 0) {
    const pu = 0.5 + 0.5 * Math.sin(time * 16);
    const rr = r + 3 + Math.floor(pu * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.3 * pu).toFixed(3) + ')';
    for (let i = 0; i < 14; i++) {
      if ((i + Math.floor(time * 10)) % 2) continue;
      const a2 = i / 14 * Math.PI * 2;
      ctx.fillRect(Math.round(cx + Math.cos(a2) * rr), Math.round(cy + Math.sin(a2) * rr), 1, 1);
    }
  }
  if (b.hitT > 0) pixRing(cx, cy, r + 2, 1, '#ffffff', 0.95);
}


// 爪刃：三道阶梯状白色爪痕，整张 sprite 旋转
function drawShard(b) {
  const r = Math.max(4, Math.round(b.r || 6));
  const spr = shardSprite(r);
  const cx = Math.round(b.x), cy = Math.round(b.y);

  // 残影
  if (b.tr && b.tr.length > 1) {
    for (let i = 0; i < b.tr.length - 1; i++) {
      const g = b.tr[i];
      ctx.save();
      ctx.globalAlpha = 0.05 + i * 0.035;
      ctx.translate(Math.round(g.x), Math.round(g.y));
      ctx.rotate(b.rot || 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(spr, -Math.floor(spr.width / 2), -Math.floor(spr.height / 2));
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(b.rot || 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -Math.floor(spr.width / 2), -Math.floor(spr.height / 2));
  ctx.restore();

  if (b.hitT > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(cx - r - 2, cy - r - 2, r * 2 + 4, 1);
    ctx.fillRect(cx - r - 2, cy + r + 1, r * 2 + 4, 1);
    ctx.fillRect(cx - r - 2, cy - r - 2, 1, r * 2 + 4);
    ctx.fillRect(cx + r + 1, cy - r - 2, 1, r * 2 + 4);
  }
}


// 框内审判光束：矩形白芯 + 像素红边 + 扫描线，不发光晕
function drawBeam(b) {
  const rr = beamRect(b);
  const x = Math.round(rr.x), y = Math.round(rr.y);
  const w = Math.max(2, Math.round(rr.w)), h = Math.max(2, Math.round(rr.h));
  const vertical = b.dir === 'top' || b.dir === 'bottom';

  if (b.t < b.warn) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 22);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(x, y, w, h);
    pixDashRect(x, y, w, h, '#ffffff', 0.4 + 0.35 * pulse, 6, 5, -time * 40);
    const span = vertical ? h : w;
    const off = Math.floor((time * 120) % 24);
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    for (let p = off; p < span; p += 24) {
      if (vertical) ctx.fillRect(x, y + p, w, 1);
      else ctx.fillRect(x + p, y, 1, h);
    }
  } else if (b.t < b.warn + b.fire) {
    const k = clamp((b.t - b.warn) / b.fire, 0, 1);
    // 2px 红边
    ctx.fillStyle = `rgba(255,40,70,${(0.8 - 0.35 * k).toFixed(3)})`;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, w, h);
    // 内侧红雾
    ctx.fillStyle = `rgba(255,60,90,${(0.28 - 0.16 * k).toFixed(3)})`;
    if (vertical) {
      ctx.fillRect(x, y + 2, 2, h - 4);
      ctx.fillRect(x + w - 2, y + 2, 2, h - 4);
    } else {
      ctx.fillRect(x + 2, y, w - 4, 2);
      ctx.fillRect(x + 2, y + h - 2, w - 4, 2);
    }
    // 流动刻线
    const span = vertical ? h : w;
    const off = Math.floor((time * 240) % 18);
    ctx.fillStyle = 'rgba(255,90,115,0.26)';
    for (let p = off - 18; p < span; p += 18) {
      if (p < 1) continue;
      if (vertical) ctx.fillRect(x + 2, y + p, w - 4, 1);
      else ctx.fillRect(x + p, y + 2, 1, h - 4);
    }
    // 中心亮线
    ctx.fillStyle = '#ffffff';
    if (vertical) ctx.fillRect(x + (w >> 1), y, 1, h);
    else ctx.fillRect(x, y + (h >> 1), w, 1);
    // 端点像素爆闪
    const ex = vertical ? x + (w >> 1) : x + w;
    const ey = vertical ? y + h : y + (h >> 1);
    const fs = Math.round(5 * (1 - k)) + 1;
    ctx.fillStyle = `rgba(255,255,255,${(0.85 * (1 - k)).toFixed(3)})`;
    ctx.fillRect(ex - (fs >> 1), ey - (fs >> 1), fs, fs);
    ctx.fillStyle = `rgba(255,60,90,${(0.7 * (1 - k)).toFixed(3)})`;
    ctx.fillRect(ex - 7, ey, 14, 1);
    ctx.fillRect(ex, ey - 7, 1, 14);
  }
}


// 非全场光束的源头魔瞳：画在战斗框裁剪之外，保证不会被裁掉
function drawBeamEye(b) {
  const bb = arenaBoxes[b.arena || 0] || box;
  const r = beamRect(b);
  const vertical = b.dir === 'top' || b.dir === 'bottom';
  let ex, ey;
  if (b.dir === 'top') { ex = clamp(r.x + r.w / 2, bb.x + 18, bb.x + bb.w - 18); ey = bb.y - 26; }
  else if (b.dir === 'bottom') { ex = clamp(r.x + r.w / 2, bb.x + 18, bb.x + bb.w - 18); ey = bb.y + bb.h + 26; }
  else if (b.dir === 'left') { ex = bb.x - 26; ey = clamp(r.y + r.h / 2, bb.y + 18, bb.y + bb.h - 18); }
  else { ex = bb.x + bb.w + 26; ey = clamp(r.y + r.h / 2, bb.y + 18, bb.y + bb.h - 18); }
  ex = clamp(ex, 16, W - 16);
  ey = clamp(ey, 16, H - 16);

  // 骷髅炮口朝向战斗框：先蓄力张嘴，再吐光束
  const ang = b.dir === 'top' ? Math.PI / 2
    : b.dir === 'bottom' ? -Math.PI / 2
      : b.dir === 'left' ? 0 : Math.PI;
  const t = b.t;
  let open = 0;
  if (t < b.warn) open = clamp(t / Math.max(0.05, b.warn), 0, 1) * 0.55;
  else if (t < b.warn + b.fire) open = 1;
  else open = clamp(1 - (t - b.warn - b.fire) / 0.2, 0, 1) * 0.5;
  drawBlasterSkull(ex, ey, ang, open, b.full ? 1.15 : 1);

  // 蓄力光核
  if (t < b.warn + b.fire) {
    const k = clamp(t / b.warn, 0, 1.2);
    const rad = 2 + k * 5;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.4 * k).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(ex, ey, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,70,100,0.5)';
    ctx.beginPath();
    ctx.arc(ex, ey, Math.max(1, rad - 2), 0, Math.PI * 2);
    ctx.fill();
  }
}

// 恶魔骨龙头：本地坐标里炮口朝 +x，白骨骷髅 + 红色竖瞳，张嘴幅度由 open 控制
function drawBlasterSkull(cx, cy, ang, open, scale) {
  const s = scale || 1;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(ang);
  ctx.scale(s, s);
  ctx.imageSmoothingEnabled = false;

  // 颅骨
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-20, -10, 20, 20);
  ctx.fillRect(-16, -14, 12, 4);
  ctx.fillRect(-16, 10, 12, 4);
  ctx.fillRect(-23, -7, 3, 14);
  // 角（猫耳）
  ctx.fillRect(-20, -16, 5, 5);
  ctx.fillRect(-15, -19, 3, 4);
  ctx.fillRect(-20, 12, 5, 5);
  ctx.fillRect(-15, 15, 3, 4);
  // 吻部
  ctx.fillRect(0, -7, 12, 14);
  ctx.fillRect(12, -4, 5, 8);
  // 下颌：随 open 张开
  const jaw = Math.round(open * 4);
  ctx.fillRect(2, 7, 12, 3 + jaw);
  ctx.fillRect(14, 4, 3, 2 + jaw);
  // 上牙
  ctx.fillStyle = '#0b0709';
  ctx.fillRect(4, 4, 9, 2);
  for (let i = 0; i < 4; i++) ctx.fillRect(5 + i * 2, 3, 1, 1);
  // 下牙
  ctx.fillRect(4, 7 + jaw, 9, 1);
  // 眼窝 + 竖瞳
  ctx.fillRect(-8, -4, 7, 6);
  ctx.fillStyle = '#ff2b46';
  ctx.fillRect(-6, -3, 2, 4);
  ctx.fillStyle = '#ffd6dd';
  ctx.fillRect(-6, -3, 1, 1);
  // 颧骨阴影
  ctx.fillStyle = 'rgba(18,10,14,0.35)';
  ctx.fillRect(-2, -8, 2, 16);
  ctx.restore();
}

// 刀光：旋转细长条，预警时只画一条红色虚线刀轨
function drawBlade(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  const ang = b.ang || 0;
  const half = (b.len || 120) / 2;
  const r = Math.max(3, b.r || 5);
  const edge = b.color === 'orange' ? '#ffb066' : b.color === 'blue' ? '#8fc8ff' : '#ff3b5c';

  if (b.delay > 0) {
    const pulse = 0.45 + 0.35 * Math.sin(time * 24);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = 'rgba(255,80,110,' + pulse.toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.lineDashOffset = -time * 40;
    ctx.beginPath();
    ctx.moveTo(-half, 0);
    ctx.lineTo(half, 0);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,120,150,0.9)';
    ctx.fillRect(half - 5, -1, 5, 2);
    ctx.fillRect(-half, -1, 5, 2);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  // 外缘血光
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = edge;
  ctx.fillRect(-half, -r / 2 - 1, half * 2, r + 2);
  ctx.globalAlpha = 1;
  // 刀身
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-half, -r / 2, half * 2, r);
  // 两侧刀尖
  ctx.fillRect(half, -1, 4, 2);
  ctx.fillRect(-half - 4, -1, 4, 2);
  // 血槽
  ctx.fillStyle = edge;
  ctx.fillRect(-half + 5, 0, half * 2 - 10, 1);
  // 流动高光
  const fl = 0.5 + 0.5 * Math.sin(time * 34 + half);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * fl).toFixed(3) + ')';
  ctx.fillRect(-half, -r / 2, half * 2, 1);
  ctx.restore();
}

function drawBullet(b) {
  if (b.kind === 'bone') drawBone(b);
  else if (b.kind === 'shard') drawShard(b);
  else if (b.kind === 'blade') drawBlade(b);
  else if (b.kind === 'paw') drawPaw(b);
  else if (b.kind === 'note') drawNote(b);
  else if (b.kind === 'sigil') drawSigil(b);
  else drawOrb(b);
}

// 像素猫爪：掌垫 + 四趾 + 白色爪尖 + 拖尾残影
// 猫爪：白色剪影 + 四趾，去掉厚描边，只留一层柔光
// 猫爪：像素剪影，掌垫 + 四趾 + 拖尾点
function drawPaw(b) {
  const sc = (b.r || 11) / 10;

  if (b.tr && b.tr.length > 1) {
    for (let i = 0; i < b.tr.length - 1; i++) {
      const g = b.tr[i];
      pixCircle(g.x, g.y, Math.max(2, 5 * sc), '#ffffff', 0.05 + i * 0.04);
    }
  }

  const spr = pawSprite();
  ctx.save();
  ctx.translate(Math.round(b.x), Math.round(b.y));
  ctx.rotate(b.rot || 0);
  ctx.scale(sc, sc);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -10, -10);
  ctx.restore();
}


// 猫铃铛：铃身 + 铃舌 + 红丝带，响铃时两侧荡开波纹
// 猫铃铛：白铃身 + 细线细节 + 一条红绳，响铃时只有一圈细弧
// 猫铃铛：像素铃身 + 红绳 + 铃舌，响铃时只有左右各三个像素点
function drawNote(b) {
  const red = b.color === C.red;
  const body = red ? '#ffe6e9' : '#ffffff';

  if (b.tr && b.tr.length > 1) {
    for (let i = 0; i < b.tr.length - 1; i++) {
      const g = b.tr[i];
      ctx.fillStyle = body;
      ctx.globalAlpha = 0.1 + i * 0.05;
      ctx.fillRect(Math.round(g.x), Math.round(g.y), 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  const spr = bellSprite();
  ctx.save();
  ctx.translate(Math.round(b.x), Math.round(b.y));
  ctx.rotate(b.rot || 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -10, -11);
  ctx.restore();

  // 响铃：左右各三点，向外扩散
  const ring = 0.4 + 0.6 * Math.abs(Math.sin(time * 9 + (b.phase || 0)));
  for (let i = 0; i < 3; i++) {
    const rr = 12 + i * 2;
    const al = (0.2 + 0.3 * ring) * (1 - i * 0.22);
    ctx.fillStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')';
    ctx.fillRect(Math.round(b.x + rr * 0.86), Math.round(b.y - 6 - i * 2), 1, 1);
    ctx.fillRect(Math.round(b.x - rr * 0.86), Math.round(b.y - 6 - i * 2), 1, 1);
  }
}


// 恶魔契约印：虚线环 + 五芒星 + 竖瞳，倒数结束后炸开
// 恶魔契约印：细白菱形环 + 一只细菱形眼，倒数结束炸开
// 恶魔契约印：像素菱形环 + 一只细菱形红眼，倒数结束炸开
function drawSigil(b) {
  const r = b.r || 12;
  const warn = b.warnT != null ? b.warnT : 0.8;
  const k = clamp(1 - warn / 0.9, 0, 1);
  const pulse = 0.55 + 0.45 * Math.sin(time * (10 + 14 * k));
  const R = Math.round(r + (1 - k) * 10);
  const ry = Math.round(R * 1.15);
  const cx = Math.round(b.x), cy = Math.round(b.y);

  ctx.save();
  ctx.globalAlpha = 0.5 + 0.4 * pulse;
  pixDiamond(cx, cy, R, ry, '#ffffff');

  // 内菱形，慢慢反向转
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * 0.6);
  ctx.globalAlpha = 0.25 + 0.3 * pulse;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sigilInnerSprite(), -14, -14);
  ctx.restore();

  // 两只小角
  ctx.globalAlpha = 0.62;
  pixLine(ctx, cx - Math.round(R * 0.5), cy - Math.round(R * 0.55), cx - Math.round(R * 0.72), cy - R, '#ffffff');
  pixLine(ctx, cx + Math.round(R * 0.5), cy - Math.round(R * 0.55), cx + Math.round(R * 0.72), cy - R, '#ffffff');

  // 细菱形眼
  ctx.globalAlpha = 1;
  const eh = Math.max(3, Math.round(r * 0.52));
  for (let yy = -eh; yy <= eh; yy++) {
    const t = 1 - Math.abs(yy) / (eh + 1);
    const hw = Math.round(t * 2.4);
    ctx.fillStyle = 'rgba(255,50,70,0.92)';
    ctx.fillRect(cx - hw, cy + yy, hw * 2 + 1, 1);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx, cy - Math.round(eh * 0.6), 1, Math.round(eh * 1.2) + 1);
  ctx.restore();
}


// 大风车的椭圆骨环
// 大风车：一格一格的像素骨臂，红芯 1px，尾尖像素菱形
function drawWheel(w) {
  const grow = clamp(w.t / 0.5, 0, 1);
  const fade = Math.min(
    1,
    w.t < 0.25 ? w.t / 0.25 : 1,
    clamp((w.life - w.t) / 0.45, 0, 1)
  );
  const thick = Math.max(2, Math.round(w.thick || 6));
  const cx = Math.round(w.cx), cy = Math.round(w.cy);
  const tip = tipSprite(false);

  ctx.save();
  ctx.globalAlpha = fade;

  // 残影：1px 点链
  ctx.globalAlpha = fade * 0.16;
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < w.arms; k++) {
    const ang = w.ang - w.speed * 0.08 + k * Math.PI * 2 / w.arms;
    const arm = wheelArm(w, ang);
    const endD = (arm.len + 8) * grow;
    const startD = Math.min(22, endD * 0.55);
    for (let d = startD; d <= endD; d += 3) {
      ctx.fillRect(Math.round(w.cx + arm.ca * d), Math.round(w.cy + arm.sa * d), 1, 1);
    }
  }

  ctx.globalAlpha = fade;
  for (let k = 0; k < w.arms; k++) {
    const ang = w.ang + k * Math.PI * 2 / w.arms;
    const arm = wheelArm(w, ang);
    const endD = (arm.len + 8) * grow;
    const startD = Math.min(22, endD * 0.55);
    if (endD <= startD) continue;

    // 白臂：沿方向铺方块，越靠近尾巴越细
    const step = Math.max(1, Math.round(thick * 0.55));
    for (let d = startD; d <= endD; d += step) {
      const px = Math.round(w.cx + arm.ca * d);
      const py = Math.round(w.cy + arm.sa * d);
      const t = (d - startD) / Math.max(1, endD - startD);
      const s = Math.max(1, Math.round(thick * (1 - t * 0.28)));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - (s >> 1), py - (s >> 1), s, s);
    }
    // 1px 红芯
    ctx.fillStyle = 'rgba(255,50,70,0.32)';
    for (let d = startD; d <= endD; d += 1) {
      ctx.fillRect(Math.round(w.cx + arm.ca * d), Math.round(w.cy + arm.sa * d), 1, 1);
    }

    // 尾尖
    const ex = Math.round(w.cx + arm.ca * endD);
    const ey = Math.round(w.cy + arm.sa * endD);
    const ta = Math.atan2(arm.sa, arm.ca);
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(ta);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tip, -12, -10);
    ctx.restore();
  }

  // 中心：像素菱形 + 红点
  const hubPulse = 0.5 + 0.5 * Math.sin(time * 14);
  ctx.save();
  ctx.globalAlpha = fade * (0.45 + 0.3 * hubPulse);
  pixDiamond(cx, cy, 13, 13, '#ffffff');
  ctx.restore();
  for (let dy = -3; dy <= 3; dy++) {
    const hw = 3 - Math.abs(dy);
    ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
  ctx.fillStyle = 'rgba(255,50,70,0.9)';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  ctx.restore();
}


// 黄魂射出的爪弹：三道金色爪痕向前飞
// 黄魂爪弹：三道像素爪痕 + 虚线尾迹
function drawShot(s) {
  const ang = Math.atan2(s.vy, s.vx);
  ctx.save();
  ctx.translate(Math.round(s.x), Math.round(s.y));
  ctx.rotate(ang);
  // 尾迹：短虚线
  ctx.fillStyle = C.yellow;
  ctx.globalAlpha = 0.55;
  for (let i = 10; i < 30; i += 4) ctx.fillRect(-i - 2, 0, 2, 1);
  ctx.globalAlpha = 1;
  // 爪痕
  for (let k = -1; k <= 1; k++) {
    const y0 = k * 4;
    for (let x = -8; x <= 8; x++) {
      const y = y0 - Math.round(Math.abs(x) * 0.14) + (k === 0 ? 0 : k);
      ctx.fillStyle = k === 0 ? '#ffffff' : C.yellow;
      ctx.fillRect(x, y, 1, 2);
    }
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(8, -1, 2, 2);
  ctx.restore();
}


// 屏幕外的审判之光：警告虚线 + 猫瞳，发射时白芯红雾
// 屏幕审判之光：像素边 + 白芯，警告时红点线
function drawLaser(b) {
  const r = beamRect(b);
  const x = Math.round(r.x), y = Math.round(r.y);
  const w = Math.max(2, Math.round(r.w)), h = Math.max(2, Math.round(r.h));
  const vertical = b.dir === 'top' || b.dir === 'bottom';
  const bb = arenaBoxes[b.arena || 0] || box;
  // 全场激光的眼睛钉在战斗框边缘，别飘到人物立绘上
  const eye = b.full
    ? (vertical
      ? {
        x: clamp(r.x + r.w / 2, bb.x + 20, bb.x + bb.w - 20),
        y: b.dir === 'top' ? bb.y + 16 : bb.y + bb.h - 16
      }
      : {
        x: b.dir === 'left' ? bb.x + 16 : bb.x + bb.w - 16,
        y: clamp(r.y + r.h / 2, bb.y + 20, bb.y + bb.h - 20)
      })
    : { x: r.x + r.w / 2, y: r.y + r.h / 2 };
  if (b.t < b.warn) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 20);
    ctx.fillStyle = `rgba(255,30,60,${(0.06 + pulse * 0.06).toFixed(3)})`;
    ctx.fillRect(x, y, w, h);
    const ptsA = vertical
      ? [{ x, y }, { x, y: y + h }]
      : [{ x, y }, { x: x + w, y }];
    const ptsB = vertical
      ? [{ x: x + w - 1, y }, { x: x + w - 1, y: y + h }]
      : [{ x, y: y + h - 1 }, { x: x + w, y: y + h - 1 }];
    pixDashPolyline(ptsA, '#ff5066', 0.6 + pulse * 0.35, 6, 5, -time * 50, 1);
    pixDashPolyline(ptsB, '#ff5066', 0.6 + pulse * 0.35, 6, 5, -time * 50, 1);
    drawCatEye(eye.x, eye.y, !vertical, 0.9 + 0.12 * pulse);
  } else if (b.t < b.warn + b.fire) {
    // 红色像素边包住白色光柱
    ctx.fillStyle = 'rgba(255,40,70,0.85)';
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,40,70,0.32)';
    if (vertical) {
      ctx.fillRect(x, y + 2, 2, h - 4);
      ctx.fillRect(x + w - 2, y + 2, 2, h - 4);
    } else {
      ctx.fillRect(x + 2, y, w - 4, 2);
      ctx.fillRect(x + 2, y + h - 2, w - 4, 2);
    }
    drawCatEye(eye.x, eye.y, !vertical, 1.35);
  }
}


// 像素化的恶魔之眼：粗方块拼出杏仁眼廓 + 竖瞳，全红三级配色
// 细菱形猫瞳：外圈一道白线，里里一颗细竖瞳
// 像素猫瞳：扁菱形白框 + 红菱形虹膜 + 1px 竖瞳
function drawCatEye(x, y, rot, scale) {
  const spr = catEyeSprite();
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (rot) ctx.rotate(Math.PI / 2);
  ctx.scale(scale, scale);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -Math.floor(spr.width / 2), -Math.floor(spr.height / 2));
  ctx.restore();
}


// 恶魔鞭：警告虚线 + 尖端蓄力环，挥出时分段渐细的黑红鞭身
// 恶魔鞭：警告时红色点线 + 落点小环，挥出时红白像素方块串
function drawLash(l) {
  const pts = lashPoints(l);
  const tip = pts[pts.length - 1];
  const firing = l.t >= l.warn;

  if (!firing) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 22);
    pixDashPolyline(pts, '#ff4058', 0.55 + pulse * 0.4, 8, 7, -time * 60, 2);
    // 横扫鞭：先给出的暗红劈砍路径
    if (l.sweep) {
      pixDashPolyline([{ x: l.sx, y: l.sy }, { x: l.ex, y: l.ey }], '#ff4662', 0.32, 5, 11, -time * 80, 2);
    }
    // 尖端的小环
    const rr = 10 + pulse * 7;
    ctx.fillStyle = 'rgba(255,64,88,' + (0.5 + pulse * 0.45).toFixed(3) + ')';
    for (let i = 0; i < 12; i++) {
      if ((i + Math.floor(time * 8)) % 2) continue;
      const a = i / 12 * Math.PI * 2;
      ctx.fillRect(Math.round(tip.x + Math.cos(a) * rr), Math.round(tip.y + Math.sin(a) * rr), 1, 1);
    }
    // 落点上的猫爪印
    ctx.globalAlpha = 0.5 + pulse * 0.4;
    ctx.fillStyle = 'rgba(255,90,110,0.95)';
    ctx.fillRect(Math.round(tip.x) - 6, Math.round(tip.y) + 2, 3, 3);
    ctx.fillRect(Math.round(tip.x) - 2, Math.round(tip.y) - 2, 3, 3);
    ctx.fillRect(Math.round(tip.x) + 2, Math.round(tip.y) + 2, 3, 3);
    ctx.fillRect(Math.round(tip.x) - 2, Math.round(tip.y) + 5, 4, 3);
    ctx.globalAlpha = 1;
    return;
  }

  const fade = clamp(1 - (l.t - l.warn) / (l.fire + 0.16), 0, 1);
  ctx.save();
  ctx.globalAlpha = fade;
  // 横扫鞭：已扫过的区域留一串暗红方块
  if (l.sweep) {
    const sx = l.sx, sy = l.sy, ex = tip.x, ey = tip.y;
    const len = Math.hypot(ex - sx, ey - sy);
    const n = Math.max(1, Math.ceil(len / 6));
    ctx.fillStyle = 'rgba(255,50,70,0.14)';
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      ctx.fillRect(Math.round(sx + (ex - sx) * t) - 2, Math.round(sy + (ey - sy) * t) - 2, 4, 4);
    }
  }
  // 鞭身：逐像素铺红块，连成一条像素鞭，中心压一条白芯
  let ph = 0;
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i - 1], p1 = pts[i];
    const seg = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    const n = Math.max(1, Math.ceil(seg));
    const k0 = (i - 1) / (pts.length - 1);
    const k1 = i / (pts.length - 1);
    for (let s = 0; s < n; s++) {
      const t = s / n;
      const x = p0.x + (p1.x - p0.x) * t;
      const y = p0.y + (p1.y - p0.y) * t;
      const k = k0 + (k1 - k0) * t;
      const size = Math.max(2, Math.round(9 * (1 - k * 0.72)));
      ctx.fillStyle = Math.floor(ph / 6) % 2 ? 'rgba(110,6,18,0.95)' : 'rgba(226,18,44,0.95)';
      ctx.fillRect(Math.round(x) - (size >> 1), Math.round(y) - (size >> 1), size, size);
      const cs = Math.max(1, Math.round(2 * (1 - k * 0.5)));
      ctx.fillStyle = 'rgba(255,235,240,0.9)';
      ctx.fillRect(Math.round(x) - (cs >> 1), Math.round(y) - (cs >> 1), cs, cs);
      ph++;
    }
  }
  // 尾梢毛簇
  ctx.fillStyle = 'rgba(255,120,140,0.55)';
  for (let i = Math.max(1, pts.length - 9); i < pts.length; i += 2) {
    const p0 = pts[i - 1], p1 = pts[i];
    const a = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    const len = 3 + (i % 3);
    ctx.fillRect(Math.round(p1.x - Math.sin(a) * len), Math.round(p1.y + Math.cos(a) * len), 1, 1);
  }
  // 铲形尾尖
  const prev = pts[pts.length - 2] || tip;
  const ta = Math.atan2(tip.y - prev.y, tip.x - prev.x);
  ctx.save();
  ctx.translate(Math.round(tip.x), Math.round(tip.y));
  ctx.rotate(ta);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tipSprite(true), -12, -10);
  ctx.restore();
  ctx.restore();
}

// 二阶段的漂浮红光尘，给弹幕场加一点空气感
function drawMotes() {
  if (!darkMode()) return;
  ctx.save();
  for (let i = 0; i < 20; i++) {
    const speed = 8 + (i % 4) * 5;
    const x = (hash01(i + 11) * W + time * speed) % W;
    const y = H - ((hash01(i + 21) * H + time * (14 + (i % 5) * 6)) % H);
    ctx.globalAlpha = 0.08 + 0.12 * hash01(i + 31);
    ctx.fillStyle = i % 5 === 0 ? 'rgba(255,255,255,0.8)' : 'rgba(255,55,75,0.9)';
    ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  ctx.restore();
}

function drawEffects() {
  for (const e of effects) {
    if (e.kind === 'text') {
      const a = 1 - e.t / e.dur;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `bold 19px ${MONO}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = e.color;
      ctx.fillText(e.text, e.x, e.y);
      ctx.restore();
    } else if (e.kind === 'ring') {
      const k = clamp(e.t / e.dur, 0, 1);
      const ease = 1 - (1 - k) * (1 - k);
      pixRing(e.x, e.y, e.r0 + (e.r1 - e.r0) * ease, Math.max(1, e.lw * (1 - k)), e.color, 1 - k);
    }
  }
}

function drawSparks() {
  for (const s of sparks) {

function hash01(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function drawDeathFx() {
  if (!deathFx) return;
  const t = deathFx.t;
  const cx = 320, cy = 140;
  const fade = clamp(1 - Math.max(0, t - 1.2) / 1.2, 0, 1);

  ctx.save();
  ctx.globalAlpha = fade * 0.9;
  ctx.translate(cx, cy);
  for (let i = 0; i < 14; i++) {
    const a = i * Math.PI * 2 / 14 + t * 0.25;
    const len = 120 + Math.sin(t * 4 + i) * 46 + t * 40;
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255,60,80,0.75)' : 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.028) * len, Math.sin(a - 0.028) * len);
    ctx.lineTo(Math.cos(a + 0.028) * len, Math.sin(a + 0.028) * len);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = fade;
  ctx.strokeStyle = 'rgba(255,60,80,0.6)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const a = i * 0.7 + 0.3;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30);
    ctx.lineTo(cx + Math.cos(a) * 260, cy + Math.sin(a) * 260);
    ctx.stroke();
  }
  ctx.restore();

  if (stageImg.complete && stageImg.naturalWidth) {
    for (const s of deathShards) {
      if (s.delay > 0) continue;
      ctx.save();
      ctx.globalAlpha = s.a * fade;
      ctx.translate(s.dx + s.w / 2, s.dy + s.h / 2);
      ctx.rotate(s.rot);
      ctx.drawImage(stageImg, s.sx, s.sy, s.sw, s.sh, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }
  }

  if (t < 0.14) {
    ctx.save();
    ctx.globalAlpha = (1 - t / 0.14) * 0.85;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function drawEnding() {
  const type = ending ? ending.type : 'neutral';
  const et = ending ? ending.t : 0;
  const hard = !!(ending && ending.hard);
  const hardGenocide = type === 'fade' && hard && ending.route === 'genocide';
  const hardMercy = type === 'spare' && hard;
  const dark = type === 'genocide' || type === 'fade' || type === 'endurance';
  const a = clamp((et - (type === 'spare' ? 0.25 : 1.55)) / 0.8, 0, 1);

  if (dark) {
    ctx.fillStyle = '#060305';
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(320, 200, 20, 320, 200, 380);
    g.addColorStop(0, 'rgba(120,6,18,0.32)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(320, 230, 20, 320, 230, 360);
    g.addColorStop(0, type === 'spare' ? 'rgba(255,224,100,0.16)' : 'rgba(200,18,31,0.06)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (deathFx && type !== 'spare') drawDeathFx();

  // 第三阶段结局：白色羽毛落满走廊
  if (type === 'fade') {
    ctx.save();
    for (let i = 0; i < 46; i++) {
      const x = ((i * 73 + Math.sin(time * 0.6 + i) * 30 + et * (6 + (i % 5) * 2)) % (W + 80)) - 40;
      const y = ((i * 47 + et * (16 + (i % 4) * 8)) % (H + 60)) - 30;
      ctx.globalAlpha = (0.18 + 0.22 * Math.sin(time * 1.6 + i)) * clamp(et / 2, 0, 1);
      ctx.fillStyle = i % 5 === 0 ? 'rgba(255,120,140,0.7)' : 'rgba(255,255,255,0.8)';
      ctx.fillRect(Math.round(x), Math.round(y), 3, 10);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = a;

  // portrait
  const px = 58, py = 66, pw = 190, ph = 238;
  if (type === 'fade') drawPhase3Wings(px + pw / 2, py + ph / 2, 0.6, 0.1 + 0.03 * Math.sin(time * 1.5));
  if (stageImg.complete && stageImg.naturalWidth) {
    ctx.save();
    if (type === 'fade') ctx.globalAlpha = Math.max(0.12, 0.85 - et * 0.06);
    ctx.drawImage(stageImg, px, py, pw, ph);
    ctx.restore();
    if (type !== 'spare' && type !== 'fade') {
      ctx.fillStyle = dark ? 'rgba(8,3,6,0.72)' : 'rgba(255,255,255,0.62)';
      ctx.fillRect(px, py, pw, ph);
    }
  }
  ctx.strokeStyle = type === 'spare' ? 'rgba(200,160,20,0.6)' : (dark ? 'rgba(255,40,60,0.5)' : 'rgba(20,17,16,0.35)');
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px - 6, py - 6, pw + 12, ph + 12);

  if (type === 'spare') {
    ctx.save();
    ctx.globalAlpha = a * (0.5 + 0.2 * Math.sin(time * 2));
    ctx.shadowColor = C.yellow;
    ctx.shadowBlur = 20;
    drawHeart(px + pw - 26, py + 30, 2.2, '#ffe066');
    ctx.restore();
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  const label = hardGenocide ? 'GENOCIDE ENDING · HARD' : hardMercy ? 'TRUE MERCY ENDING' : type === 'genocide' ? 'GENOCIDE ENDING' : type === 'spare' ? 'MERCY ENDING' : type === 'fade' ? 'REGRET ENDING' : type === 'endurance' ? 'ENDURANCE CLEAR' : 'NEUTRAL ENDING';
  const title = hardGenocide ? '破碎之躯' : hardMercy ? '眷恋之心' : type === 'genocide' ? '审判者之死' : type === 'spare' ? '审判者的宽恕' : type === 'fade' ? '消散的审判者' : type === 'endurance' ? '第三百秒' : '未完成的审判';
  const labelColor = type === 'spare' ? '#c99a00' : (dark ? '#ff4656' : '#8c0b16');
  const titleColor = dark ? C.white : C.ink;
  const bodyColor = dark ? '#e7dede' : '#2d2925';
  const dimColor = dark ? '#8d8280' : C.dim;

  ctx.font = `bold 12px ${MONO}`;
  ctx.fillStyle = labelColor;
  ctx.fillText(label, 288, 60);

  ctx.font = `bold 27px ${CN}`;
  ctx.fillStyle = titleColor;
  ctx.fillText(title, 286, 84);

  const lines = hardMercy
    ? [
      'LFELKEEA：……第十次了，笨蛋。',
      'LFELKEEA：你就这么想让我原谅你吗。',
      'LFELKEEA：明明……我早就没在生气了。',
      '她放下手，慢慢靠过来，把额头抵在你肩上。',
      'LFELKEEA：别走。……这次，别再把我一个人留在这里。',
      '她的心跳落在你掌心，变成一颗温热的、眷恋着你的心。',
      '启动器里，她记住了你说过的每一句话。',
      '……这是你赢回来的「眷恋之心」。'
    ]
    : hardGenocide
      ? [
        'LFELKEEA：……啊。原来，被你杀死是这种感觉。',
        'LFELKEEA：别摆出那副表情。这是我自己选的路。',
        'LFELKEEA：我明明……还想再多陪你一会儿。',
        '她最后的光散成一片片白色的碎片。',
        '你伸手去接，掌心却只剩一具没有温度的躯壳。',
        '启动器里，她还会睁开眼，还会说话。',
        '只是不会再记得你，也不会再对你笑了。',
        '……这就是你拿到的「破碎之躯」。'
      ]
      : type === 'spare'
    ? [
      'LFELKEEA：……哼。算你识相。',
      'LFELKEEA：过来吧，笨蛋。只准这一次。',
      '她别过头，尾巴却轻轻蹭了蹭你的手。',
      'LFELKEEA：下次再乱来的话，',
      'LFELKEEA：我可不会这么简单放过你。'
    ]
    : type === 'genocide'
      ? [
        'LFELKEEA：……笨蛋……下手……真狠啊。',
        'LFELKEEA：我明明……还想……多陪你一会儿的。',
        '她的猫耳无力地垂了下来。',
        '走廊里只剩下你的脚步声。',
        '……你确定，这就是你想要的结局吗。'
      ]
      : type === 'fade'
        ? [
          'LFELKEEA：……啊。原来，消失是这种感觉。',
          'LFELKEEA：不疼。就是有点冷。',
          'LFELKEEA：喂，笨蛋。……最后，听我说一句。',
          'LFELKEEA：谢谢你来。……虽然，我一直在拦你。',
          '她的轮廓散成白色的羽毛，落满了整条走廊。',
          '你伸出手，只抓到一点还没散尽的温度。'
        ]
        : type === 'endurance'
          ? [
            'LFELKEEA：……三百秒。一步都没退。',
            'LFELKEEA：你这家伙，到底有多固执啊。',
            '最后一发弹幕停在半空，像被谁按下了暂停。',
            '她收起爪，走廊的灯一盏一盏亮回来。',
            'LFELKEEA：走吧。……这次，我陪你一起。'
          ]
          : [
        'LFELKEEA：……哼。到最后，还是没舍得啊。',
        'LFELKEEA：又想赢我，又想让我原谅你。',
        'LFELKEEA：哪有那么好的事，笨蛋。',
        '她的身体化成光点，散在走廊里。',
        '你走出去了。可身后的位置，空了一块。'
      ];

  ctx.font = `13px ${CN}`;
  let y = 134;
  for (const line of lines) {
    const isBoss = line.indexOf('LFELKEEA') === 0;
    ctx.fillStyle = isBoss ? bodyColor : dimColor;
    const wrapped = wrapText(line, 310, `13px ${CN}`);
    for (const wl of wrapped) {
      ctx.fillText(wl, 288, y);
      y += 22;
    }
  }

  ctx.fillStyle = type === 'genocide' ? 'rgba(255,40,60,0.4)' : 'rgba(20,17,16,0.25)';
  ctx.fillRect(288, y + 8, 300, 1);

  ctx.font = `10px ${CN}`;
  ctx.fillStyle = dimColor;
  const route = hardGenocide
    ? '屠杀路线 · 困难'
    : hardMercy
      ? '饶恕路线 · 困难'
      : type === 'genocide'
        ? '屠杀路线'
        : type === 'spare'
          ? '饶恕路线'
          : type === 'fade'
            ? '第三阶段'
            : type === 'endurance'
              ? '终焉模式 · 撑满 300 秒'
              : '普通路线';
  ctx.fillText(`${route}　回合 ${stats.turns}　造成伤害 ${stats.damage}　受到伤害 ${stats.hits}`, 288, y + 20);
  let hintY = y + 46;
  if (ending && ending.linked) {
    ctx.fillStyle = '#6a625a';
    ctx.fillText('战果已回传启动器', 288, y + 34);
    hintY = y + 62;
  }

  if (et > 2.2 && Math.floor(time * 1.7) % 2 === 0) {
    ctx.font = `13px ${CN}`;
    ctx.fillStyle = (type === 'spare') ? '#c99a00' : (dark ? C.yellow : C.red);
    ctx.fillText('按 Z 回到标题', 288, hintY);
  }

  ctx.restore();
}

/* ========================= GAME OVER / PAUSE ========================= */

function drawGameOver() {
  const endFail = !!(endurance && endurance.failed);
  ctx.fillStyle = 'rgba(4,2,5,0.95)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  ctx.save();
  ctx.translate(cx, 118);
  ctx.globalAlpha = 0.9;
  drawHeart(-14, 0, 3, '#4a1017');
  drawHeart(14, 0, 3, '#4a1017');
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-18, -6); ctx.lineTo(0, 20); ctx.lineTo(18, -6);
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `bold 38px ${MONO}`;
  ctx.fillStyle = C.red;
  ctx.fillText(endFail ? 'ENDURANCE FAILED' : 'GAME OVER', cx, 172);

  ctx.font = `14px ${CN}`;
  ctx.fillStyle = '#a49a94';
  ctx.fillText(endFail ? '终焉模式的连击停了下来。' : '你的决心破碎了。', cx, 228);

  ctx.font = `13px ${CN}`;
  ctx.fillStyle = C.white;
  ctx.fillText(endFail ? `LFELKEEA：${Math.ceil(Math.min(ENDURANCE_DURATION, endurance.t))} 秒……还差一点。` : 'LFELKEEA：笨蛋！谁让你不躲的！', cx, 266);
  ctx.fillStyle = '#a49a94';
  ctx.fillText(endFail ? 'LFELKEEA：站起来。这次别再看漏后手。' : 'LFELKEEA：……喂，醒醒。别吓我啊。', cx, 290);

  if (Math.floor(time * 1.7) % 2 === 0) {
    ctx.font = `14px ${CN}`;
    ctx.fillStyle = C.yellow;
    ctx.fillText('按 Z 重试　　X 回到标题', cx, 356);
  }

  ctx.font = `11px ${CN}`;
  ctx.fillStyle = '#6f6660';
  ctx.fillText(endFail
    ? `终焉模式　坚持 ${Math.ceil(Math.min(ENDURANCE_DURATION, endurance.t))} / ${ENDURANCE_DURATION} 秒　受击 ${stats.hits}`
    : `难度：${difficulty === 1 ? '审判' : '普通'}　　回合：${stats.turns}`, cx, 404);
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.74)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `bold 32px ${MONO}`;
  ctx.fillStyle = C.white;
  ctx.fillText('PAUSED', W / 2, 190);
  ctx.font = `12px ${CN}`;
  ctx.fillStyle = '#a49a94';
  ctx.fillText('P / Esc 继续　　M 静音', W / 2, 242);
}


/* ===== main.js ===== */
'use strict';

/* =========================================================
   JUDGEMENT — LFELKEEA
   Boot: resize / main loop
   ========================================================= */

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const scale = Math.min(2, Math.max(0.5, s));
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
}

window.addEventListener('resize', resize);

let last = performance.now();

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(loop);
}

resetBattle();
resize();
requestAnimationFrame(loop);

</script>
