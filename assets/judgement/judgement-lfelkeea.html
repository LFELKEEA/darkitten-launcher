      const gap = Math.min(brutal ? 50 : (hard ? 60 : 76), b.h - 54);
      const gy = b.y + 16 + Math.random() * Math.max(6, b.h - gap - 32);
      const speed = brutal ? 275 : (hard ? 205 : 160);
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: b.y, w: 14, h: gy - b.y, vx: -speed, vy: 0, color: 'white' });
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: gy + gap, w: 14, h: b.y + b.h - (gy + gap), vx: -speed, vy: 0, color: 'white' });
      if (brutal) {
        bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 78, y: b.y, w: 12, h: Math.max(0, gy - b.y - 12), vx: -speed, vy: 0, color: 'white' });
      }
    } else if (mode === 1) {
      const fromTop = Math.random() < 0.5;
      const speed = brutal ? 300 : (hard ? 230 : 175);
      const n = brutal ? 3 : (hard ? 2 : 1);
      for (let k = 0; k < n; k++) {
        const x = rand(b.x + 16, b.x + b.w - 16);
        const y = fromTop ? b.y - 10 - k * 18 : b.y + b.h + 10 + k * 18;
        bullets.push({
          kind: 'bone', arena: ai, x, y, w: 14, h: rand(26, 56),
          vx: 0, vy: fromTop ? speed : -speed, color: 'white', delay: 0.14
        });
      }
    } else if (mode === 2) {
      const p = soulForArena(ai);
      const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      // 同样不能贴着灵魂刷瞄准弹：随机边太近就改用最远的一条
      const at = (sd) => {
        if (sd === 0) return { x: rand(b.x + 20, b.x + b.w - 20), y: b.y - 26 };
        if (sd === 2) return { x: rand(b.x + 20, b.x + b.w - 20), y: b.y + b.h + 26 };
        if (sd === 3) return { x: b.x - 26, y: rand(b.y + 18, b.y + b.h - 18) };
        return { x: b.x + b.w + 26, y: rand(b.y + 18, b.y + b.h - 18) };
      };
      let pt = at(randi(0, 3));
      if (Math.hypot(pt.x - t.x, pt.y - t.y) < 110) {
        let bestD = -1;
        for (let sd = 0; sd < 4; sd++) {
          const q = at(sd);
          const d = Math.hypot(q.x - t.x, q.y - t.y);
          if (d > bestD) { bestD = d; pt = q; }
        }
      }
      const sx = pt.x, sy = pt.y;
      const base = Math.atan2(t.y - sy, t.x - sx);
      const speed = brutal ? 300 : (hard ? 245 : 190);
      // 困难 3 发加一发猫爪会从同一个点形成扇形封口，缩回 2 发。
      const count = brutal ? 4 : 2;
      for (let k = 0; k < count; k++) {
        const ang = base + (k - (count - 1) / 2) * 0.16;
        bullets.push({
          kind: 'shard', arena: ai, outer: true, x: sx, y: sy, r: 6,
          rot: 0, rotv: rand(-9, 9),
          vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
          color: C.white, karmic: true
        });
      }
      if (brutal) {
        const pa = base + rand(-0.14, 0.14);
        bullets.push({
          kind: 'paw', arena: ai, outer: true, x: sx, y: sy, r: 11, rot: pa,
          vx: Math.cos(pa) * speed * 1.15, vy: Math.sin(pa) * speed * 1.15,
          color: C.white, tr: []
        });
      }
    } else {
      if (brutal) {
        const fromRight = Math.random() < 0.5;
        const px = fromRight ? b.x + b.w + 30 : b.x - 30;
        const py = rand(b.y + 26, b.y + b.h - 26);
        const pa = Math.atan2(b.y + b.h / 2 - py, b.x + b.w / 2 - px);
        bullets.push({
          kind: 'paw', arena: ai, outer: true, x: px, y: py, r: 11, rot: pa,
          vx: Math.cos(pa) * 240, vy: Math.sin(pa) * 240,
          color: C.white, tr: []
        });
      }
    }
    a.spawnT = brutal ? 0.34 : (hard ? 0.44 : 0.6);
  }

  else if (a.id === 'bisect') {
    // 分裂球：先沿着直线飞，随后一分为三
    const p = soulForArena(ai);
    const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const side = a.next++ % 4;
    let x, y;
    if (side === 0) { x = rand(b.x + 26, b.x + b.w - 26); y = b.y + 24; }
    else if (side === 1) { x = rand(b.x + 26, b.x + b.w - 26); y = b.y + b.h - 24; }
    else if (side === 2) { x = b.x + 24; y = rand(b.y + 22, b.y + b.h - 22); }
    else { x = b.x + b.w - 24; y = rand(b.y + 22, b.y + b.h - 22); }
    const base = Math.atan2(t.y - y, t.x - x) + rand(-0.12, 0.12);
    const speed = brutal ? 150 : (hard ? 125 : 105);
    const count = brutal ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const ang = base + (k - (count - 1) / 2) * 0.5;
      bullets.push({
        kind: 'orb', arena: ai, x, y, r: 7,
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        split: 3, splitT: brutal ? 0.55 : (hard ? 0.66 : 0.78),
        splitR: 5, sigilOnSplit: (brutal || hard), color: C.white, tr: [], delay: 0.1
      });
    }
    Sound.bell();
    a.spawnT = brutal ? 0.55 : (hard ? 0.7 : 0.95);
  }

  else if (a.id === 'final') {
    const gap = Math.min(brutal ? 46 : (hard ? 58 : 74), b.h - 50);
    const speed = brutal ? 340 : (hard ? 265 : 195);
    const gy = b.y + 16 + Math.random() * Math.max(6, b.h - gap - 30);
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: b.y, w: 14, h: gy - b.y, vx: -speed, vy: 0, color: 'white' });
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: gy + gap, w: 14, h: b.y + b.h - (gy + gap), vx: -speed, vy: 0, color: 'white' });
    if (brutal) {
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 70, y: b.y, w: 12, h: Math.max(0, gy - b.y - 12), vx: -speed, vy: 0, color: Math.random() < 0.3 ? 'blue' : 'white' });
    }
    a.spawnT = brutal ? 0.27 : (hard ? 0.34 : 0.5);
    a.beamT -= a.spawnT;
    if (a.beamT <= 0) {
      a.beamT = brutal ? 1.05 : (hard ? 1.65 : 2.4);
      const dir = Math.random() < 0.5 ? 'top' : 'bottom';
      const width = hard ? 34 : 30;
      beams.push({
        dir, pos: rand(b.x + 10, b.x + b.w - 10 - width),
        width, arena: ai,
        warn: brutal ? 0.4 : 0.55, fire: 0.26, t: 0, hit: false
      });
      Sound.blaster();
      screenPulse = 0.12;
    }
  }

  if (a.spawnT <= 0) a.spawnT = 0.5;
}

function endAttack() {
  attack = null;
  bullets = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  sparks = [];
  layout = 'normal';
  dualMode = false;
  Object.assign(box, BOX);
  arenaBoxes = [box];
  setCamera(0, 0, 1);

  const hp = player ? player.hp : PLAYER_HP;
  const max = player ? player.max : PLAYER_HP;
  const kr = player ? player.kr : 0;
  const krTick = player ? player.krTick : 0;
  player = makeSoul(0, 'red', box);
  player.hp = hp;
  player.max = max;
  player.kr = kr;
  player.krTick = krTick;
  player2 = null;

  if (state !== 'attack') return;
  state = 'menu';
  menuIndex = 0;
  if (thirdPhase) {
    if (turn % 2 === 0) {
      queueDialog([L('boss', THIRD_MID[Math.floor(turn / 2) % THIRD_MID.length])], () => { state = 'menu'; });
    }
    return;
  }
  if (turn % 3 === 0) {
    const lines = [
      '……还站着啊。',
      '哼，算你有点本事。',
      '别得意，下一轮可不会这样了。',
      '……呼吸乱了。调整一下。'
    ];
    queueDialog([L('boss', lines[Math.floor(turn / 3) % lines.length])], () => { state = 'menu'; });
  }
}

function buildEndArena() {
  const e = endurance;
  if (!e) return;
  const mode = e.soulId;
  const id = e.windowId;
  let base = { ...BOX };
  if (mode === 'cyan') {
    base = { x: BOX.x, y: BOX.y + (BOX.h - 72) / 2, w: BOX.w, h: 72 };
  } else if (mode === 'purple') {
    base = { x: BOX.x + (BOX.w - 88) / 2, y: BOX.y, w: 88, h: BOX.h };
  }
  e.arenaBase = { ...base };
  box = { ...base };
  arenaBoxes = [box];

  const free = mode === 'red' || mode === 'orange' || mode === 'aqua';
  if (free && id === 'split') {
    const g = 8;
    const w = (base.w - g) / 2;
    const h = (base.h - g) / 2;
    arenaBoxes = [
      { x: base.x, y: base.y, w, h },
      { x: base.x + w + g, y: base.y, w, h },
      { x: base.x, y: base.y + h + g, w, h },
      { x: base.x + w + g, y: base.y + h + g, w, h }
    ];
    box = arenaBoxes[0];
  } else if (free && id === 'offset') {
    const g = 14;
    const w = (base.w - g) / 2;
    arenaBoxes = [
      { x: base.x, y: base.y, w, h: base.h },
      { x: base.x + w + g, y: base.y, w, h: base.h }
    ];
    box = arenaBoxes[0];
  }

  const n = arenaBoxes.length;
  for (const arr of [bullets, beams, lashes, wheels, shots]) {
    for (const o of arr) o.arena = Math.min(n - 1, Math.max(0, o.arena || 0));
  }
  if (player) {
    player.arena = Math.min(player.arena || 0, n - 1);
    const b = arenaBoxes[player.arena];
    player.x = clamp(player.x, b.x + 10, b.x + b.w - 10);
    player.y = clamp(player.y, b.y + 10, b.y + b.h - 10);
  }
}

function applyEndForm(id) {
  const e = endurance;
  if (!e) return;
  e.windowId = id;
  e.formK = 0;
  e.glitchSeed = Math.random() * 1000;
  e.cracks = [];
  e.foldPhase = 0;
  e.crackPhase = 0;
  e.crackActive = false;
  e.rotateBase = (e.phase % 2 ? 1 : -1) * 0.06;
  e.ringR = Math.min(box.w, box.h) * 0.24;
  buildEndArena();

  // 裂纹用固定分叉角生成，只作视觉与可躲避的环境伤害
  if (id === 'cracked' && arenaBoxes.length === 1) {
    const b = arenaBoxes[0];
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (let i = 0; i < 6; i++) {
      let a = -Math.PI / 2 + i * Math.PI / 3;
      let x = cx, y = cy;
      const seg = [{ x, y }];
      for (let k = 0; k < 6; k++) {
        a += (k % 2 ? 0.34 : -0.28) + 0.08 * Math.sin(i + k);
        const len = 13 + ((i * 7 + k * 5) % 11);
        x = clamp(x + Math.cos(a) * len, b.x + 5, b.x + b.w - 5);
        y = clamp(y + Math.sin(a) * len, b.y + 5, b.y + b.h - 5);
        seg.push({ x, y });
      }
      e.cracks.push(seg);
    }
  }

  hazards = hazards.filter((h) => h.persist);
  Sound.phaseShift(1);
  shake = Math.max(shake, 4);
}

function setEndSoul(id) {
  const e = endurance;
  const b = arenaBoxes[0] || box;
  const p = makeSoul(0, id, b);
  p.endure = true;
  p.hp = p.max = 1;
  p.kr = 0;
  p.invuln = 0.85;
  p.trailT = 0;
  if (id === 'green') {
    p.x = b.x + b.w / 2;
    p.y = b.y + b.h / 2;
    p.gdir = 0;
    p.shieldA = -Math.PI / 2;
  } else {
    p.x = b.x + b.w / 2;
    p.y = b.y + b.h / 2;
  }
  player = p;
  player2 = null;
  e.soulId = id;
  e.soulT = 0;
  e.idleT = 0;
  e.tint = END_TINT[id] || '#ffffff';
  addRing(p.x, p.y, 4, 52, e.tint, 0.42, 2);
  flashWhite = Math.max(flashWhite, 0.2);
  Sound.phaseShift(1);
}

function placeEndBlue() {
  const p = player;
  const b = arenaBoxes[0] || box;
  const g = endGravityVec();
  if (!p) return;
  p.arena = 0;
  p.vn = 0;
  p.jumpHeld = false;
  p.jumpWas = false;
  if (g.y > 0.5) {
    p.x = b.x + b.w / 2;
    p.y = b.y + b.h - 12;
  } else if (g.y < -0.5) {
    p.x = b.x + b.w / 2;
    p.y = b.y + 12;
  } else if (g.x > 0.5) {
    p.y = b.y + b.h / 2;
    p.x = b.x + b.w - 12;
  } else {
    p.y = b.y + b.h / 2;
    p.x = b.x + 12;
  }
}

function fadeEndBullets() {
  for (const b of bullets) {
    if (b.dying == null) b.dying = 0.3;
    b.fake = true;
  }
  hazards = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
}

function enterEndSegment(i) {
  const e = endurance;
  const seg = END_TIMELINE[i];
  if (!seg) { startEndClear(); return; }
  const modeChanged = !player || player.mode !== seg.soul;
  e.segIdx = i;
  e.segT = 0;
  e.seg = seg;
  e.soulId = seg.soul;
  e.windowId = seg.form;
  e.gravityDir = seg.gravity || 'down';
  e.mandala = !!seg.mandala;
  e.wedge = seg.wedge ? { a: seg.wedge.a || 0, half: seg.wedge.half || 0.9, t: seg.dur } : null;
  buildEndArena();

  if (modeChanged) {
    setEndSoul(seg.soul);
    fadeEndBullets();
  } else if (player) {
    const b = arenaBoxes[player.arena || 0];
    player.endure = true;
    player.x = clamp(player.x, b.x + 10, b.x + b.w - 10);
    player.y = clamp(player.y, b.y + 10, b.y + b.h - 10);
  }
  applyEndForm(seg.form);
  if (seg.soul === 'blue') placeEndBlue();

  e.events = [];
  e.eventIdx = 0;
  const add = (t, fn) => e.events.push({ t, fn });
  const script = END_SCRIPTS[seg.script];
  if (script) script(add, seg);
  e.events.sort((a, b) => a.t - b.t);

  e.windowT = 0;
  e.windowDur = seg.dur;
  e.soulT = 0;
  e.soulDur = seg.dur;
  flashWhite = Math.max(flashWhite, 0.18);
  const b0 = arenaBoxes[0];
  addRing(b0.x + b0.w / 2, b0.y + b0.h / 2, 8, 90, e.tint, 0.35, 3);
  Sound.phaseShift(1);
  endCamKick(0, 0, 1.015, 0.3, 3);
}

function endCamKick(x, y, z, dur, sh) {
  if (!endurance) return;
  const d = dur || 0.3;
  endurance.camKick = { x: x || 0, y: y || 0, z: z == null ? 1 : z, dur: d, t: d };
  if (sh) shake = Math.max(shake, sh);
}

function cycleEndPanel() {
  const p = player;
  if (!p || arenaBoxes.length < 2) return;
  p.arena = (p.arena + 1) % arenaBoxes.length;
  const b = arenaBoxes[p.arena];
  p.x = b.x + b.w / 2;
  p.y = b.y + b.h / 2;
  p.invuln = Math.max(p.invuln, 0.5);
  addRing(p.x, p.y, 4, 38, endurance ? endurance.tint : '#ffffff', 0.32, 2);
  Sound.dodge();
}

function onEndPhase(ph) {
  const e = endurance;
  e.phase = ph;
  Sound.setMood('endure' + ph);
  Sound.phaseShift(2);
  flashWhite = Math.max(flashWhite, 0.5);
  cutFx = { t: 0, dur: 0.45 };
  shake = Math.max(shake, 11);
  screenPulse = 0.3;
  e.phasePulse = 1.1;
  addRing(320, box.y + box.h / 2, 10, 210, e.tint, 0.7, 4);
}

function updateEndurance(dt) {
  const e = endurance;
  if (!e) return;
  e.t += dt;
  e.segT += dt;
  e.windowT += dt;
  e.soulT += dt;
  if (e.phasePulse > 0) e.phasePulse -= dt;
  if (e.cleared) { updateEndClear(dt); return; }

  const ph = endPhaseOf(e.t);
  if (ph !== e.phase) onEndPhase(ph);

  updateEndForm(dt);
  updateEndBoneHint(dt);
  updateSouls(dt);
  if (state !== 'endurance') return;
  updateEndSoulRules(dt);
  if (state !== 'endurance') return;

  updateEndEvents(dt);
  if (state !== 'endurance') return;
  updateEndBullets(dt);
  if (state !== 'endurance') return;
  updateHazards(dt);
  if (state !== 'endurance') return;

  if (e.segT >= e.seg.dur) enterEndSegment(e.segIdx + 1);
  if (e.t >= ENDURANCE_DURATION) startEndClear();
}

function updateEndEvents(dt) {
  const e = endurance;
  while (e.eventIdx < e.events.length && e.segT >= e.events[e.eventIdx].t) {
    const ev = e.events[e.eventIdx++];
    ev.fn();
    if (state !== 'endurance') return;
  }
}

function updateEndForm(dt) {
  const e = endurance;
  e.formK = Math.min(1, e.formK + dt * 2.2);

  if (e.windowId === 'shrink' && arenaBoxes.length === 1) {
    const base = e.arenaBase;
    const b = arenaBoxes[0];
    const pulse = 0.92 + 0.05 * Math.sin(time * 1.3);
    const tw = base.w * (0.80 + 0.14 * e.formK) * pulse;
    const th = base.h * (0.84 + 0.10 * e.formK) * pulse;
    b.w = tw;
    b.h = th;
    b.x = base.x + (base.w - tw) / 2;
    b.y = base.y + base.h - th;
    if (player) {
      player.x = clamp(player.x, b.x + 8, b.x + b.w - 8);
      player.y = clamp(player.y, b.y + 8, b.y + b.h - 8);
    }
  }
  if (e.windowId === 'fold') e.foldPhase = (e.foldPhase + dt) % 2.6;
  if (e.windowId === 'cracked') {
    e.crackPhase = e.windowT % 3.2;
    e.crackActive = e.crackPhase > 1.9 && e.crackPhase < 2.5;
  }
  if (e.wedge && e.wedge.t > 0) {
    e.wedge.t -= dt;
    e.wedge.a += dt * 0.38;
  }

  const lvl = e.phase;
  let cx = Math.sin(time * 0.7) * 1.5 * lvl * 0.35;
  let cy = Math.cos(time * 0.9) * 1.2 * lvl * 0.35;
  let cz = 1 + 0.006 * lvl + 0.006 * Math.sin(time * (1.4 + lvl * 0.2));
  if (e.windowId === 'rotate') {
    cx += Math.sin(time * 1.2) * 5;
    cy += Math.cos(time * 0.9) * 3;
    cz += 0.02;
  } else if (e.windowId === 'fisheye') {
    cz += 0.012;
  } else if (e.windowId === 'glitch') {
    cx += Math.sin(time * 9) * 2.2;
  } else if (e.windowId === 'split' || e.windowId === 'offset') {
    cz += 0.008;
  }
  const ck = e.camKick;
  if (ck && ck.t > 0) {
    ck.t -= dt;
    const k = Math.max(0, ck.t / ck.dur);
    const s = Math.sin((1 - k) * Math.PI);
    cx += ck.x * s;
    cy += ck.y * s;
    cz *= 1 + (ck.z - 1) * s;
  }
  setCamera(clamp(cx, -14, 14), clamp(cy, -10, 10), clamp(cz, 0.965, 1.06));
}

function updateEndSoulRules(dt) {
  const e = endurance;
  const p = player;
  if (!p) return;
  const b = arenaBoxes[p.arena] || box;
  const free = p.mode === 'red' || p.mode === 'orange' || p.mode === 'aqua';

  // 环境伤害只作用于自由移动的灵魂；窄条/定点灵魂不会被窗框本身逼死
  if (free) {
    if (e.windowId === 'ring') {
      const cx = b.x + b.w / 2;
      const cy = b.y + b.h / 2;
      const rr = Math.min(b.w, b.h) * 0.24;
      if (dist(p.x, p.y, cx, cy) < rr) {
        const ang = Math.atan2(p.y - cy, p.x - cx) || 0;
        p.x = cx + Math.cos(ang) * (rr + 2);
        p.y = cy + Math.sin(ang) * (rr + 2);
        if (p.invuln <= 0) hurt(3, false, p);
        if (state !== 'endurance') return;
      }
    }

    if (e.windowId === 'fold' && e.foldPhase > 1.4 && e.foldPhase < 2.1) {
      if (Math.abs(p.x - (b.x + b.w / 2)) < 8 && p.invuln <= 0) {
        hurt(4, false, p);
        if (state !== 'endurance') return;
      }
    }

    if (e.windowId === 'cracked' && e.crackActive && p.invuln <= 0) {
      for (const seg of e.cracks) {
        for (let i = 1; i < seg.length; i++) {
          if (segDist(p.x, p.y, seg[i - 1].x, seg[i - 1].y, seg[i].x, seg[i].y) < 5) {
            hurt(4, false, p);
            if (state !== 'endurance') return;
            i = seg.length;
            break;
          }
        }
        if (p.invuln > 0) break;
      }
    }
  }

  if (p.mode === 'aqua' && p.moving) {
    p.trailT = (p.trailT || 0) - dt;
    if (p.trailT <= 0) {
      p.trailT = 0.14;
      addHazard({
        kind: 'after', arena: p.arena, x: p.x, y: p.y, w: 10, h: 10,
        warn: 0.55, fire: 0.32, dmg: 3, color: '#3ff2e0', life: 1.35
      });
    }
  } else if (p.mode === 'orange') {
    if (!p.moving) {
      e.idleT += dt;
      if (e.idleT > 0.7) {
        e.idleT = 0;
        hurt(3, false, p);
        if (state !== 'endurance') return;
      }
    } else {
      e.idleT = 0;
    }
  }

  if (e.gravityT > 0) e.gravityT -= dt;
}

/* ---- 终焉模式专属弹幕碰撞 ---- */
function endShieldBlocks(p, b) {
  if (!p || p.mode !== 'green' || !b) return false;
  if (b.kind === 'bone') return false;
  const s = soulPos(p);
  const dx = b.x - s.x;
  const dy = b.y - s.y;
  if (Math.hypot(dx, dy) > 38) return false;
  const da = endAngDiff(Math.atan2(dy, dx), p.shieldA || 0);
  if (Math.abs(da) > 0.95) return false;
  p.shieldFlash = 0.28;
  Sound.block();
  addRing(b.x, b.y, 2, 16, '#d8ffe0', 0.22, 2);
  return true;
}

function endShieldBlocksBeam(p, b) {
  if (!p || p.mode !== 'green') return false;
  const map = { top: 0, right: 1, bottom: 2, left: 3 };
  if (map[b.dir] !== p.gdir) return false;
  p.shieldFlash = 0.28;
  Sound.block();
  return true;
}

function updateEndBullets(dt) {
  const e = endurance;
  const dmg = e.phase >= 4 ? 4 : 3;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.dying != null) {
      b.dying -= dt;
      b.x += (b.vx || 0) * dt * 1.3;
      b.y += (b.vy || 0) * dt * 1.3;
      if (b.dying <= 0) bullets.splice(i, 1);
      continue;
    }
    if (b.hitT > 0) b.hitT -= dt;
    if (b.delay > 0) { b.delay -= dt; continue; }

    // 安全楔形是真正安全的：转入楔形的弹幕会被审判光束抹掉
    if (e.wedge && e.wedge.t > 0 && !b.fake && !b.greenSpear) {
      const bb = arenaBoxes[b.arena || 0] || box;
      const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
      const a = Math.atan2(b.y - cy, b.x - cx);
      if (Math.abs(endAngDiff(a, e.wedge.a)) < e.wedge.half - 0.03) {
        bullets.splice(i, 1);
        continue;
      }
    }

    if (b.curve) {
      const sp = Math.hypot(b.vx || 0, b.vy || 0) || 1;
      const ang = Math.atan2(b.vy || 0, b.vx || 0) + b.curve * dt;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
    }

    b.x += (b.vx || 0) * dt;
    b.y += (b.vy || 0) * dt;
    if (b.rotv) b.rot += b.rotv * dt;
    if (b.life != null) b.life -= dt;

    if (b.kind === 'orb' || b.kind === 'shard' || b.kind === 'paw') {
      if (!b.tr) b.tr = [];
      b.tr.push({ x: b.x, y: b.y });
      if (b.tr.length > 5) b.tr.shift();
    }

    const bb = arenaBoxes[b.arena || 0] || box;
    const pad = b.outer ? 280 : (b.kind === 'blade' ? 420 : 80);
    if (b.x + (b.w || 0) < bb.x - pad || b.x > bb.x + bb.w + pad ||
        b.y + (b.h || 0) < bb.y - pad || b.y > bb.y + bb.h + pad ||
        (b.life != null && b.life <= 0)) {
      bullets.splice(i, 1);
      continue;
    }

    if (b.fake) continue;
    const p = soulForArena(b.arena || 0);
    if (!p || p.invuln > 0) continue;
    if (endShieldBlocks(p, b)) { bullets.splice(i, 1); continue; }
    if (bulletHits(b, p)) {
      hurt(dmg, b.karmic === true || b.kind === 'shard', p);
      if (state !== 'endurance') return;
      bullets.splice(i, 1);
    }
  }

  // 光束
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.t += dt;
    if (b.t > b.warn + b.fire + 0.2) { beams.splice(i, 1); continue; }
    if (b.t >= b.warn && b.t < b.warn + b.fire && !b.hit) {
      const p = soulForArena(b.arena || 0);
      if (!p || p.invuln > 0) continue;
      const r = beamRect(b);
      const s = soulRect(p);
      if (!overlap(s, { x: r.x + 2, y: r.y + 2, w: r.w - 4, h: r.h - 4 })) continue;
      b.hit = true;
      if (endShieldBlocksBeam(p, b)) { addRing(s.x, s.y, 3, 22, '#d8ffe0', 0.25, 2); continue; }
      hurt(dmg, false, p);
      if (state !== 'endurance') return;
    }
  }

  // 恶魔鞭
  for (let i = lashes.length - 1; i >= 0; i--) {
    const l = lashes[i];
    l.t += dt;
    if (l.t > l.warn + l.fire + 0.16) { lashes.splice(i, 1); continue; }
    if (l.sweep) {
      const k = clamp((l.t - l.warn) / (l.fire + 0.08), 0, 1);
      const kk = k * k * (3 - 2 * k);
      l.tipX = l.sx + (l.ex - l.sx) * kk;
      l.tipY = l.sy + (l.ey - l.sy) * kk;
    }
    if (l.t >= l.warn && l.t < l.warn + l.fire && !l.hit) {
      const p = soulForArena(l.arena || 0);
      if (!p || p.invuln > 0) continue;
      const s = soulPos(p);
      const pts = lashPoints(l);
      const hitR = l.sweep ? 15 : 12;
      let near = false;
      for (let k = 8; k < pts.length; k++) {
        if (dist(s.x, s.y, pts[k].x, pts[k].y) < hitR) { near = true; break; }
      }
      if (!near) continue;
      l.hit = true;
      hurt(dmg, false, p);
      if (state !== 'endurance') return;
    }
  }

  updateWheels(dt);
  updateShots(dt);
}

/* ---- 弹幕原语 ---- */

function eachArena(fn) {
  for (let ai = 0; ai < arenaBoxes.length; ai++) fn(arenaBoxes[ai], ai);
}

function eOrb(b, ai, x, y, vx, vy, r, color, extra) {
  const o = Object.assign({
    kind: 'orb', arena: ai, x, y, vx, vy, r: r || 5,
    color: color || C.white, tr: []
  }, extra || {});
  bullets.push(o);
  return o;
}

function ePaw(b, ai, x, y, vx, vy, r, color) {
  const o = {
    kind: 'paw', arena: ai, x, y, r: r || 8, vx, vy,
    rot: 0, rotv: 2.2, color: color || C.white, tr: []
  };
  bullets.push(o);
  return o;
}

function eBone(b, ai, x, y, w, h, vx, vy, color) {
  const o = { kind: 'bone', arena: ai, x, y, w, h, vx, vy, color: color || C.white };
  bullets.push(o);
  return o;
}

function eBeam(b, ai, dir, pos, width, warn, fire) {
  beams.push({
    dir, pos, width, arena: ai,
    warn: warn == null ? 0.6 : warn,
    fire: fire == null ? 0.3 : fire,
    t: 0, hit: false
  });
}

function eLaser(b, ai, x, y, w, h, warn, fire, dmg, color) {
  addHazard({
    kind: 'laser', arena: ai, x, y, w, h,
    warn: warn == null ? 0.55 : warn,
    fire: fire == null ? 0.32 : fire,
    dmg: dmg || 3, color: color || '#ff3b5c'
  });
}

function setEndGravity(dir) {
  const e = endurance;
  if (!e || !END_GRAV[dir] || e.gravityDir === dir) return;
  e.gravityDir = dir;
  e.gravityT = 0.35;
  if (player) {
    player.vn = 0;
    player.jumpHeld = false;
    player.jumpWas = false;
    player.invuln = Math.max(player.invuln, 0.35);
    // 蓝魂：重力切换的瞬间直接落到新地面，避免半空被新方向的障碍压死
    if (player.endure && player.mode === 'blue') {
      const b = arenaBoxes[player.arena || 0] || box;
      const g = END_GRAV[dir];
      if (g.y > 0.5) player.y = b.y + b.h - 12;
      else if (g.y < -0.5) player.y = b.y + 12;
      else if (g.x > 0.5) player.x = b.x + b.w - 12;
      else player.x = b.x + 12;
      player.x = clamp(player.x, b.x + 12, b.x + b.w - 12);
      player.y = clamp(player.y, b.y + 12, b.y + b.h - 12);
      // 旧重力的骨头全部碎掉：翻转瞬间不该再被“上一个方向”的弹幕偷袭
      for (const o of bullets) {
        if (o.kind === 'bone' && o.dying == null) o.dying = 0.16;
      }
      hazards = hazards.filter((h) => h.persist);
    }
    addRing(player.x, player.y, 4, 28, '#9fd8ff', 0.3, 2);
  }
  flashWhite = Math.max(flashWhite, 0.1);
  endCamKick(0, 0, 1.02, 0.25, 4);
  Sound.phaseShift(1);
}

/* ---- 固定节奏的弹幕脚本 ---- */

function endBeat(add, seg, start, step, fn) {
  let k = 0;
  for (let t = start; t < seg.dur - 0.04; t += step) {
    const kk = k++;
    add(t, () => fn(kk, t));
  }
}

function openingBurst() {
  eachArena((b, ai) => {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const ga = endurance.wedge ? endurance.wedge.a : 0;
    const half = endurance.wedge ? endurance.wedge.half : 0.9;
    // 双层开场弹幕：内圈直接铺开，外圈稍慢一拍，避开同一安全楔形
    const layers = [
      { n: 44, rx: 30, ry: 22, sp: 158, sy: 0.7, delay: 0 },
      { n: 36, rx: 54, ry: 38, sp: 126, sy: 0.7, delay: 0.12 }
    ];
    for (const L of layers) {
      for (let i = 0; i < L.n; i++) {
        const a = (i + (L.delay ? 0.5 : 0)) / L.n * Math.PI * 2;
        if (Math.abs(endAngDiff(a, ga)) < half) continue;
        eOrb(b, ai, cx + Math.cos(a) * L.rx, cy + Math.sin(a) * L.ry,
          Math.cos(a) * L.sp, Math.sin(a) * L.sp * L.sy, 5, C.white, { delay: L.delay });
      }
    }
    addRing(cx, cy, 8, 240, '#ffd7e6', 0.5, 3);
    addRing(cx, cy, 14, 300, '#ffffff', 0.58, 2);
  });
  flashWhite = Math.max(flashWhite, 0.72);
  Sound.cutIn();
  Sound.blaster();
}

function openingRing(delay, n, speed) {
  eachArena((b, ai) => {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const rx = b.w / 2 - 8, ry = b.h / 2 - 6;
    const ga = endurance.wedge ? endurance.wedge.a : 0;
    const half = (endurance.wedge ? endurance.wedge.half : 0.9) + 0.08;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      if (Math.abs(endAngDiff(a, ga)) < half) continue;
      const x = cx + Math.cos(a) * rx;
      const y = cy + Math.sin(a) * ry;
      const d = Math.hypot(x - cx, y - cy) || 1;
      eOrb(b, ai, x, y, -(x - cx) / d * speed, -(y - cy) / d * speed, 5, C.white, { delay });
    }
  });
  endCamKick(0, 0, 1.03, 0.3, 4);
}

function openingLasers() {
  eachArena((b, ai) => {
    const cols = 9;
    const cw = (b.w - 20) / cols;
    let gapCol = Math.floor(cols / 2) - 1;
    if (player) gapCol = clamp(Math.floor((player.x - b.x - 10) / cw), 0, cols - 3);
    for (let c = 0; c < cols; c++) {
      if (Math.abs(c - gapCol) <= 1) continue;
      eLaser(b, ai, b.x + 10 + cw * c, b.y, cw - 2, b.h, 0.7, 0.35, 4, '#ff3b5c');
    }
  });
  Sound.blaster();
  shake = Math.max(shake, 7);
  endCamKick(0, 4, 1.02, 0.3, 5);
}

function openingFake() {
  eachArena((b, ai) => {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const ga = endurance.wedge ? endurance.wedge.a : 0;
    const half = endurance.wedge ? endurance.wedge.half : 0.9;
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2;
      if (Math.abs(endAngDiff(a, ga)) < half) continue;
      ePaw(b, ai, cx + Math.cos(a) * 24, cy + Math.sin(a) * 18,
        Math.cos(a) * 135, Math.sin(a) * 95, 8, C.white).fakeReturn = true;
    }
  });
  Sound.cutIn();
  endCamKick(0, 0, 1.04, 0.35, 6);
}

function redRain(b, ai, k, speed, gapShift) {
  const cols = 9;
  const cw = (b.w - 24) / cols;
  const gap = ((k + (gapShift || 0)) * 2) % (cols - 2);
  for (let c = 0; c < cols; c++) {
    if (c === gap || c === gap + 1) continue;
    const x = b.x + 12 + cw * (c + 0.5);
    ePaw(b, ai, x, b.y - 18, Math.sin(k * 1.3 + c) * 16, speed, 8, C.white);
  }
  return gap;
}

function redFan(b, ai, k) {
  const cx = b.x + b.w / 2;
  const n = 9;
  const gap = k % 3;
  for (let i = 0; i < n; i++) {
    if (i === gap || i === gap + 1) continue;
    const a = Math.PI / 2 + (i / (n - 1) - 0.5) * 1.6;
    ePaw(b, ai, cx + Math.cos(a) * 22, b.y + 8,
      Math.cos(a) * (145 + 6 * endurance.phase), Math.sin(a) * (145 + 6 * endurance.phase), 8, C.white);
  }
}

function redSpiral(b, ai, k) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const arms = 3;
  for (let a = 0; a < arms; a++) {
    const ang = k * 0.45 + a * Math.PI * 2 / arms;
    eOrb(b, ai, cx + Math.cos(ang) * 24, cy + Math.sin(ang) * 18,
      Math.cos(ang) * 118, Math.sin(ang) * 84, 5, C.white, { curve: 0.5 });
  }
}

function redCross(b, ai, k, speed) {
  redShutter(b, ai, k, speed);
}

// 骨闸：整排竖骨从上下压过来，中间留一段横缝；缺口每波平移一格
function redShutter(b, ai, k, speed) {
  const cols = 10;
  const cw = (b.w - 20) / cols;
  const gap = endSlideGap(k, cols - 2, Math.floor((cols - 2) / 2));
  const top = k % 2 === 0;
  const sp = speed || 120;
  const hh = Math.max(40, b.h * 0.46);
  for (let c = 0; c < cols; c++) {
    if (c === gap || c === gap + 1) continue;
    const x = b.x + 10 + cw * c;
    if (top) eBone(b, ai, x, b.y - hh - 4, cw - 3, hh, 0, sp, C.white);
    else eBone(b, ai, x, b.y + b.h + 4, cw - 3, hh, 0, -sp, C.white);
  }
}

// 青魂上下双骨闸：同一条横缝，两排骨同时压来，视觉上像牙齿合拢
function cyanShutter(b, ai, k, speed) {
  const cols = 12;
  const cw = (b.w - 20) / cols;
  const gap = endSlideGap(k, cols - 2, Math.floor((cols - 2) / 2));
  const sp = speed || 110;
  for (let c = 0; c < cols; c++) {
    if (c === gap || c === gap + 1) continue;
    const x = b.x + 10 + cw * c;
    eBone(b, ai, x, b.y - 22, cw - 2, b.h + 22, 0, sp, C.white);
    eBone(b, ai, x, b.y, cw - 2, b.h + 22, 0, -sp, C.white);
  }
}

// 紫魂左右双骨闸：同一条竖缝，两排骨从左右合拢
function purpleShutter(b, ai, k, speed) {
  const rows = 7;
  const rh = (b.h - 12) / rows;
  const gap = endSlideGap(k, rows - 2, Math.floor((rows - 2) / 2));
  const sp = speed || 105;
  for (let r = 0; r < rows; r++) {
    if (r === gap || r === gap + 1) continue;
    const y = b.y + 6 + rh * r;
    eBone(b, ai, b.x - 22, y, b.w + 22, Math.max(4, rh - 2), sp, 0, C.white);
    eBone(b, ai, b.x, y, b.w + 22, Math.max(4, rh - 2), -sp, 0, C.white);
  }
}

function blueHurdle(b, ai, k, speed) {
  const g = endGravityVec();
  const len = [30, 46, 62, 38, 54][k % 5];
  const sp = (speed || 168) + endurance.phase * 6;
  if (g.y > 0.5) {
    eBone(b, ai, b.x + b.w + 10, b.y + b.h - 22, len, 16, -sp, 0, C.white);
  } else if (g.y < -0.5) {
    eBone(b, ai, b.x - 10 - len, b.y + 6, len, 16, sp, 0, C.white);
  } else if (g.x > 0.5) {
    eBone(b, ai, b.x + b.w - 24, b.y - 10 - len, 16, len, 0, sp, C.white);
  } else {
    eBone(b, ai, b.x + 8, b.y + b.h + 10, 16, len, 0, -sp, C.white);
  }
}

function blueWallBar(b, ai, k) {
  const g = endGravityVec();
  const rows = 5;
  const rh = (b.h - 24) / rows;
  const gap = (k * 2) % (rows - 2);
  for (let r = 0; r < rows; r++) {
    if (r === gap || r === gap + 1) continue;
    const y = b.y + 12 + rh * r;
    if (g.x > 0.5) eBone(b, ai, b.x + b.w - 30, y, 70, rh - 4, -110, 0, C.white);
    else eBone(b, ai, b.x - 40, y, 70, rh - 4, 110, 0, C.white);
  }
}

// 蓝魂“闸门”：垂直于重力的骨栅栏，留一段连续缺口，整扇向地面压来
function blueGate(b, ai, k, speed) {
  const g = endGravityVec();
  const sp = speed || 220;
  const slots = 8;
  // 三格宽的门：按蓝魂 214 的横向速度，最坏位置也能在预警+穿过前赶到
  const gap = endSlideGap(k, slots - 3, Math.floor((slots - 3) / 2));
  const TELL = 0.85; // 先亮虚线，再开始压过来
  const push = (x, y, w, h, vx, vy) => {
    const o = eBone(b, ai, x, y, w, h, vx, vy, C.white);
    o.delay = TELL;
    return o;
  };
  if (g.y > 0.5) {
    const cw = (b.w - 20) / slots;
    for (let c = 0; c < slots; c++) {
      if (c >= gap && c < gap + 3) continue;
      push(b.x + 10 + cw * c, b.y - 20, cw - 2, 26, 0, sp);
    }
  } else if (g.y < -0.5) {
    const cw = (b.w - 20) / slots;
    for (let c = 0; c < slots; c++) {
      if (c >= gap && c < gap + 3) continue;
      push(b.x + 10 + cw * c, b.y + b.h - 6, cw - 2, 26, 0, -sp);
    }
  } else if (g.x > 0.5) {
    const rh = (b.h - 20) / slots;
    for (let r = 0; r < slots; r++) {
      if (r >= gap && r < gap + 3) continue;
      push(b.x - 20, b.y + 10 + rh * r, 26, rh - 2, sp, 0);
    }
  } else {
    const rh = (b.h - 20) / slots;
    for (let r = 0; r < slots; r++) {
      if (r >= gap && r < gap + 3) continue;
      push(b.x + b.w - 6, b.y + 10 + rh * r, 26, rh - 2, -sp, 0);
    }
  }
}

// 缺口往返扫动：第一口永远刷在中部，之后一格格左右移动，绝不会出现大跨度瞬跳
function endSlideGap(k, slots, seed) {
  const span = Math.max(1, slots);
  const period = Math.max(2, span * 2 - 2);
  const s = seed == null ? Math.floor(span / 2) : seed;
  let m = (((s + k) % period) + period) % period;
  if (m >= span) m = period - m;
  return ((m % span) + span) % span;
}

function cyanComb(b, ai, k, speed) {
  const cols = 14;
  const cw = (b.w - 20) / cols;
  const gap = endSlideGap(k, cols - 2, Math.floor((cols - 2) / 2));
  // 每一排必须在下一次刷出前完全穿过窄条，否则两道“只有两个缺口”的梳齿会叠成死局
  const vy = ((speed || 95) + endurance.phase * 5) * 1.8;
  for (let c = 0; c < cols; c++) {
    if (c === gap || c === gap + 1) continue;
    eBone(b, ai, b.x + 10 + cw * c, b.y - 24, cw - 2, b.h + 24, 0, vy, C.white);
  }
  return gap;
}

function cyanPillars(b, ai, k) {
  const cols = 10;
  const cw = (b.w - 18) / cols;
  const gap = endSlideGap(k, cols - 2, Math.floor((cols - 2) / 2));
  for (let c = 0; c < cols; c++) {
    if (c === gap || c === gap + 1) continue;
    eLaser(b, ai, b.x + 9 + cw * c, b.y, cw - 2, b.h, 0.55, 0.3, 3, '#35e0e0');
  }
}

// 青魂波次调度器：kind 依次循环，间隔必须大于该招式的“忙时”，
// 否则两面只有小缺口的墙会叠在一起变成死局
function cyanWaves(add, seg, start, step, speed, kinds) {
  let k = 0;
  for (let t = start; t < seg.dur - 0.04; t += step) {
    const kk = k++;
    const kind = kinds[k % kinds.length];
    add(t, () => eachArena((b, ai) => {
      if (kind === 'pillar') cyanPillars(b, ai, kk);
      else if (kind === 'shutter') cyanShutter(b, ai, kk, speed + 8);
      else cyanComb(b, ai, kk, speed);
      if (kind !== 'comb') Sound.blaster();
    }));
  }
}

// 青魂节奏：梳齿与竖光柱交替出现，保证同一时刻只有一种“整面墙”
function cyanMix(add, seg, start, step, speed, offset) {
  cyanWaves(add, seg, start, step, speed,
    (offset || 0) % 2 ? ['pillar', 'comb'] : ['comb', 'pillar']);
}

// 紫魂波次调度器：横向栅栏/竖井光幕/横向闭合影交替，间隔同样要大于忙时
function purpleWaves(add, seg, start, step, speed, kinds) {
  let k = 0;
  for (let t = start; t < seg.dur - 0.04; t += step) {
    const kk = k++;
    const kind = kinds[k % kinds.length];
    add(t, () => eachArena((b, ai) => {
      if (kind === 'ladder') purpleLadder(b, ai, kk, 0.6);
      else if (kind === 'shutter') purpleShutter(b, ai, kk, speed + 8);
      else purpleRake(b, ai, kk, speed);
      if (kind !== 'rake') Sound.blaster();
    }));
  }
}

// 紫魂节奏：横向栅栏与竖井光幕交替，同一时刻只有一道整列/整行的墙
function purpleMix(add, seg, start, step, speed, offset) {
  purpleWaves(add, seg, start, step, speed,
    (offset || 0) % 2 ? ['ladder', 'rake'] : ['rake', 'ladder']);
}

function purpleRake(b, ai, k, speed) {
  const rows = 10;
  const rh = (b.h - 16) / rows;
  const gap = endSlideGap(k, rows - 2, Math.floor((rows - 2) / 2));
  // 横向栅栏必须在下一道刷出前离开窄条，否则上下两组缺口错开后无路可走
  const vx = ((speed || 88) + endurance.phase * 5) * 2.4;
  for (let r = 0; r < rows; r++) {
    if (r === gap || r === gap + 1) continue;
    eBone(b, ai, b.x - 60, b.y + 8 + rh * r, b.w + 70, rh - 2, vx, 0, C.white);
  }
  return gap;
}

function purpleLadder(b, ai, k, warn) {
  const rows = 7;
  const rh = (b.h - 12) / rows;
  const gap = endSlideGap(k, rows - 2, Math.floor((rows - 2) / 2));
  for (let r = 0; r < rows; r++) {
    if (r === gap || r === gap + 1) continue;
    eBeam(b, ai, k % 2 ? 'right' : 'left', b.y + 6 + rh * r, rh - 2, warn || 0.6, 0.28);
  }
  return gap;
}

function greenSpear(b, ai, dir, speed, delay) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  // 固定出矛半径：四个方向的飞行距离完全一致，才不会被竖矛“先到”叠成两面夹击
  const R = Math.max(b.w, b.h) / 2 + 14;
  let x = cx, y = cy, vx = 0, vy = 0;
  if (dir === 0) { x = cx; y = cy - R; vy = speed; }
  else if (dir === 1) { x = cx + R; y = cy; vx = -speed; }
  else if (dir === 2) { x = cx; y = cy + R; vy = -speed; }
  else { x = cx - R; y = cy; vx = speed; }
  const o = {
    kind: 'orb', arena: ai, x, y, vx, vy, r: 6,
    color: '#eaffef', greenSpear: true, dir, delay: delay || 0, tr: []
  };
  bullets.push(o);
  addRing(x, y, 3, 14, '#d8ffe0', 0.28, 1);
  return o;
}

function greenVolleyScript(seq, beat, speed, feint) {
  return (add, seg) => {
    let k = 0;
    for (let t = 0.45; t < seg.dur - 0.1; t += beat) {
      const dir = seq[k % seq.length];
      const isFake = feint && k % 7 === 6;
      const kk = k++;
      add(t, () => {
        eachArena((b, ai) => {
          const s = greenSpear(b, ai, dir, speed, 0.55);
          if (isFake) {
            s.life = 0.3;
            s.fake = true;
          }
        });
        Sound.pop();
        endCamKick(0, 0, 1.008, 0.16, 1);
      });
    }
  };
}

// 绿魂光束节奏：一次只来一道，必须盾面正对，前一道打完才出下一道
function greenBeamRhythm(add, seg, start, step, dirs, warn, fire) {
  let k = 0;
  const w = warn == null ? 0.78 : warn;
  const f = fire == null ? 0.3 : fire;
  for (let t = start; t < seg.dur - 0.05; t += step) {
    const dir = dirs[k++ % dirs.length];
    add(t, () => {
      eachArena((b, ai) => {
        if (dir === 0) eBeam(b, ai, 'top', b.x + b.w / 2 - 26, 52, w, f);
        else if (dir === 2) eBeam(b, ai, 'bottom', b.x + b.w / 2 - 26, 52, w, f);
        else if (dir === 1) eBeam(b, ai, 'right', b.y + b.h / 2 - 26, 52, w, f);
        else eBeam(b, ai, 'left', b.y + b.h / 2 - 26, 52, w, f);
      });
      Sound.blaster();
      endCamKick(0, 0, 1.01, 0.2, 1);
    });
  }
}

function orangeRing(b, ai, k, inward, speed, delay) {
  const n = 20;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const rx = b.w / 2 - 8, ry = b.h / 2 - 6;
  const gap = (k * 3) % n;
  for (let i = 0; i < n; i++) {
    if ((i - gap + n) % n < 6) continue;
    const a = i / n * Math.PI * 2;
    if (inward) {
      const x = cx + Math.cos(a) * rx;
      const y = cy + Math.sin(a) * ry;
      const d = Math.hypot(x - cx, y - cy) || 1;
      eOrb(b, ai, x, y, -(x - cx) / d * speed, -(y - cy) / d * speed, 5, C.white, { delay });
    } else {
      eOrb(b, ai, cx + Math.cos(a) * 26, cy + Math.sin(a) * 19,
        Math.cos(a) * speed, Math.sin(a) * speed * 0.7, 5, C.white);
    }
  }
}

function aquaSpiral(b, ai, k) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  for (let a = 0; a < 3; a++) {
    const ang = k * 0.42 + a * Math.PI * 2 / 3;
    eOrb(b, ai, cx + Math.cos(ang) * 26, cy + Math.sin(ang) * 19,
      Math.cos(ang) * 122, Math.sin(ang) * 88, 5, C.white, { curve: 0.48 });
  }
}

/* ---- 参照 FDY 三审整理出的新招式原语 ---- */

// 太阳芒：一圈放射光弹，留一段随旋转扫动的安全扇区
function sunburst(b, ai, k, speed, opts) {
  const o = opts || {};
  const n = o.n || 18;
  const gapN = o.gapN || 3;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const spin = (k || 0) * (o.spinStep == null ? 0.24 : o.spinStep);
  const sp = speed || 150;
  const rad = o.rad || 20;
  const gapAt = o.gapAt == null ? 0 : o.gapAt;
  for (let i = 0; i < n; i++) {
    const d = ((i - gapAt) % n + n) % n;
    if (d < gapN) continue;
    const a = i / n * Math.PI * 2 + spin;
    const orb = eOrb(b, ai,
      cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * 0.68,
      Math.cos(a) * sp, Math.sin(a) * sp * (o.squash == null ? 0.62 : o.squash),
      o.r || 5, C.white, { delay: o.delay || 0 });
    orb.ray = o.ray || 40;
    orb.rayPulse = 1;
  }
}

// 刀光横扫：一条细长刀轨从框外平推过去，预警时只显示红色虚线
function bladeSweep(b, ai, k, speed, variant) {
  const v = ((variant == null ? k : variant) % 4 + 4) % 4;
  const diag = Math.hypot(b.w, b.h);
  const len = diag * 1.12;
  const sp = speed || 150;
  let nx, ny, ang;
  if (v === 0) { nx = 0; ny = 1; ang = 0; }
  else if (v === 1) { nx = 0; ny = -1; ang = 0; }
  else if (v === 2) { nx = 1; ny = 0; ang = Math.PI / 2; }
  else { nx = 1; ny = 0; ang = Math.PI / 2.7; }
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const reach = (Math.abs(nx) * b.w + Math.abs(ny) * b.h) / 2 + 40;
  bullets.push({
    kind: 'blade', arena: ai,
    x: cx - nx * reach, y: cy - ny * reach,
    ang, len, r: 5, color: 'white',
    vx: nx * sp, vy: ny * sp, delay: 0.55, tr: []
  });
}

// 交叉龙骨炮：一横一竖同时蓄力，只要错开交点就永远有路
function blasterCross(b, ai, k, warn, fire) {
  const w = 24;
  const x1 = b.x + b.w * (k % 2 ? 0.28 : 0.72);
  const y1 = b.y + b.h * (k % 2 ? 0.66 : 0.34);
  eBeam(b, ai, 'top', x1, w, warn == null ? 0.72 : warn, fire == null ? 0.28 : fire);
  eBeam(b, ai, 'left', y1, w, warn == null ? 0.72 : warn, fire == null ? 0.28 : fire);
}

// 单侧/双侧龙骨炮排：横向排布留一条竖直缝
function blasterBank(b, ai, k, mode, warn) {
  const w = 22;
  const slots = 5;
  const gap = endSlideGap(k, slots - 2, Math.floor((slots - 2) / 2));
  const dir = mode === 'bottom' ? 'bottom' : 'top';
  for (let i = 0; i < slots; i++) {
    if (i === gap || i === gap + 1) continue;
    if (mode === 'both' && i % 2 === 1) continue;
    const x = b.x + 30 + (b.w - 60) * (i / (slots - 1));
    eBeam(b, ai, dir, x, w, warn == null ? 0.7 : warn, 0.26);
    if (mode === 'both') eBeam(b, ai, 'bottom', x, w, warn == null ? 0.7 : warn, 0.26);
  }
}

// 通用骨幕：整排骨头沿一个方向压过来，留缺口或整排铺满（蓝/橙骨用）
function boneCurtain(b, ai, k, opts) {
  const o = opts || {};
  const dir = o.dir || 'down';
  const slots = o.slots || 14;
  const gapSlots = o.gapSlots == null ? 2 : o.gapSlots;
  const color = o.color || C.white;
  const sp = o.speed || 100;
  const vertical = dir === 'down' || dir === 'up';
  const gap = gapSlots > 0
    ? endSlideGap(k, Math.max(1, slots - gapSlots), Math.floor(Math.max(1, slots - gapSlots) / 2))
    : -1;
  if (vertical) {
    const cw = (b.w - 20) / slots;
    for (let c = 0; c < slots; c++) {
      if (gapSlots > 0 && c >= gap && c < gap + gapSlots) continue;
      eBone(b, ai, b.x + 10 + cw * c,
        dir === 'down' ? b.y - 26 : b.y,
        cw - 2, b.h + 26, 0,
        dir === 'down' ? sp : -sp, color);
    }
  } else {
    const rh = (b.h - 12) / slots;
    for (let r = 0; r < slots; r++) {
      if (gapSlots > 0 && r >= gap && r < gap + gapSlots) continue;
      eBone(b, ai,
        dir === 'right' ? b.x - 26 : b.x,
        b.y + 6 + rh * r, b.w + 26, Math.max(4, rh - 2),
        dir === 'right' ? sp : -sp, 0, color);
    }
  }
  return gap;
}

// 彩色骨提示：蓝骨要靠静止躲，橙骨要靠移动躲，屏幕角落给一行字
function endBoneHint(kind, dur) {
  if (!endurance) return;
  endurance.boneHint = { kind, t: dur == null ? 1.8 : dur };
}

function updateEndBoneHint(dt) {
  if (!endurance || !endurance.boneHint) return;
  endurance.boneHint.t -= dt;
  if (endurance.boneHint.t <= 0) endurance.boneHint = null;
}

function startEndClear() {
  const e = endurance;
  if (!e || e.cleared) return;
  e.cleared = true;
  e.clearT = 0;
  e.events = [];
  hazards = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  attack = null;
  e.mandala = false;
  Sound.stopMusic();
  Sound.spare();
  flashWhite = 0.55;
  snapCamera();
}

function updateEndClear(dt) {
  const e = endurance;
  e.clearT += dt;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += (b.vx || 0) * dt * 0.25;
    b.y += (b.vy || 0) * dt * 0.25;
    if (e.clearT > 1.2) bullets.splice(i, 1);
  }
  if (e.clearT >= 2.6 && state !== 'ending') {
    stats.turns = Math.round(Math.min(ENDURANCE_DURATION, e.t));
    stats.damage = 0;
    ending = {
      type: 'endurance', t: 0, hard: true,
      route: 'endurance', linked: hasJudgementHook()
    };
    state = 'ending';
    snapCamera();
    reportJudgement('endurance');
  }
}

/* ---- 环境伤害：激光 / 余烬 / 裂痕，按战斗框独立判定 ---- */
function addHazard(o) {
  const warn = o.warn == null ? 0.5 : o.warn;
  const fire = o.fire == null ? 0.32 : o.fire;
  hazards.push(Object.assign({
    t: 0, warn, fire, dmg: 3, color: '#ff3b5c',
    life: warn + fire + 0.24, hit: false, arena: 0
  }, o));
}

function updateHazards(dt) {
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    h.t += dt;
    if (h.vx) h.x += h.vx * dt;
    if (h.vy) h.y += h.vy * dt;
    if (h.t >= h.life) { hazards.splice(i, 1); continue; }
    if (h.t < h.warn || h.t >= h.warn + h.fire) continue;
    const p = soulForArena(h.arena || 0);
    if (!p || p.invuln > 0) continue;
    if (p.mode === 'green' && h.kind === 'after') continue;
    if (overlap(soulRect(p), { x: h.x + 1, y: h.y + 1, w: Math.max(1, h.w - 2), h: Math.max(1, h.h - 2) })) {
      if (p.mode === 'green' && h.kind === 'laser') {
        // 绿魂护盾不能整面挡住激光，只能靠方向判断削减伤害
        const s = soulPos(p);
        const side = Math.abs(h.x + h.w / 2 - s.x) > Math.abs(h.y + h.h / 2 - s.y)
          ? (h.x + h.w / 2 > s.x ? 1 : 3)
          : (h.y + h.h / 2 > s.y ? 2 : 0);
        if (side === p.gdir) {
          p.shieldFlash = 0.28;
          Sound.block();
          continue;
        }
      }
      hurt(h.dmg || 3, false, p);
      if (state !== 'endurance') return;
    }
  }
}

}

function applyCameraTransform() {
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-W / 2 + camera.x, -H / 2 + camera.y);
}

function drawDevTag() {
  ctx.save();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = `bold 10px ${MONO}`;
  ctx.fillStyle = 'rgba(255,207,31,0.9)';
  ctx.fillText('DEV · INVINCIBLE', W - 18, 16);
  ctx.restore();
}

function drawDevBanner() {
  const a = Math.min(1, devBanner / 0.4);
  const w = 230, h = 26, x = W / 2 - w / 2, y = 450;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(16,12,12,0.86)';
  rr(x, y, w, h, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,207,31,0.7)';
  ctx.lineWidth = 1;
  rr(x, y, w, h, 5);
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold 11px ${MONO}`;
  ctx.fillStyle = C.yellow;
  ctx.fillText('DEVELOPER MODE · INVINCIBLE', W / 2, y + h / 2 + 0.5);
  ctx.restore();
}

function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // 场景单独套运镜，HUD 固定在屏幕上
  ctx.save();
  applyCameraTransform();

  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  if (state === 'title') {
    drawTitle();
  } else if (state === 'difficulty') {
    drawDifficulty();
  } else if (state === 'ending') {
    drawEnding();
  } else if (state === 'gameover') {
    drawGameOver();
  } else if (state === 'enemycard') {
    drawEnemyCard();
  } else if (state === 'endurance') {
    drawStageCharacter();
    drawEnduranceScene();
  } else {
    if (state === 'attack' && layout === 'fall') {
      drawFallScene();
    } else {
      drawStageCharacter();
      if (state === 'attack') drawAttackScene();
      else {
        drawBox(box);
        if (state === 'dialog') drawDialog();
        else if (state === 'menu') drawMenu();
        else if (state === 'act') drawActMenu();
        else if (state === 'item') drawItemMenu();
        else if (state === 'mercy') drawMercyMenu();
        else if (state === 'fight') drawFight();
      }
    }
  }

  drawEffects();
  drawSparks();
  if (hitFx) drawHitFx();

  ctx.restore();
  ctx.restore();

  if (state === 'endurance') {
    drawEndHud();
    if (devMode) drawDevTag();
    if (devBanner > 0) drawDevBanner();
  } else if (!['title', 'difficulty', 'ending', 'gameover', 'enemycard'].includes(state)) {
    drawBossHp();
    drawPlayerHp();
    if (devMode) drawDevTag();
    if (devBanner > 0) drawDevBanner();
  }

  if (screenPulse > 0) {
    ctx.save();
    ctx.globalAlpha = screenPulse * 0.9;
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    ctx.restore();
  }

  if (flashScreen > 0) {
    ctx.save();
    ctx.globalAlpha = flashScreen * 4;
    ctx.fillStyle = '#ff2030';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (flashWhite > 0) {
    ctx.save();
    ctx.globalAlpha = flashWhite;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // Sans 式切场：白闪 → 压黑 → 硬切进下一套弹幕
  if (cutFx) {
    const k = clamp(cutFx.t / cutFx.dur, 0, 1);
    ctx.save();
    if (k < 0.34) {
      ctx.globalAlpha = 1 - k / 0.34;
      ctx.fillStyle = thirdPhase ? '#ff2a3c' : '#ffffff';
      ctx.fillRect(0, 0, W, H);
    } else if (k < 0.54) {
      ctx.globalAlpha = 0.72 * (1 - (k - 0.34) / 0.2);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
    }
    const edge = Math.max(0, 1 - k * 2.6);
    if (edge > 0) {
      ctx.globalAlpha = edge * 0.85;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12;
      ctx.strokeRect(0, 0, W, H);
      ctx.globalAlpha = edge * 0.5;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) {
        const y = (i * 97 + cutFx.t * 900) % H;
        ctx.fillRect(0, y, W, 1.5);
      }
    }
    ctx.restore();
  }

  if (storyHit) drawStoryHit();

  if (paused) drawPause();

  if (Sound.muted) {
    ctx.font = `10px ${MONO}`;
    ctx.fillStyle = darkMode() ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.35)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('MUTED [M]', 12, 464);
  }
}

/* ========================= BACKGROUND ========================= */

function drawBackground() {
  if (darkMode()) {
    ctx.fillStyle = '#070407';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(320, 180, 20, 320, 180, 430);
    g.addColorStop(0, 'rgba(120,8,22,0.4)');
    g.addColorStop(0.55, 'rgba(52,4,12,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 2;
    for (let i = 0; i < 18; i++) {
      const y = ((i * 41 + time * 95) % 620) - 70;
      ctx.beginPath();
      ctx.moveTo(-40, y);
      ctx.lineTo(240, y - 120);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(W + 40, y);
      ctx.lineTo(W - 240, y - 120);
      ctx.stroke();
    }
    ctx.restore();

    drawLattice('rgba(255,42,62,0.55)', 0.22, 2);

    // 第三阶段：背后展开的白色羽翼、放射状斩击与飘落的羽毛
    if (thirdPhase) {
      drawPhase3Wings(320, 150, 1.5, 0.22 + 0.05 * Math.sin(time * 1.5));

      ctx.save();
      ctx.globalAlpha = 0.1 + 0.04 * Math.sin(time * 2);
      ctx.translate(320, 140);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2 + time * 0.06;
        const len = 200 + (i % 4) * 40;
        ctx.strokeStyle = i % 4 === 0 ? 'rgba(255,255,255,0.7)' : 'rgba(220,20,40,0.6)';
        ctx.lineWidth = i % 4 === 0 ? 2 : 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40);
        ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      for (let i = 0; i < 22; i++) {
        const x = ((i * 61 + time * (10 + (i % 5) * 6)) % (W + 80)) - 40;
        const y = ((i * 43 + time * (24 + (i % 4) * 9)) % (H + 60)) - 30;
        ctx.globalAlpha = (0.22 + 0.22 * Math.sin(time * 2 + i)) * (1 - fadeProgress * 0.45);
        ctx.fillStyle = i % 3 ? 'rgba(255,255,255,0.8)' : 'rgba(255,150,170,0.7)';
        ctx.fillRect(Math.round(x), Math.round(y), 3, 9);
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 10; i++) {
      const x = (i * 97 + Math.sin(time * (0.5 + i * 0.1)) * 40 + 640) % 640;
      const y = (i * 53 + time * (30 + i * 3)) % 480;
      ctx.fillRect(x - 30, y, 60, 1);
    }
    ctx.restore();
    return;
  }

  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);

  // 棋盘底纹（参考图 1 的白底格子）
  ctx.save();
  ctx.fillStyle = 'rgba(20,17,16,0.026)';
  for (let y = 0; y < STAGE_H; y += 24) {
    for (let x = 0; x < W; x += 24) {
      if (((x / 24) + (y / 24)) % 2 === 0) ctx.fillRect(x, y, 24, 24);
    }
  }
  ctx.restore();

  // 参考图 1：立绘背后的红色像素电路纹路（左右镜像）
  drawLattice(C.red, 0.5, 2);

  // faint grid, kept only as light decoration
  ctx.save();
  ctx.strokeStyle = 'rgba(20,17,16,0.035)';
  ctx.lineWidth = 1;
  for (let x = 32; x < W; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, STAGE_H);
    ctx.stroke();
  }
  for (let y = 32; y < STAGE_H; y += 32) {
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(W, y + 0.5);
    ctx.stroke();
  }
  ctx.restore();

  // red frame around the stage
  ctx.save();
  ctx.strokeStyle = 'rgba(200,18,31,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(12, STAGE_H - 12);
  ctx.lineTo(12, 12);
  ctx.lineTo(W - 12, 12);
  ctx.lineTo(W - 12, STAGE_H - 12);
  ctx.stroke();

  ctx.strokeStyle = C.red;
  ctx.lineWidth = 3;
  const corner = 26;
  ctx.beginPath();
  ctx.moveTo(12, 12 + corner); ctx.lineTo(12, 12); ctx.lineTo(12 + corner, 12);
  ctx.moveTo(W - 12 - corner, 12); ctx.lineTo(W - 12, 12); ctx.lineTo(W - 12, 12 + corner);
  ctx.moveTo(12, STAGE_H - 12 - corner); ctx.lineTo(12, STAGE_H - 12); ctx.lineTo(12 + corner, STAGE_H - 12);
  ctx.moveTo(W - 12 - corner, STAGE_H - 12); ctx.lineTo(W - 12, STAGE_H - 12); ctx.lineTo(W - 12, STAGE_H - 12 - corner);
  ctx.stroke();
  ctx.restore();

  // faint diagonal accents
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    ctx.beginPath();
    ctx.moveTo(40 + i * 92, STAGE_H - 16);
    ctx.lineTo(110 + i * 92, 16);
    ctx.stroke();
  }
  ctx.restore();
}

/* 红色像素电路纹路：左半边的折线数据，绘制时按 640 镜像 */
const LATTICE_SEGS = [
  [[236, 42], [236, 206]],
  [[206, 72], [206, 152]],
  [[236, 58], [214, 58], [214, 82], [196, 82]],
  [[236, 58], [258, 58], [258, 74]],
  [[236, 96], [214, 96], [214, 112], [190, 112]],
  [[236, 132], [210, 132], [210, 158], [184, 158]],
  [[236, 168], [216, 168], [216, 188]],
  [[236, 190], [236, 206]],
  [[170, 80], [170, 172]],
  [[170, 92], [154, 92], [154, 72], [140, 72]],
  [[170, 132], [186, 132], [186, 148], [202, 148]],
  [[170, 152], [154, 152], [154, 130]],
  [[222, 74], [222, 86]],
  [[250, 74], [250, 86]],
  [[222, 140], [222, 152]],
  [[250, 140], [250, 152]],
  [[264, 118], [264, 126]],
  [[150, 108], [150, 116]]
];

function drawLattice(color, alpha, lw) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';

  for (let m = 0; m < 2; m++) {
    const mx = (x) => (m === 0 ? x : W - x);
    for (const seg of LATTICE_SEGS) {
      ctx.beginPath();
      ctx.moveTo(Math.round(mx(seg[0][0])), Math.round(seg[0][1]));
      for (let i = 1; i < seg.length; i++) {
        ctx.lineTo(Math.round(mx(seg[i][0])), Math.round(seg[i][1]));
      }
      ctx.stroke();

      // 末端箭头
      const n = seg.length;
      if (n >= 2) {
        const a = seg[n - 2], b = seg[n - 1];
        const ang = Math.atan2(b[1] - a[1], mx(b[0]) - mx(a[0]));
        ctx.beginPath();
        ctx.moveTo(Math.round(mx(b[0])), Math.round(b[1]));
        ctx.lineTo(Math.round(mx(b[0]) + Math.cos(ang + 2.45) * 8), Math.round(b[1] + Math.sin(ang + 2.45) * 8));
        ctx.moveTo(Math.round(mx(b[0])), Math.round(b[1]));
        ctx.lineTo(Math.round(mx(b[0]) + Math.cos(ang - 2.45) * 8), Math.round(b[1] + Math.sin(ang - 2.45) * 8));
        ctx.stroke();
      }
      // 节点小方块
      for (const pt of seg) ctx.fillRect(Math.round(mx(pt[0])) - 1, Math.round(pt[1]) - 1, 2, 2);
    }
    // 两个小菱形
    for (const d of [[176, 188, 7], [272, 106, 5]]) {
      const cx = Math.round(mx(d[0])), cy = Math.round(d[1]), r = d[2];
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r, cy);
      ctx.lineTo(cx, cy + r);
      ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* 第三阶段的巨大羽翼：阶梯状羽片，保持像素感 */
function drawPhase3Wings(cx, cy, scale, alpha) {
  const flap = 1 + Math.sin(time * 1.3) * 0.045;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(scale * flap, scale * flap);
  for (const dir of [-1, 1]) {
    ctx.save();
    ctx.scale(dir, 1);
    for (let layer = 0; layer < 3; layer++) {
      const off = layer * 13;
      const len = 148 - layer * 24;
      ctx.fillStyle = layer === 0 ? 'rgba(255,255,255,0.95)'
        : layer === 1 ? 'rgba(255,238,240,0.72)'
          : 'rgba(255,186,198,0.5)';
      ctx.beginPath();
      ctx.moveTo(10 + off * 0.4, -6 + off * 0.5);
      for (let i = 0; i <= 10; i++) {
        const px = 20 + (i / 10) * len;
        const py = -28 - Math.sin((i / 10) * Math.PI) * (48 - layer * 8) + (i % 2) * 6;
        ctx.lineTo(px, py + off * 0.5);
      }
      for (let i = 10; i >= 0; i--) {
        const px = 20 + (i / 10) * len;
        const py = -2 + Math.sin((i / 10) * Math.PI) * (58 - layer * 10) + off * 0.6 + (i % 2) * 5;
        ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1;
      for (let f = 0; f < 6; f++) {
        const fx = 32 + f * 20;
        ctx.beginPath();
        ctx.moveTo(fx, -8);
        ctx.lineTo(fx + 16, 30 - f * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ========================= STAGE / BOSS ========================= */

// 二阶段暗化：先用 multiply 吃掉立绘的白色底，再把四边溶进暗红背景
function enragedBlend(x, y, w, h) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = '#2a070d';
  ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'source-over';

  const edge = Math.min(52, w * 0.2, h * 0.2);
  const gx1 = ctx.createLinearGradient(x, 0, x + edge, 0);
  gx1.addColorStop(0, 'rgba(10,2,5,1)');
  gx1.addColorStop(1, 'rgba(10,2,5,0)');
  ctx.fillStyle = gx1;
  ctx.fillRect(x, y, edge, h);

  const gx2 = ctx.createLinearGradient(x + w - edge, 0, x + w, 0);
  gx2.addColorStop(0, 'rgba(10,2,5,0)');
  gx2.addColorStop(1, 'rgba(10,2,5,1)');
  ctx.fillStyle = gx2;
  ctx.fillRect(x + w - edge, y, edge, h);

  const gy1 = ctx.createLinearGradient(0, y, 0, y + edge);
  gy1.addColorStop(0, 'rgba(10,2,5,1)');
  gy1.addColorStop(1, 'rgba(10,2,5,0)');
  ctx.fillStyle = gy1;
  ctx.fillRect(x, y, w, edge);

  const gy2 = ctx.createLinearGradient(0, y + h - edge, 0, y + h);
  gy2.addColorStop(0, 'rgba(10,2,5,0)');
  gy2.addColorStop(1, 'rgba(10,2,5,1)');
  ctx.fillStyle = gy2;
  ctx.fillRect(x, y + h - edge, w, edge);

  const vig = ctx.createRadialGradient(x + w / 2, y + h * 0.42, Math.min(w, h) * 0.12, x + w / 2, y + h * 0.42, Math.max(w, h) * 0.62);
  vig.addColorStop(0, 'rgba(10,2,5,0)');
  vig.addColorStop(0.66, 'rgba(10,2,5,0.22)');
  vig.addColorStop(1, 'rgba(10,2,5,0.88)');
  ctx.fillStyle = vig;
  ctx.fillRect(x, y, w, h);

  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let sy = y; sy < y + h; sy += 4) ctx.fillRect(x, sy, w, 1);

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,40,60,' + (0.035 + 0.025 * Math.sin(time * 9)) + ')';
  ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'source-over';

  // 刻意的红色边框：让这块区域读作“被侵蚀的立绘框”而不是残留白底
  ctx.strokeStyle = 'rgba(255,52,66,' + (0.55 + 0.2 * Math.sin(time * 7)) + ')';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.strokeStyle = 'rgba(120,8,18,0.9)';
  ctx.lineWidth = 6;
  ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
  ctx.restore();
}

// 第三阶段的舞台装饰：缓慢反向旋转的审判之环、上浮的红色余烬、飘落的白羽
function drawThirdAura() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,70,95,0.16)';
  ctx.lineWidth = 2;
  ctx.setLineDash([12, 16]);
  ctx.lineDashOffset = -time * 32;
  ctx.beginPath();
  ctx.ellipse(320, 158, 152, 84, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,230,0.12)';
  ctx.lineDashOffset = time * 48;
  ctx.beginPath();
  ctx.ellipse(320, 158, 118, 64, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) {
    const px = 120 + ((i * 71 + time * 14) % 400);
    const py = 252 - ((i * 43 + time * (18 + (i % 3) * 7)) % 232);
    const a = 0.12 + 0.12 * Math.sin(time * 3 + i);
    ctx.fillStyle = `rgba(255,60,80,${Math.max(0.04, a)})`;
    ctx.fillRect(Math.round(px), Math.round(py), 2, 5);
  }
  ctx.globalCompositeOperation = 'source-over';

  for (let i = 0; i < 6; i++) {
    const px = 90 + ((i * 121 + time * 11) % 470);
    const py = 18 + ((i * 67 + time * 13) % 226);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(Math.sin(time * 1.7 + i) * 0.5);
    ctx.globalAlpha = 0.12 + 0.09 * Math.sin(time * 2 + i);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-1, -6, 2, 10);
    ctx.fillRect(-4, -4, 8, 1.4);
    ctx.fillRect(-3, 0, 6, 1.2);
    ctx.restore();
  }
  ctx.restore();
}

function drawStageCharacter() {
  const x = SPRITE.x + (boss.shake > 0 ? rand(-4, 4) : 0);
  const y = SPRITE.y + (boss.shake > 0 ? rand(-3, 3) : 0);

  const glow = ctx.createRadialGradient(320, 150, 20, 320, 150, 190);
  glow.addColorStop(0, thirdPhase ? 'rgba(255,70,95,0.2)' : enraged ? 'rgba(200,18,31,0.22)' : 'rgba(200,18,31,0.07)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, STAGE_H);

  if (thirdPhase) drawThirdAura();

  if (stageArt.ready) {
    const art = enraged && stageArt.red ? stageArt.red : stageArt.canvas;
    if (thirdPhase) {
      // 闪避残影
      if (dodgeFx) {
        const dx = dodgeFx.side * (40 + dodgeFx.t * 120);
        ctx.save();
        ctx.globalAlpha = Math.max(0, 0.3 - dodgeFx.t * 0.5);
        ctx.drawImage(art, x - dx, y, SPRITE.w, SPRITE.h);
        ctx.restore();
      }
      drawDissolvingArt(art, x, y, SPRITE.w, SPRITE.h);
    } else {
      ctx.save();
      if (enraged) {
        ctx.shadowColor = 'rgba(220,20,40,0.6)';
        ctx.shadowBlur = 24;
      }
      ctx.drawImage(art, x, y, SPRITE.w, SPRITE.h);
      ctx.restore();
    }
  } else if (stageImg.complete && stageImg.naturalWidth) {
    if (thirdPhase) {
      drawDissolvingArt(stageImg, x, y, SPRITE.w, SPRITE.h);
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.rect(SPRITE.x - 26, 0, SPRITE.w + 52, STAGE_H);
      ctx.clip();
      ctx.drawImage(stageImg, x, y, SPRITE.w, SPRITE.h);
      ctx.restore();
      if (enraged) enragedBlend(SPRITE.x - 26, 0, SPRITE.w + 52, STAGE_H);
    }
  }

  if (boss.flash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.75, boss.flash * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(SPRITE.x, 0, SPRITE.w, STAGE_H);
    ctx.restore();
  }

  if (state === 'mercy' && spareReady()) drawMercyBloom();

  if (thirdPhase) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

// 第三阶段：立绘按横条一点点缺失，像身体正在被时间擦掉
function drawDissolvingArt(art, x, y, w, h) {
  const aw = art.width || art.naturalWidth || w;
  const ah = art.height || art.naturalHeight || h;
  const bands = 26;
  ctx.save();
  for (let i = 0; i < bands; i++) {
    if (hash01(i * 7 + 3) < fadeProgress * 1.12) {
      // 缺掉的位置漏出一点红光
      if (hash01(i * 13 + 5) < fadeProgress * 0.5) {
        ctx.globalAlpha = 0.1;
        ctx.fillStyle = '#ff3048';
        ctx.fillRect(x, y + (i / bands) * h, w, h / bands + 0.6);
      }
      continue;
    }
    ctx.globalAlpha = 0.94 - fadeProgress * 0.25;
    ctx.drawImage(
      art,
      0, (i / bands) * ah, aw, ah / bands,
      x, y + (i / bands) * h, w, h / bands + 0.7
    );
  }
  ctx.restore();

  // 消散的光点
  ctx.save();
  for (let i = 0; i < 20; i++) {
    if (hash01(i * 11 + 4) > fadeProgress) continue;
    const px = x + hash01(i * 5 + 1) * w;
    const py = y + ((hash01(i * 3 + 2) * h + time * 26) % h);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.9)' : 'rgba(255,90,110,0.8)';
    ctx.fillRect(Math.round(px), Math.round(py), 2, 4);
  }
  ctx.restore();
}

/* ========================= ENDURANCE RENDER ========================= */

function drawEnduranceScene() {
  const e = endurance;
  if (!e) return;
  drawMotes();

  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = e.tint;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  if (e.mandala) drawEndMandala();
  for (let i = 0; i < arenaBoxes.length; i++) drawEndWindow(arenaBoxes[i], i);
  if (e.wedge) drawEndWedge();
  drawEndHazards();

  for (const beam of beams) if (beam.full) drawLaser(beam);
  for (const beam of beams) if (!beam.full) drawBeamEye(beam);
  for (const l of lashes) drawLash(l);
  drawOuterBullets();
  // 绿魂长矛在框外蓄力，瞄准线要画在裁剪之外才看得见
  for (const bullet of bullets) {
    if (bullet.greenSpear && bullet.delay > 0) {
      drawGreenSpearAim(bullet, arenaBoxes[bullet.arena || 0] || box);
    }
  }

  for (let ai = 0; ai < arenaBoxes.length; ai++) {
    const b = arenaBoxes[ai];
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
    ctx.clip();

    for (const beam of beams) {
      if (beam.full) continue;
      if ((beam.arena || 0) === ai) drawBeam(beam);
    }
    for (const w of wheels) if ((w.arena || 0) === ai) drawWheel(w);
    for (const bullet of bullets) {
      if (bullet.outer) continue;
      if ((bullet.arena || 0) !== ai) continue;
      if (bullet.kind === 'ghost') drawGhostBullet(bullet);
      else drawBullet(bullet);
    }
    for (const s of shots) if ((s.arena || 0) === ai) drawShot(s);
    if (player && (player.arena || 0) === ai) drawSoul(player);

    ctx.restore();
  }

  if (e.phasePulse > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.5, e.phasePulse) * 0.5;
    ctx.strokeStyle = e.tint;
    ctx.lineWidth = 12;
    ctx.strokeRect(4, 4, W - 8, H - 8);
    ctx.restore();
  }

  if (e.cleared) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, e.clearT / 2.4) * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// 开头杀 / 终焉收束的安全楔形区：随攻击缓慢旋转
function drawEndWedge() {
  const e = endurance;
  const b = arenaBoxes[0] || box;
  if (!b) return;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const rad = Math.hypot(b.w, b.h) * 0.62;
  const a = e.wedge.a, half = e.wedge.half || 0.9;
  const pulse = 0.5 + 0.5 * Math.sin(time * 6);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, rad, a - half, a + half);
  ctx.closePath();
  ctx.fillStyle = `rgba(255,255,255,${(0.045 + 0.025 * pulse).toFixed(3)})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${(0.30 + 0.22 * pulse).toFixed(3)})`;
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 7]);
  ctx.lineDashOffset = -time * 44;
  ctx.stroke();
  ctx.restore();
}

// 绿魂长矛蓄力：从出场边沿到灵魂中心的白色虚线 + 边缘脉冲箭头
function drawGreenSpearAim(bullet, b) {
  const p = player;
  if (!p) return;
  const s = soulPos(p);
  const pulse = 0.5 + 0.5 * Math.sin(time * 26);
  ctx.save();
  ctx.globalAlpha = 0.25 + 0.35 * pulse;
  ctx.strokeStyle = '#d8ffe0';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.lineDashOffset = -time * 70;
  ctx.beginPath();
  ctx.moveTo(bullet.x, bullet.y);
  ctx.lineTo(s.x, s.y);
  ctx.stroke();
  ctx.setLineDash([]);
  // 边缘箭头
  const dir = bullet.dir || 0;
  const ax = dir === 1 ? -1 : dir === 3 ? 1 : 0;
  const ay = dir === 0 ? 1 : dir === 2 ? -1 : 0;
  ctx.fillStyle = '#eaffef';
  for (let i = 0; i < 4; i++) {
    const k = 6 + i * 4 + pulse * 3;
    const w = Math.max(1, 4 - i);
    ctx.fillRect(Math.round(bullet.x + ax * k) - (w >> 1), Math.round(bullet.y + ay * k) - (w >> 1), w, w);
  }
  ctx.restore();
}

  ctx.fillRect(b.x - o, b.y + b.h + o - 2, L, 2);
  ctx.fillRect(b.x - o, b.y + b.h + o - L, 2, L);
  ctx.fillRect(b.x + b.w + o - L, b.y + b.h + o - 2, L, 2);
