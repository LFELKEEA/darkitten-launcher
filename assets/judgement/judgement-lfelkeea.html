// 从图片四边泛洪抠掉纯白背景，保留被线条包住的内部白色（头发、外套）
// 同时生成一张按亮度重新着色的暗红版本，供二阶段使用
const stageArt = { canvas: null, red: null, ready: false };
function cutWhite(src) {
  const w = src.naturalWidth, h = src.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  const img = g.getImageData(0, 0, w, h);
  const d = img.data;
  const bg = new Uint8Array(w * h);
  const isBg = (i) => {
    const p = i * 4;
    return d[p] >= 236 && d[p + 1] >= 236 && d[p + 2] >= 236;
  };
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y++) { stack.push(y * w, y * w + w - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (bg[i] || !isBg(i)) continue;
    bg[i] = 1;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) stack.push(i - 1);
    if (x < w - 1) stack.push(i + 1);
    if (y > 0) stack.push(i - w);
    if (y < h - 1) stack.push(i + w);
  }

  const ri = g.createImageData(w, h);
  const rd = ri.data;
  for (let i = 0; i < w * h; i++) {
    const p = i * 4;
    if (bg[i]) { d[p + 3] = 0; continue; }
    const L = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
    rd[p] = Math.min(255, L * 0.86);
    rd[p + 1] = Math.min(255, L * 0.11);
    rd[p + 2] = Math.min(255, L * 0.14);
    rd[p + 3] = d[p + 3];
  }
  g.putImageData(img, 0, 0);

  const rc = document.createElement('canvas');
  rc.width = w;
  rc.height = h;
  rc.getContext('2d').putImageData(ri, 0, 0);
  return { canvas: c, red: rc };
}
function prepareArt() {
  if (!stageImg.naturalWidth) return;
  if (stageArt.ready) return;
  try {
    const art = cutWhite(stageImg);
    stageArt.canvas = art.canvas;
    stageArt.red = art.red;
    stageArt.ready = true;
  } catch (e) { stageArt.ready = false; }
}
stageImg.onload = prepareArt;
if (stageImg.complete) prepareArt();

const bustArt = { canvas: null, red: null, ready: false };
function prepareBust() {
  if (!bustImg.naturalWidth) return;
  if (bustArt.ready) return;
  try {
    const art = cutWhite(bustImg);
    bustArt.canvas = art.canvas;
    bustArt.red = art.red;
    bustArt.ready = true;
  } catch (e) { bustArt.ready = false; }
}
bustImg.onload = prepareBust;
if (bustImg.complete) prepareBust();

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

const HEART = [
  '0110110',
  '1111111',
  '1111111',
  '0111110',
  '0011100',
  '0001000'
];

function drawHeart(cx, cy, cell, color) {
  const w = 7 * cell;
  const h = 6 * cell;
  const x0 = Math.round(cx - w / 2);
  const y0 = Math.round(cy - h / 2);
  ctx.fillStyle = color;
  for (let r = 0; r < HEART.length; r++) {
    for (let c = 0; c < 7; c++) {
      if (HEART[r][c] === '1') ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);
    }
  }
}

function wrapText(text, maxW, font) {
  ctx.font = font;
  const out = [];
  let cur = '';
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur) {
      out.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) out.push(cur);
  return out;
}

        mb(MIDI_HZ(note), ldur, ltype, lvol);
        if (tier >= 1) mb(MIDI_HZ(note - 12), tier === 2 ? 0.42 : 0.09, 'sine', 0.012);
        if (tier >= 3) mb(MIDI_HZ(note + 12), 0.05, 'square', 0.006);
        if (tier === 0 && sec === 3) mb(MIDI_HZ(note + 12), 0.06, 'square', 0.008);
      }
      // 每四小节只在末尾放一句很轻的四音应答，不抢主旋律
      const secStep = s % 64;
      if (secStep >= 32 && secStep < 36) {
        const answer = tier === 1 ? (((sec + loop) % 2) ? MUSIC_P2B : MUSIC_P2A)
          : tier === 2 ? MUSIC_P3 : tier === 3 ? MUSIC_P4 : tier === 4 ? MUSIC_EN : null;
        if (answer) {
          const q = answer[((bar % 4) * 4 + (secStep - 32)) % 64];
          if (q) mb(MIDI_HZ(q), 0.13, 'triangle', 0.012);
        }
      }
    }

    // 暗段只留一条极轻的叹息，把中高频让给主题
    if (dark && tier !== 4 && tier !== 5) {
      const e = MUSIC_E[s % 64];
      if (e) mb(MIDI_HZ(e + 12), 0.5, 'sine', 0.0045);
    }
    // 一阶段末段才让对位旋律进来一次
    if (tier === 0 && sec === 3) {
      const cnt = MUSIC_C[s % 64];
      if (cnt) mb(MIDI_HZ(cnt), 0.1, 'triangle', 0.01);
    }
    // 最终阶段：每两小节一次高音钟声
    if (tier === 5 && s % 32 === 16) {
      mb(MIDI_HZ(chord[2] + 24), 0.8, 'triangle', 0.008);
    }

    // 鼓组：四拍走稳，暗段也只加一点点，不再堆十六分地鼓
    const kicks = tier === 5 ? [0, 6, 11] : dark ? [0, 3, 6, 8, 11, 14] : [0, 6, 8, 14];
    if (kicks.includes(i)) this.kick(tier === 5 ? 0.13 : dark ? 0.12 : 0.11);
    if (i === 4 || i === 12) this.snare(tier === 5 ? 0.035 : 0.045);
    if (i % 2 === 0 && tier !== 5) this.hat(false);
    if (i === 15 && bar % 2 === 1 && tier !== 5) this.hat(true);
    // 终焉后段：切分碎拍与反拍重音
    if (endLvl >= 3 && (i === 2 || i === 9 || i === 11)) this.kick(0.05);
    if (endLvl >= 4 && (i === 3 || i === 7 || i === 13)) this.snare(0.035);

    // 攻击阶段：只留一点低频脉冲，不另外堆踩镲
    if (this.tense && i % 8 === 0) mn(0.03, 0.015, 5200);

    // 每四小节：一次落槌式的重音，末尾三下（三重审判）
    const sectionStep = s % 64;
    if (sectionStep === 0) {
      mb(MIDI_HZ(root + 12), 0.3, 'sawtooth', 0.016, MIDI_HZ(root));
      mn(0.22, 0.03, 700);
    }
    if (sectionStep === 56 || sectionStep === 58 || sectionStep === 60) {
      const drop = sectionStep === 56 ? 0 : sectionStep === 58 ? 2 : 4;
      mb(MIDI_HZ(root + 12 - drop), 0.12, 'triangle', 0.028 - drop * 0.003);
    }
    // 残血：心跳
    if (this.danger && (i === 0 || i === 2)) this.kick(i === 0 ? 0.09 : 0.05);
  }
};

// 运镜：围绕画面中心做轻微位移/缩放，只作用于场景，不影响 HUD
const camera = { x: 0, y: 0, zoom: 1, tx: 0, ty: 0, tz: 1 };

function setCamera(x, y, z) {
  camera.tx = x || 0;
  camera.ty = y || 0;
  camera.tz = z == null ? 1 : z;
}

function snapCamera() {
  camera.x = camera.tx = 0;
  camera.y = camera.ty = 0;
  camera.zoom = camera.tz = 1;
}

function updateCamera(dt) {
  const k = Math.min(1, dt * 7);
  camera.x += (camera.tx - camera.x) * k;
  camera.y += (camera.ty - camera.y) * k;
  camera.zoom += (camera.tz - camera.zoom) * Math.min(1, dt * 9);
  if (Math.abs(camera.tx - camera.x) < 0.05) camera.x = camera.tx;
  if (Math.abs(camera.ty - camera.y) < 0.05) camera.y = camera.ty;
  if (Math.abs(camera.tz - camera.zoom) < 0.001) camera.zoom = camera.tz;
}

// 只吃掉与指令前缀完全吻合的按键，避免误伤正常操作
function devFeed(k) {
  if (devMode || !k || k.length !== 1) return false;
  if (k === DEV_CODE[devBuf.length]) {
    devBuf += k;
    if (devBuf.length === DEV_CODE.length) {
      devBuf = '';
      enableDevMode();
    }
    return true;
  }
  devBuf = k === DEV_CODE[0] ? k : '';
  return false;
}

function enableDevMode() {
  if (devMode) return;
  devMode = true;
  if (player) {

/* ========================= DIALOG ========================= */

function L(who, text) { return { who, text }; }

function queueDialog(lines, onEnd) {
  dialog = { lines, idx: 0, shown: 0, onEnd: onEnd || null, t: 0 };
  state = 'dialog';
}

function advanceDialog() {
  if (!dialog) return;
  const line = dialog.lines[dialog.idx];
  if (dialog.shown < line.text.length) {
    dialog.shown = line.text.length;
    return;
  }
  dialog.idx++;
  if (dialog.idx >= dialog.lines.length) {
    const cb = dialog.onEnd;
    dialog = null;
    if (cb) cb();
  } else {
    dialog.shown = 0;
    Sound.menu();
  }
}

function updateDialog(dt) {
  if (!dialog) return;
  dialog.t += dt;
  const line = dialog.lines[dialog.idx];
  if (line) dialog.shown = Math.min(line.text.length, dialog.shown + dt * 48);
}

/* ========================= INPUT ========================= */

const keys = {};
const codes = {};

function onKeyDown(e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter', 'Tab'].includes(e.key)) e.preventDefault();
  Sound.init();
  if (e.code && e.code.indexOf('Numpad') === 0) codes[e.code] = true;
  const low = e.key.toLowerCase();
  const fresh = !keys[low];
  keys[low] = true;
  if (fresh && devFeed(e.key)) return;
  if (fresh) handlePress(low, e.code || '');
}

function onKeyUp(e) {
  keys[e.key.toLowerCase()] = false;
  if (e.code && e.code.indexOf('Numpad') === 0) codes[e.code] = false;
}

function handlePress(k, code) {
  if (storyHit) return;
  if (state === 'enemycard') return;
  if (k === 'm') {
    Sound.muted = !Sound.muted;
    if (Sound.master) Sound.master.gain.value = Sound.muted ? 0 : 0.14;
    return;
  }
  if ((k === 'p' || k === 'escape') && !['title', 'gameover', 'ending'].includes(state)) {
    paused = !paused;
    Sound.menu();
    return;
  }
  if (paused) {
    if (k === 'p' || k === 'escape') paused = false;
    return;
  }

  if (state === 'title') {
    if (k === 'e') { Sound.confirm(); startEndurance(); return; }
    if (k === 'z' || k === 'enter' || k === ' ') { Sound.confirm(); state = 'difficulty'; menuIndex = 1; }
    return;
  }

  if (state === 'difficulty') {
    if (k === 'arrowleft' || k === 'a' || k === 'arrowright' || k === 'd') {
      menuIndex = menuIndex === 1 ? 0 : 1;
      Sound.menu();
    }
    if (k === 'z' || k === 'enter' || k === ' ') {
      difficulty = menuIndex;
      Sound.confirm();
      startGame();
    }
    if (k === 'x' || k === 'shift') {
      Sound.cancel();
      state = 'title';
      menuIndex = 0;
    }
    return;
  }

  if (state === 'dialog') {
    if (k === 'z' || k === 'enter' || k === ' ') advanceDialog();
    return;
  }

  if (state === 'endurance') {
    if ((k === 'q' || k === 'tab') && arenaBoxes.length > 1) cycleEndPanel();
    return;
  }

  if (state === 'attack') {
    if (k === ' ') {
      if (player) shootFrom(player);
      if (player2) shootFrom(player2);
    }
    if (player && player.mode === 'green' && !player2) {
      let g = -1;
      if (k === 'arrowup' || k === 'w') g = 0;
      else if (k === 'arrowright' || k === 'd') g = 1;
      else if (k === 'arrowdown' || k === 's') g = 2;
      else if (k === 'arrowleft' || k === 'a') g = 3;
      if (g >= 0 && g !== player.gdir) { player.gdir = g; Sound.menu(); }
    }
    return;
  }

  if (state === 'menu') {
    if (k === 'arrowleft' || k === 'a') { menuIndex = (menuIndex + 3) % 4; Sound.menu(); }
    if (k === 'arrowright' || k === 'd') { menuIndex = (menuIndex + 1) % 4; Sound.menu(); }
    if (k === 'z' || k === 'enter' || k === ' ') activateMenu();
    return;
  }

  if (state === 'act' || state === 'item' || state === 'mercy') {
    if (k === 'x' || k === 'shift') { Sound.cancel(); state = 'menu'; return; }
    const list = state === 'act' ? actOptions : (state === 'item' ? items : [{ name: '饶恕' }, { name: '逃跑' }]);
    if (k === 'arrowup' || k === 'w') { subIndex = (subIndex + list.length - 1) % list.length; Sound.menu(); }
    if (k === 'arrowdown' || k === 's') { subIndex = (subIndex + 1) % list.length; Sound.menu(); }
    if (k === 'z' || k === 'enter' || k === ' ') {
      if (state === 'act') applyAct(subIndex);
      else if (state === 'item') useItem(subIndex);
      else tryMercy(subIndex);
    }
    return;
  }

  if (state === 'fight') {
    if ((k === 'z' || k === 'enter' || k === ' ') && fight && !fight.stopped) stopFight(true);
    return;
  }

  if (state === 'gameover') {
    if (k === 'z' || k === 'enter' || k === ' ') retryBattle();
    if (k === 'x' || k === 'shift') goTitle();
    return;
  }

  if (state === 'ending') {
    if (k === 'z' || k === 'enter' || k === ' ') goTitle();
    if (k === 'r') { const d = difficulty; resetBattle(); difficulty = d; startGame(); }
    return;
  }
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  for (const c in codes) codes[c] = false;
});

/* ========================= MENU ACTIONS ========================= */

function activateMenu() {
  Sound.confirm();
  if (menuIndex === 0) {
    stats.fights++;
    fight = {
      t: 0,
      dur: enraged ? 0.76 : (difficulty === 1 ? 0.95 : 1.18),
      pos: 0, stopped: false, post: 0, dmg: 0, acc: 0
    };
    state = 'fight';
    Sound.fight();
  } else if (menuIndex === 1) {
    state = 'act';
    subIndex = 0;
  } else if (menuIndex === 2) {
    state = 'item';
    subIndex = 0;
  } else {
    state = 'mercy';
    subIndex = 0;
  }
}

function applyAct(i) {
  const opt = actOptions[i];
  if (!opt) return;
  if (opt.used) { Sound.cancel(); return; }
  opt.used = true;
  stats.acts++;
  Sound.confirm();
  const lines = [];
  if (opt.id === 'check') {
    lines.push(L('narr', 'LFELKEEA —— 审判者'));
    lines.push(L('narr', `ATK ${boss.atk}   DEF ${boss.def}   剩余 HP ${Math.max(0, Math.ceil(boss.hp))}`));
    lines.push(L('boss', '……看什么看。我脸上有东西吗？'));
    lines.push(L('narr', '她抱着手臂，尾巴尖却在轻轻晃。'));
  } else if (opt.id === 'talk') {
    mercyCount = Math.min(4, mercyCount + 1);
    lines.push(L('boss', '……哼。现在才想起来跟我说话？晚了吧，笨蛋。'));
    lines.push(L('narr', '她的语气很凶，但没有动手。'));
  } else if (opt.id === 'pat') {
    mercyCount = Math.min(4, mercyCount + 1);
    lines.push(L('boss', '喂、喂！谁准你摸我头了！……就、就一下啊。'));
    lines.push(L('narr', '她的耳朵抖了抖，尾巴差点翘起来。'));
  } else if (opt.id === 'sorry') {
    mercyCount = Math.min(4, mercyCount + 1);
    lines.push(L('boss', '……道歉有用的话，还要审判做什么。'));
    lines.push(L('narr', '她别过脸，声音轻了一点。'));
  } else if (opt.id === 'taunt') {
    lines.push(L('boss', '哈？你是在小看我吗？'));
    lines.push(L('narr', '她的眼睛亮起危险的红光。下一击会更重。'));
    boss.atk += 2;
  }
  if (spareReady() && !spareHintShown) {
    spareHintShown = true;
    lines.push(L('boss', '……你的手，从刚才开始就没碰过刀呢。'));
    lines.push(L('narr', '她的名字变成了黄色。'));
  }
  queueDialog(lines, () => startBossTurn());
}

function useItem(i) {
  const it = items[i];
  if (!it || it.count <= 0) { Sound.cancel(); return; }
  it.count--;
  stats.items++;
  Sound.heal();
  const before = player.hp;
  player.hp = Math.min(player.max, player.hp + it.heal);
  const healed = player.hp - before;
  if (it.kr) player.kr = 0;
  const lines = [];
  lines.push(L('narr', `你使用了 ${it.name}。`));
  if (healed > 0) lines.push(L('narr', `HP 恢复了 ${healed} 点。`));
  else lines.push(L('narr', 'HP 已经满了。'));
  if (it.kr) lines.push(L('narr', 'KR 被清除了。'));
  if (it.name === '猫罐头') lines.push(L('boss', '……那个，是我的口味。'));
  queueDialog(lines, () => startBossTurn());
}

function tryMercy(i) {
  stats.mercyTries++;
  if (i === 0) {
    if (difficulty === 1) {
      // 困难饶恕线：所有互动都回应过，才会计入饶恕次数
      if (!allActsUsed()) {
        Sound.cancel();
        queueDialog([
          L('boss', '……你还有什么话没说吧。'),
          L('narr', `先把她所有的反应都看一遍（${actsUsedCount()} / ${actOptions.length}）。`)
        ], () => startBossTurn());
        return;
      }
      if (spareReady()) {
        spareCount = HARD_SPARE_TARGET;
        spareEnding();
        return;
      }
      spareCount++;
      Sound.cancel();
      const left = HARD_SPARE_TARGET - spareCount;
      queueDialog([
        L('boss', spareCount >= 6 ? '……你还要说多少次。' : '……就这样？'),
        L('narr', `你第 ${spareCount} 次选择了饶恕。她的眼神动摇了一下。`),
        L('narr', `还差 ${left} 次。`)
      ], () => startBossTurn());
      return;
    }
    if (spareReady()) {
      spareEnding();
    } else {
      Sound.cancel();
      queueDialog([
        L('boss', '想让我放过你？还早呢。'),
        L('narr', '她还没有原谅你。')
      ], () => startBossTurn());
    }
  } else {
    Sound.cancel();
    queueDialog([
      L('boss', '想跑？审判还没结束呢。'),
      L('narr', '你被一股看不见的力量拉了回来。')
    ], () => startBossTurn());
  }
}

/* ========================= FIGHT ========================= */

function stopFight(pressed) {
  if (!fight || fight.stopped) return;
  fight.pos = clamp(fight.pos, 0, 1);
  let acc = pressed ? 1 - Math.abs(fight.pos - 0.5) * 2 : 0.04;
  acc = clamp(acc, 0, 1);
  let dmg = Math.round(6 + acc * 13);
  if (acc > 0.92) dmg += 7;
  // 困难（JUDGEMENT）模式：你的攻击伤害翻倍
  if (difficulty === 1) dmg *= 2;
  fight.stopped = true;
  fight.acc = acc;
  fight.dmg = dmg;
  fight.post = 0;
  // 第三阶段：她已经碰不到了，所有攻击都会落空
  if (thirdPhase) {
    fight.miss = true;
    dodgeFx = { t: 0, side: Math.random() < 0.5 ? -1 : 1 };
    Sound.dodge();
    addText(320, 150, 'MISS', C.white);
    return;
  }
  damageBoss(dmg, acc);
  Sound.slash();
  shake = Math.max(shake, 12);
}

function updateFight(dt) {
  if (!fight) return;
  if (!fight.stopped) {
    fight.t += dt;
    fight.pos = clamp(fight.t / fight.dur, 0, 1);
    if (fight.pos >= 1) stopFight(false);
  } else {
    fight.post += dt;
    if (fight.post > 1.2) {
      const missed = fight.miss;
      fight = null;
      if (missed) startBossTurn();
      else afterFight();
    }
  }
}

function damageBoss(dmg, acc) {
  boss.hp = Math.max(0, boss.hp - dmg);
  stats.damage += dmg;
  lastFightDmg = dmg;
  boss.flash = 0.35;
  boss.shake = 0.45;
  screenPulse = 0.22;
  hitFx = { t: 0, dur: 0.58, dmg, acc };
  addRing(SPRITE.x + SPRITE.w / 2, 150, 18, 130, 'rgba(255,50,70,0.85)', 0.5, 3);
  for (let i = 0; i < 22; i++) {
    sparks.push({
      x: SPRITE.x + SPRITE.w * rand(0.25, 0.75),
      y: rand(70, 230),
      vx: rand(-170, 170), vy: rand(-150, 60),
      life: rand(0.3, 0.8),
      color: i % 3 ? C.red : C.white
    });
  }
}

function afterFight() {
  if (thirdPhase) { startBossTurn(); return; }
  if (boss.hp <= 0) { startThirdPhase(); return; }
  // 剧情受击演出：她被打中（进入二阶段时触发一次），不是玩家受击
  const hitThreshold = isGenocideRoute() ? 0.55 : 0.7;
  if (!bossHitShown && boss.hp <= boss.max * hitThreshold) {
    bossHitShown = true;
    storyHit = { t: 0, dur: 1.75, dmg: Math.max(1, lastFightDmg), boss: true };
    afterBossHit = afterFight;
    Sound.storyHit();
    camera.zoom = Math.max(camera.zoom, 1.08);
    setCamera(0, 0, 1);
    shake = Math.max(shake, 16);
    flashWhite = 0.5;
    addRing(SPRITE.x + SPRITE.w / 2, 150, 20, 180, 'rgba(255,60,80,0.9)', 0.7, 4);
    return;
  }
  if (isGenocideRoute() && !enraged && boss.hp <= boss.max * 0.55) {
    enraged = true;
    phase = 2;
    Sound.enrage();
    Sound.stopMusic();
    shake = 18;
    flashWhite = 0.55;
    queueDialog([
      L('narr', '她的影子忽然拉长，吞没了整条走廊。'),
      L('boss', '……'),
      L('boss', '你还要往前走。'),
      L('boss', '……那就别指望我手下留情了。'),
      L('narr', '走廊里的温度消失了。')
    ], () => {
      enemyCard = { t: 0, dur: 2.7 };
      state = 'enemycard';
      Sound.enemyCard();
      flashWhite = 0.4;
    });
    return;
  }
  const ratio = boss.hp / boss.max;
  const nextPhase = ratio <= 0.18 ? 4 : ratio <= 0.4 ? 3 : ratio <= 0.7 ? 2 : 1;
  if (nextPhase > phase) {
    phase = nextPhase;
    Sound.setMood(phase >= 4 ? 'phase4' : phase === 3 ? 'phase3' : 'phase2');
    Sound.phaseShift(phase - 1);
    const line = phase === 2
      ? '……不错嘛。不过，热身结束了。'
      : phase === 3
        ? '你比我想的更能撑。……那就认真一点。'
        : '为什么……你非要做到这一步。笨蛋。';
    queueDialog([L('boss', line)], () => startBossTurn());
  } else {
    startBossTurn();
  }
}

/* ========================= THIRD PHASE ========================= */

// 血量归零后：她还剩最后一口气，站起来，然后开始一点点消失
function startThirdPhase() {
  if (thirdPhase) return;
  thirdPhase = true;
  phase = 5;
  thirdTurn = 0;
  fadeProgress = 0;
  boss.hp = 0;
  boss.hpShown = 0;
  bossHitShown = true;
  enraged = false;
  fight = null;
  attack = null;
  bullets = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  Sound.stopMusic();
  Sound.revive();
  shake = 24;
  flashWhite = 1;
  flashScreen = 0.6;
  snapCamera();
  setCamera(0, 0, 1.04);
  enemyCard = { t: 0, dur: 4.8, third: true };
  state = 'enemycard';
}

function fadeEnding() {
  const gen = isGenocideRoute();
  state = 'ending';
  ending = {
    type: 'fade', t: 0,
    hard: difficulty === 1,
    route: gen ? 'genocide' : 'neutral',
    linked: hasJudgementHook()
  };
  snapCamera();
  Sound.stopMusic();
  Sound.gone();
  killFinish();
  shake = 10;
  reportJudgement(gen ? 'genocide' : 'neutral');
}

function pickAttack() {
  let id;
  if (thirdPhase) {
    thirdTurn++;
    // 第三阶段：开场直接上最华丽的一套，之后每第三轮压进骨栅
    if (thirdTurn > 1 && thirdTurn % 3 === 0) {
      id = 'palisade';
    } else {
      id = THIRD_ORDER[(thirdTurn - 1) % THIRD_ORDER.length];
    }
  } else if (enraged) {
    id = GEN_ORDER[(turn - 1) % GEN_ORDER.length];
  } else if (turn <= ATTACK_ORDER.length) {
    id = ATTACK_ORDER[turn - 1];
  } else {
    const pool = ['bones', 'claw', 'rain', 'blueorange', 'blasters', 'dual', 'whip', 'spiral', 'green', 'fall', 'shards', 'gravity', 'orange', 'yellow', 'laser', 'carousel', 'ricochet', 'requiem', 'palisade', 'drift', 'bisect'];
    id = pool[(turn - ATTACK_ORDER.length - 1) % pool.length];
  }
  if (id === lastAttack) {
    id = thirdPhase ? THIRD_ORDER[thirdTurn % THIRD_ORDER.length]
      : enraged ? GEN_ORDER[turn % GEN_ORDER.length] : ATTACK_ORDER[turn % ATTACK_ORDER.length];
  }
  lastAttack = id;
  return id;
}

// 第三阶段：她消失到只剩一点轮廓时，就该结束了，不能对着空气继续挨打
const THIRD_FADE_END = 0.78;

function startBossTurn() {
  if (thirdPhase) {
    turn++;
    stats.turns = turn;
    fadeProgress = Math.min(1, fadeProgress + 0.085);
    if (fadeProgress >= THIRD_FADE_END) { fadeProgress = 1; fadeEnding(); return; }
    const id = pickAttack();
    const pool = isGenocideRoute() ? THIRD_COLD : THIRD_LINES;
    const line = pool[(turn - 1) % pool.length];
    queueDialog([L('boss', line)], () => beginAttack(id));
    return;
  }
  if (boss.hp <= 0) { startThirdPhase(); return; }
  turn++;
  stats.turns = turn;
  const id = pickAttack();
  const arr = attackLines[id];
  const line = enraged
    ? COLD_LINES[(turn - 1) % COLD_LINES.length]
    : arr[(turn - 1) % arr.length];
  queueDialog([L('boss', line)], () => beginAttack(id));
}

/* ========================= PHYSICS / COLLISION ========================= */

function soulPos(p) {
  if (!p) return { x: 0, y: 0 };
  if (p.mode === 'orange') {
    return {
      x: p.x + Math.sin(time * 17 + p.arena * 2) * 3.6,
      y: p.y + Math.cos(time * 21 + p.arena) * 2.8
    };
  }
  return { x: p.x, y: p.y };
}

function soulRect(p) {
  const s = soulPos(p);
  return { x: s.x - 6, y: s.y - 5, w: 12, h: 10 };
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 点到线段的距离：刀光用旋转长条判定，不能按外接矩形算，否则会凭空变宽
function distPointSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return Math.hypot(px - cx, py - cy);
}

function soulForArena(arena) {
  if (arena === 0) return player;
  if (arena === 1) return player2;
  return null;
}

const FACE_DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

function soulTip(p) {
  const s = soulPos(p);
  const d = FACE_DIRS[p.face == null ? 2 : p.face];
  return { x: s.x + d[0] * 9, y: s.y + d[1] * 9, dx: d[0], dy: d[1] };
}

// 黄色灵魂：空格从爱心尖端射出子弹，打掉可破坏的弹幕
function shootFrom(p) {
  if (!p || p.mode !== 'yellow' || p.shootT > 0) return;
  if (state !== 'attack' && state !== 'endurance') return;
  p.shootT = 0.16;
  const t = soulTip(p);
  shots.push({
    arena: p.arena, x: t.x, y: t.y,
    vx: t.dx * 430, vy: t.dy * 430,
    life: 0.85, r: 4
  });
  Sound.shoot();
}

function updateSoul(p, input, dt) {
  if (!p) return;
  const b = arenaBoxes[p.arena];
  if (!b) return;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.shieldFlash > 0) p.shieldFlash -= dt;
  if (p.shootT > 0) p.shootT -= dt;
  if (p.wheelCd > 0) p.wheelCd -= dt;

  if (p.mode === 'green' && !p.endure) {
    p.moving = 0;
    p.upWas = input.u;
    return;
  }

  const oldX = p.x, oldY = p.y;
  const speed = difficulty === 1 ? 200 : 186;

  if (p.endure && p.mode === 'blue') {
    // 蓝魂跑酷：四向重力 + 可变高度跳跃（短按短跳、长按大跳）+ 贴墙跑
    const g = endGravityVec();
    const horiz = Math.abs(g.x) > 0.5;       // 重力水平：沿墙上下跑
    const mv = horiz ? (input.d ? 1 : 0) - (input.u ? 1 : 0)
                     : (input.r ? 1 : 0) - (input.l ? 1 : 0);
    const away = horiz ? (g.x > 0 ? input.l : input.r) : (g.y > 0 ? input.u : input.d);
    const jumpDown = !!(input.sp || away);

    let grounded = false;
    if (g.y > 0.5) grounded = p.y >= b.y + b.h - 14;
    else if (g.y < -0.5) grounded = p.y <= b.y + 14;
    else if (g.x > 0.5) grounded = p.x >= b.x + b.w - 14;
    else grounded = p.x <= b.x + 14;

    if (grounded && jumpDown && !p.jumpWas) {
      p.vn = -300;
      p.jumpHeld = true;
      p.jumpT = 0;
      Sound.jump();
      addRing(p.x, p.y, 2, 14, '#9fd8ff', 0.22, 1);
    }
    if (p.jumpHeld) {
      if (!jumpDown) {
        p.jumpHeld = false;
        if (p.vn < 0) p.vn *= 0.6;           // 松手立即削速：短按短跳
      } else {
        p.jumpT += dt;
        if (p.jumpT > 0.2 || p.vn >= 0) p.jumpHeld = false;
        else p.vn -= 430 * dt;               // 持续按住：长按大跳
      }
    }
    p.vn += 1400 * dt * (p.jumpHeld && p.vn < 0 ? 0.75 : 1);
    if (p.vn > 420) p.vn = 420;
    p.jumpWas = jumpDown;

    p.x += (horiz ? g.x * p.vn : mv * 214) * dt;
    p.y += (horiz ? mv * 214 : g.y * p.vn) * dt;

    // 沿重力方向的“地面”与反方向“天花板”
    if (g.y > 0.5) {
      if (p.y > b.y + b.h - 12) { p.y = b.y + b.h - 12; if (p.vn > 0) p.vn = 0; }
      if (p.y < b.y + 12) { p.y = b.y + 12; if (p.vn < 0) p.vn = 0; }
    } else if (g.y < -0.5) {
      if (p.y < b.y + 12) { p.y = b.y + 12; if (p.vn > 0) p.vn = 0; }
      if (p.y > b.y + b.h - 12) { p.y = b.y + b.h - 12; if (p.vn < 0) p.vn = 0; }
    } else if (g.x > 0.5) {
      if (p.x > b.x + b.w - 12) { p.x = b.x + b.w - 12; if (p.vn > 0) p.vn = 0; }
      if (p.x < b.x + 12) { p.x = b.x + 12; if (p.vn < 0) p.vn = 0; }
    } else {
      if (p.x < b.x + 12) { p.x = b.x + 12; if (p.vn > 0) p.vn = 0; }
      if (p.x > b.x + b.w - 12) { p.x = b.x + b.w - 12; if (p.vn < 0) p.vn = 0; }
    }

    if (horiz && grounded && mv !== 0) {
      p.wallT = (p.wallT || 0) + dt;
      if (p.wallT > 0.055) {
        p.wallT = 0;
        sparks.push({
          x: p.x + g.x * 7, y: p.y,
          vx: -g.x * 45 + rand(-18, 18), vy: rand(-34, 34),
          life: 0.22, color: '#9fd8ff'
        });
      }
    }
    if (mv !== 0) p.face = horiz ? (mv > 0 ? 2 : 0) : (mv > 0 ? 1 : 3);
  } else if (p.endure && p.mode === 'cyan') {
    // 青魂：只能水平移动，专属窄横条战斗框
    if (input.l && !input.r) p.x -= speed * dt;
    if (input.r && !input.l) p.x += speed * dt;
    if (input.l && !input.r) p.face = 3;
    if (input.r && !input.l) p.face = 1;
  } else if (p.endure && p.mode === 'purple') {
    // 紫魂：只能垂直移动，专属窄竖条战斗框
    if (input.u && !input.d) p.y -= speed * dt;
    if (input.d && !input.u) p.y += speed * dt;
    if (input.u && !input.d) p.face = 0;
    if (input.d && !input.u) p.face = 2;
  } else if (p.endure && p.mode === 'green') {
    // 绿魂：本体不动，四向护盾由方向键切换
    if (input.u) p.gdir = 0;
    else if (input.r) p.gdir = 1;
    else if (input.d) p.gdir = 2;
    else if (input.l) p.gdir = 3;
    p.x = b.x + b.w / 2;
    p.y = b.y + b.h / 2;
  } else {
    let dx = 0, dy = 0;
    if (input.l) dx--;
    if (input.r) dx++;
    if (input.u) dy--;
    if (input.d) dy++;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      p.x += dx / len * speed * dt;
      p.y += dy / len * speed * dt;
      p.face = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    }
  }

  p.x = clamp(p.x, b.x + 8, b.x + b.w - 8);
  p.y = clamp(p.y, b.y + 8, b.y + b.h - 8);
  p.upWas = input.u;
  if (p.mode === 'green') {
    const target = [ -Math.PI / 2, 0, Math.PI / 2, Math.PI ][p.gdir == null ? 2 : p.gdir];
    let da = target - (p.shieldA || 0);
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    p.shieldA = (p.shieldA || 0) + da * Math.min(1, dt * 20);
  }
  // 橙色灵魂自己在抖：无论是否按方向键，始终判定为“移动中”
  if (p.mode === 'orange' && !p.endure) p.moving = 1;
  else if (p.mode === 'green') p.moving = 0;
  else p.moving = (Math.abs(p.x - oldX) + Math.abs(p.y - oldY)) > 0.3 ? 1 : 0;
}

function inputFor(slot) {
  if (slot === 0) {
    if (dualMode) {
      return {
        l: !!keys['a'], r: !!keys['d'],
        u: !!keys['w'], d: !!keys['s']
      };
    }
    return {
      l: !!(keys['a'] || keys['arrowleft'] || codes['Numpad4']),
      r: !!(keys['d'] || keys['arrowright'] || codes['Numpad6']),
      u: !!(keys['w'] || keys['arrowup'] || codes['Numpad8']),
      d: !!(keys['s'] || keys['arrowdown'] || codes['Numpad2'] || codes['Numpad5']),
      sp: !!(keys[' '] || codes['Space'])
    };
  }
  return {
    l: !!(keys['arrowleft'] || codes['Numpad4'] || keys['j']),
    r: !!(keys['arrowright'] || codes['Numpad6'] || keys['l']),
    u: !!(keys['arrowup'] || codes['Numpad8'] || keys['i']),
    d: !!(keys['arrowdown'] || codes['Numpad2'] || codes['Numpad5'] || keys['k']),
    sp: !!(keys[' '] || codes['Space'])
  };
}

function updateSouls(dt) {
  updateSoul(player, inputFor(0), dt);
  if (player2) updateSoul(player2, inputFor(1), dt);
  if (devMode) {
    if (player.kr > 0) player.kr = 0;
    player.hp = player.max;
  } else if (player.kr > 0) {
    player.krTick += dt;
    if (player.krTick >= 0.9) {
      player.krTick = 0;
      player.kr--;
      // 中毒（KR）不会致死：最多扣到 1 HP
      if (player.hp > 1) {
        player.hp -= 1;
        stats.hits++;
        shake = Math.max(shake, 4);
      } else {
        player.kr = 0;
      }
    }
  }
}

function hurt(amount, karmic, who) {
  if (devMode) return;
  if (state !== 'attack' && state !== 'endurance') return;
  const p = who || player;
  if (!p || p.invuln > 0) return;
  if (state === 'endurance') {
    // 终焉模式不做血量结算：受击即失败
    p.hp = 0;
  } else if (karmic && player.hp - amount <= 0) {
    // 中毒伤害不致死：最多剩 1 HP
    player.hp = 1;
  } else {
    player.hp -= amount;
  }
  stats.hits++;
  // 困难（JUDGEMENT）模式没有无敌帧；普通模式保留 1.05 秒无敌
  // 终焉模式单次伤害高，给 0.55 秒受击保护，避免同一束弹幕连续判定
  p.invuln = state === 'endurance' ? 0.55 : (difficulty === 1 ? 0 : 1.05);
  if (karmic) {
    player.kr = Math.min(14, player.kr + (difficulty === 1 ? 5 : 3));
    player.krTick = 0;
  }
  shake = Math.max(shake, 8);
  flashScreen = 0.14;
  Sound.hurt();
  const s = soulPos(p);
  scatterSparks(s, 12, C.red);
  if (player.hp <= 0) die();
}

function scatterSparks(s, n, color) {
  for (let i = 0; i < n; i++) {
    sparks.push({
      x: s.x, y: s.y,
      vx: rand(-110, 110), vy: rand(-110, 30),
      life: rand(0.2, 0.55), color
    });
  }
}

function shieldBlock(p, b) {
  if (!p || p.mode !== 'green' || p.endure) return false;
  const s = soulPos(p);
  let side;
  if (b.kind === 'beam') {
    side = b.dir === 'top' ? 0 : b.dir === 'bottom' ? 2 : b.dir === 'left' ? 3 : 1;
  } else {
    const cx = b.kind === 'bone' ? b.x + b.w / 2 : b.x;
    const cy = b.kind === 'bone' ? b.y + b.h / 2 : b.y;
    const vx = cx - s.x;
    const vy = cy - s.y;
    side = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 1 : 3) : (vy > 0 ? 2 : 0);
  }
  if (side !== p.gdir) return false;
  const cx = b.kind === 'bone' ? clamp(s.x, b.x, b.x + b.w) : b.x;
  const cy = b.kind === 'bone' ? clamp(s.y, b.y, b.y + b.h) : b.y;
  if (dist(s.x, s.y, cx, cy) > 34) return false;
  p.shieldFlash = 0.3;
  Sound.block();
  return true;
}

function bulletHits(b, p) {
  if (!p) return false;
  const s = soulRect(p);
  if (b.kind === 'bone') {
    if (b.color === 'blue' && !p.moving) return false;
    if (b.color === 'orange' && p.moving) return false;
    return overlap(s, { x: b.x + 2, y: b.y + 2, w: Math.max(1, b.w - 4), h: Math.max(1, b.h - 4) });
  }
  // 刀光：细长旋转条，只打中真正压在刀身上的部分
  if (b.kind === 'blade') {
    const sp = soulPos(p);
    const half = (b.len || 120) / 2;
    const ax = b.x - Math.cos(b.ang || 0) * half;
    const ay = b.y - Math.sin(b.ang || 0) * half;
    const bx = b.x + Math.cos(b.ang || 0) * half;
    const by = b.y + Math.sin(b.ang || 0) * half;
    return distPointSeg(sp.x, sp.y, ax, ay, bx, by) < (b.r || 5) / 2 + 3.5;
  }
  if (b.kind === 'orb' || b.kind === 'shard' || b.kind === 'paw' || b.kind === 'note') {
    const r = (b.r || 5) - 1;
    const sp = soulPos(p);
    const nx = clamp(sp.x, b.x - r, b.x + r);
    const ny = clamp(sp.y, b.y - r, b.y + r);
    return dist(sp.x, sp.y, nx, ny) < 6;
  }
  return false;
}

function beamRect(b, arena) {
  const bb = arenaBoxes[arena == null ? b.arena || 0 : arena] || box;
  if (b.full) {
    if (b.dir === 'top' || b.dir === 'bottom') {
      return { x: b.pos, y: 0, w: b.width, h: H };
    }
    return { x: 0, y: b.pos, w: W, h: b.width };
  }
  if (b.dir === 'top' || b.dir === 'bottom') {
    return { x: b.pos, y: bb.y, w: b.width, h: bb.h };
  }
  return { x: bb.x, y: b.pos, w: bb.w, h: b.width };
}

// 恶魔鞭：从场外甩进来的二次贝塞尔曲线
function lashPoints(l) {
  const b = arenaBoxes[l.arena || 0] || box;
  const tx = l.tipX, ty = l.tipY;
  let ax, ay;
  if (l.side === 0) { ax = tx + l.bend; ay = b.y - 150; }
  else if (l.side === 1) { ax = b.x + b.w + 150; ay = ty + l.bend; }
  else if (l.side === 2) { ax = tx + l.bend; ay = b.y + b.h + 150; }
  else { ax = b.x - 150; ay = ty + l.bend; }
  const cx = (ax + tx) / 2 + l.bend * 0.5;
  const cy = (ay + ty) / 2 - l.bend * 0.9;
  const pts = [];
  for (let i = 0; i <= 22; i++) {
    const t = i / 22, mt = 1 - t;
    pts.push({
      x: mt * mt * ax + 2 * mt * t * cx + t * t * tx,
      y: mt * mt * ay + 2 * mt * t * cy + t * t * ty
    });
  }
  return pts;
}

/* ========================= ENDINGS ========================= */

// 启动器用本地回调接收战果：URL 里带 cb / token 时才会触发。
function hasJudgementHook() {
  try {
    const p = new URLSearchParams(location.search || '');
    if (p.get('cb') && p.get('token')) return true;
    const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    return !!(h.get('cb') && h.get('token'));
  } catch (e) {
    return false;
  }
}

function reportJudgement(route) {
  let cb = '';
  let token = '';
  try {
    const p = new URLSearchParams(location.search || '');
    cb = p.get('cb') || '';
    token = p.get('token') || '';
    if (!cb) {
      const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      cb = h.get('cb') || '';
      token = h.get('token') || token;
    }
  } catch (e) {
    return;
  }
  if (!cb || !token) return;
  const diff = difficulty === 1 ? 'hard' : 'normal';
  const params = new URLSearchParams({
    token,
    route,
    diff,
    turns: String(stats.turns),
    damage: String(stats.damage),
    hits: String(stats.hits)
  });
  const base = cb + (cb.indexOf('?') >= 0 ? '&' : '?') + params.toString();
  // 立刻发三次，避免页面在后台时把定时器节流；启动器只认第一次
  for (let i = 0; i < 3; i++) {
    try {
      const img = new Image();
      img.src = base + '&retry=' + i;
    } catch (e) { /* 启动器没监听也不影响游戏 */ }
  }
}

function spareEnding() {
  state = 'ending';
  ending = {
    type: 'spare', t: 0,
    hard: difficulty === 1,
    route: 'mercy',
    linked: hasJudgementHook()
  };
  snapCamera();
  Sound.spare();
  Sound.stopMusic();
  killFinish();
  reportJudgement('mercy');
}

function killEnding() {
  state = 'ending';
  snapCamera();
  const gen = isGenocideRoute();
  ending = {
    type: gen ? 'genocide' : 'neutral', t: 0,
    hard: difficulty === 1,
    route: gen ? 'genocide' : 'neutral',
    linked: hasJudgementHook()
  };
  deathFx = { t: 0 };
  makeDeathShards();
  Sound.stopMusic();
  Sound.shatter();
  shake = 18;
  reportJudgement(gen ? 'genocide' : 'neutral');
}

function killFinish() {
  deathFx = null;
  bullets = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  attack = null;
}

function makeDeathShards() {
  deathShards = [];
  const cols = 7;
  const rows = 9;
  const srcW = 280;
  const srcH = 350;
  const sw = srcW / cols;
  const sh = srcH / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const dx = SPRITE.x + (c / cols) * SPRITE.w;
      const dy = SPRITE.y + (r / rows) * SPRITE.h;
      deathShards.push({
        sx: c * sw, sy: r * sh, sw, sh,
        dx, dy,
        w: SPRITE.w / cols, h: SPRITE.h / rows,
        vx: rand(-220, 220) + (dx - 320) * 1.4,
        vy: rand(-260, -40) + (dy - 120) * 0.6,
        rot: 0,
        vr: rand(-5, 5),
        a: 1,
        delay: rand(0, 0.18)
      });
    }
  }
}

/* ========================= EFFECTS ========================= */

function addText(x, y, text, color) {
  effects.push({ kind: 'text', x, y, text, color: color || C.white, t: 0, dur: 0.9, vy: -38 });
}

function addRing(x, y, r0, r1, color, dur, lw) {
  effects.push({ kind: 'ring', x, y, r0: r0 || 4, r1: r1 || 30, color: color || C.red, t: 0, dur: dur || 0.36, lw: lw || 2 });
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t += dt;
    if (e.kind === 'text') e.y += (e.vy || 0) * dt;
    if (e.t >= e.dur) effects.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 220 * dt;
    s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt);
  if (flashWhite > 0) flashWhite = Math.max(0, flashWhite - dt * 1.6);
  if (screenPulse > 0) screenPulse = Math.max(0, screenPulse - dt);
  if (cutFx) {
    cutFx.t += dt;
    if (cutFx.t >= cutFx.dur) cutFx = null;
  }
  if (boss.flash > 0) boss.flash = Math.max(0, boss.flash - dt * 2.8);
  if (boss.shake > 0) boss.shake = Math.max(0, boss.shake - dt * 2.4);
  if (hitFx) {
    hitFx.t += dt;
    if (hitFx.t >= hitFx.dur) hitFx = null;
  }
  if (deathFx) {
    deathFx.t += dt;
    for (const s of deathShards) {
      if (s.delay > 0) { s.delay -= dt; continue; }
      s.dx += s.vx * dt;
      s.dy += s.vy * dt;
      s.vy += 420 * dt;
      s.rot += s.vr * dt;
      s.a = Math.max(0, 1 - Math.max(0, deathFx.t - 1.1) / 1.2);
    }
  }
  boss.hpShown = lerp(boss.hpShown, boss.hp, Math.min(1, dt * 8));
  if (Math.abs(boss.hpShown - boss.hp) < 0.2) boss.hpShown = boss.hp;
}

function die() {
  if (devMode) return;
  if (state === 'gameover') return;
  if (endurance && state === 'endurance') endurance.failed = true;
  player.hp = 0;
  state = 'gameover';
  gameoverT = 0;
  attack = null;
  snapCamera();
  bullets = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  hazards = [];
  Sound.stopMusic();
  Sound.death();
  shake = 16;
}

/* ========================= UPDATE ========================= */

function update(dt) {
  time += dt;
  if (devBanner > 0) devBanner = Math.max(0, devBanner - dt);
  updateCamera(dt);

  // 音乐随剧情/战况调节：对话压低、弹幕推进、残血心跳、演出掐断
  Sound.tense = state === 'attack' || state === 'endurance';
  Sound.duck = state === 'dialog';
  Sound.cut = !!storyHit || state === 'enemycard';
  Sound.danger = !!(player && player.hp > 0 && player.hp <= player.max * 0.3);

  updateEffects(dt);

  // 第三阶段：时间本身也在带走她
  if (thirdPhase && state !== 'enemycard' && state !== 'ending') {
    fadeProgress = Math.min(1, fadeProgress + dt * 0.0012);
  }
  if (dodgeFx) {
    dodgeFx.t += dt;
    if (dodgeFx.t > 0.55) dodgeFx = null;
  }

  // 屠杀二阶段登场演出：冻结战斗，结束后切到二阶段战斗曲
  if (state === 'enemycard') {
    if (enemyCard) {
      enemyCard.t += dt;
      if (enemyCard.t >= enemyCard.dur) {
        const third = enemyCard.third;
        enemyCard = null;
        if (third) {
          boss.hp = 1;
          boss.hpShown = 0;
          Sound.startMusic('lament');
          addRing(320, 150, 8, 160, 'rgba(255,70,86,0.9)', 0.85, 4);
          addRing(320, 150, 4, 100, 'rgba(255,255,255,0.85)', 0.7, 2);
          addText(320, 128, '1 / ' + boss.max, C.yellow);
          startBossTurn();
        } else {
          Sound.startMusic('enraged');
          startBossTurn();
        }
      }
    }
    return;
  }

  // 她受击的剧情演出：短暂冻结战场，结束后继续原流程
  if (storyHit) {
    storyHit.t += dt;
    if (storyHit.t >= storyHit.dur) {
      storyHit = null;
      const next = afterBossHit;
      afterBossHit = null;
      if (next) next();
    }
    return;
  }

  if (state === 'dialog') updateDialog(dt);
  else if (state === 'fight') updateFight(dt);
  else if (state === 'attack') updateAttack(dt);
  else if (state === 'endurance') updateEndurance(dt);

  if (state === 'gameover') gameoverT += dt;
  if (state === 'ending' && ending) ending.t += dt;
}

const SOUL_MODE = {

  fall: 'blue',
  green: 'green',
  orange: 'orange',
  yellow: 'yellow',

function setupArenas(id) {
  layout = id === 'fall' ? 'fall' : (id === 'dual' ? 'dual' : 'normal');
  dualMode = layout === 'dual';
  if (layout === 'fall') {
    Object.assign(box, FALL_BOX);
    arenaBoxes = [box];
  } else if (dualMode) {
    arenaBoxes = [{ ...DUAL_A }, { ...DUAL_B }];
  } else {
    Object.assign(box, BOX);
    arenaBoxes = [box];
  }
}

function beginAttack(id, noSwitch) {
  setupArenas(id)
  snapCamera();
  const hp = player ? player.hp : PLAYER_HP;
  const max = player ? player.max : PLAYER_HP;
  const kr = player ? player.kr : 0;
  const krTick = player ? player.krTick : 0;

  const mode = SOUL_MODE[id] || 'red';
  lashes = [];
  player = makeSoul(0, mode, arenaBoxes[0]);
  player2 = dualMode ? makeSoul(1, mode, arenaBoxes[1]) : null;
  player.hp = hp;
  player.max = max;
  player.kr = kr;
  player.krTick = krTick;

  bullets = [];
  beams = [];
  lashes = [];
  wheels = [];
  shots = [];
  sparks = [];
  effects = [];

  // Sans 式闪切：困难 / 暴走 / 第三阶段会在弹幕中段白闪换成另一套攻击
  const switchOn = !noSwitch && (thirdPhase ? true : enraged ? (turn % 2 === 1) : (difficulty === 1 && turn % 2 === 0));
  if (switchOn && SWITCH_TO[id] && SWITCH_TO[id] !== id && attack.dur >= 8) {
    attack.midSwitch = { at: attack.dur * (thirdPhase ? 0.42 : 0.5), id: SWITCH_TO[id] };
  }
  // 运镜：特殊框型持续偏移，重攻击给一次推镜

    screenPulse = 0.2;
    shake = Math.max(shake, 6);
  }

  Sound.cutIn();
  shake = Math.max(shake, thirdPhase ? 9 : 7);
  if (thirdPhase) {
    addRing(320, box.y + box.h / 2, 8, 170, 'rgba(255,80,100,0.85)', 0.55, 4);
    screenPulse = Math.max(screenPulse, 0.16);

}

function makeAttack(id) {
  const meta = ATTACK_META[id] || ATTACK_META.bones;
  return {
    id,
    t: 0,
    dur: meta.dur,
    spawnT: 0.5,
    next: 0,

    aimT: 1.2,
    beamT: 2.6,
    hint: meta.hint,
    hintT: 3.6,
    heavy: !!meta.heavy,
    nomix: !!meta.nomix,
    hard: difficulty === 1,
    brutal: enraged || thirdPhase,
    mix: null,
    mixT: 0,
    speedMul: 1
  };
}

// 困难模式的混合攻击：额外叠一套弹幕，第一回合必定出现
const MIX_POOL = ['rain', 'spiral', 'claw', 'shards', 'blasters', 'orange', 'yellow'];
function pickMix(id) {
  const pool = MIX_POOL.filter((x) => x !== id);
  return pool[randi(0, pool.length - 1)];
}

function setupMix(a) {
  if (difficulty !== 1) return;
  const first = turn <= 1;
  if (first) {
    if (a.heavy || a.nomix) return;
    // 第一回合只叠一套慢雨；1.12 倍速 + 1.05 秒间隔会让原本就密的困难弹幕
    // 直接变成"缝隙被雨点填满"，无伤路子会被挤掉。
    a.speedMul = 1.08;
    a.mix = { id: 'rain', next: 0, angle: 0, beamT: 1, interval: 1.35 };
    a.mixT = 0.7;
    return;
  }
  if (a.heavy || a.nomix) return;
  // 之后每 4 回合固定混合一次，其余回合也有概率突袭
  if (turn % 4 === 0 || Math.random() < 0.22) {
    a.mix = { id: pickMix(a.id), next: 0, angle: 0, beamT: 1, interval: 1.45 };
    a.mixT = 0.9;
  }
}

// 第三阶段：每一套弹幕都必须叠第二套，且弹速略微上调——这是最后一段，不能再比二阶段松
const THIRD_MIX_POOL = ['requiem', 'palisade', 'claw', 'spiral', 'laser', 'rain', 'shards', 'bisect', 'blasters'];
function setupThirdMix(a) {
  if (a.nomix) return;
  if (!a.mix) {
    const pool = THIRD_MIX_POOL.filter((x) => x !== a.id);
    a.mix = {
      id: pool[randi(0, pool.length - 1)],
      next: 0, angle: 0, beamT: 1.2,
      interval: a.heavy ? 1.7 : 1.1
    };
    a.mixT = a.heavy ? 1.0 : 0.8;
  }
  if (!a.speedMul || a.speedMul === 1) a.speedMul = a.heavy ? 1.05 : 1.08;
}

// Sans 式闪切：一套弹幕进行到中段时白闪硬切到另一套，灵魂被拉回框中央
const SWITCH_TO = {
  bones: 'blasters', claw: 'laser', rain: 'palisade', blueorange: 'rain',
  blasters: 'bones', dual: 'laser', whip: 'palisade', ricochet: 'blasters',
  palisade: 'laser', spiral: 'laser', green: 'rain', fall: 'blasters',
  shards: 'claw', drift: 'laser', gravity: 'palisade',
  orange: 'blueorange', yellow: 'rain', laser: 'palisade', requiem: 'laser',
  bisect: 'blasters', carousel: 'laser', final: 'palisade'
};

function updateAttack(dt) {
  if (!attack) return;
  const a = attack;
  a.t += dt;
  if (a.hintT > 0) a.hintT -= dt;

  // 闪切：白闪 + 压黑，随后直接换一套弹幕，灵魂回到战斗框中央
  if (a.midSwitch && a.t >= a.midSwitch.at && state === 'attack') {
    const nid = a.midSwitch.id;
    flashWhite = 1;
    cutFx = { t: 0, dur: 0.44 };
    Sound.cutIn();
    shake = Math.max(shake, 9);
    beginAttack(nid, true);
    return;
  }

  // 移动战斗框：整块场地跟着横向漂移，镜头只跟一部分
  if (a.id === 'drift') driftArena(a);

  updateSouls(dt);
  if (state !== 'attack' || !attack) return;

  if (a.id === 'final') shrinkBox(a);

  /* ---- beams ---- */
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i];
    b.t += dt;
    if (b.t > b.warn + b.fire + 0.2) { beams.splice(i, 1); continue; }
    if (b.t >= b.warn && b.t < b.warn + b.fire && !b.hit) {
      const p = soulForArena(b.arena || 0);
      if (!p) continue;
      const r = beamRect(b);
      const s = soulRect(p);
      if (!overlap(s, { x: r.x + 2, y: r.y + 2, w: r.w - 4, h: r.h - 4 })) continue;
      // 护盾优先：即使处于无敌帧也照常挡弹
      if (p.mode === 'green' && shieldBlock(p, { kind: 'beam', dir: b.dir })) {
        b.hit = true;
        for (let k = 0; k < 8; k++) {
          sparks.push({
            x: s.x, y: s.y,
            vx: rand(-90, 90), vy: rand(-90, 20),
            life: rand(0.2, 0.45), color: C.green
          });
        }
      } else if (p.invuln <= 0) {
        b.hit = true;
        hurt(a.brutal ? 3 : (difficulty === 1 ? 2 : 1), false, p);
      }
    }
  }

  /* ---- lashes ---- */
  for (let i = lashes.length - 1; i >= 0; i--) {
    const l = lashes[i];
    l.t += dt;
    if (l.t > l.warn + l.fire + 0.16) { lashes.splice(i, 1); continue; }
    // 横扫鞭：鞭梢从框的一边划到另一边，整条鞭子跟着摆动
    if (l.sweep) {
      const k = clamp((l.t - l.warn) / (l.fire + 0.08), 0, 1);
      const e = k * k * (3 - 2 * k);
      l.tipX = l.sx + (l.ex - l.sx) * e;
      l.tipY = l.sy + (l.ey - l.sy) * e;
    }
    if (l.t >= l.warn && l.t < l.warn + l.fire && !l.hit) {
      const p = soulForArena(l.arena || 0);
      if (!p) continue;
      const s = soulPos(p);
      const pts = lashPoints(l);
      const hitR = l.sweep ? 15 : 12;
      let near = false;
      for (let k = 8; k < pts.length; k++) {
        if (dist(s.x, s.y, pts[k].x, pts[k].y) < hitR) { near = true; break; }
      }
      if (!near) continue;
      // 护盾优先：无敌帧内也能挡住鞭子
      if (p.mode === 'green' && shieldBlock(p, { kind: 'orb', x: l.tipX, y: l.tipY })) {
        l.hit = true;
        for (let k = 0; k < 10; k++) {
          sparks.push({ x: s.x, y: s.y, vx: rand(-110, 110), vy: rand(-110, 30), life: rand(0.2, 0.45), color: C.green });
        }
      } else if (p.invuln <= 0) {
        l.hit = true;
        shake = Math.max(shake, 7);
        hurt(a.brutal ? 3 : (difficulty === 1 ? 2 : 1), false, p);
        if (state !== 'attack') return;
      }
    }
  }

  /* ---- spawn ---- */
  a.spawnT -= dt;
  if (a.spawnT <= 0 && a.t < a.dur - 0.5) {
    spawnForAttack(a);
  }
  if (a.mix && a.t < a.dur - 1.2) {
    a.mixT -= dt;
    if (a.mixT <= 0) {
      a.mixT = a.mix.interval;
      spawnMix(a);
    }
  }

  /* ---- bullets ---- */
  const dmg = a.brutal ? 3 : (difficulty === 1 ? 2 : 1);
  const speedMul = a.speedMul || 1;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.hitT > 0) b.hitT -= dt;
    if (b.delay > 0) { b.delay -= dt; continue; }

    // 分裂球：倒计时结束后一分为三
    if (b.split > 0) {
      b.splitT = (b.splitT || 0) - dt;
      if (b.splitT <= 0) {
        splitBullet(b);
        bullets.splice(i, 1);
        continue;
      }
    }
    // 骨栅：从框边生长、停留、收回
    if (b.growState) {
      updateGrowBone(b, dt);
      if (b.growState === 'gone') { bullets.splice(i, 1); continue; }
    }
    // 审判烙印：定在原地脉动，倒数结束炸成一圈碎晶
    if (b.kind === 'sigil') {
      b.warnT -= dt;
      if (b.warnT <= 0) { burstSigil(b); bullets.splice(i, 1); continue; }
      continue;
    }
    // 会拐弯的弹幕
    if (b.curve) {
      const sp = Math.hypot(b.vx || 0, b.vy || 0) || 1;
      const ang = Math.atan2(b.vy || 0, b.vx || 0) + b.curve * dt;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
    }
    // 音符：左右摆动 + 轻微追踪
    if (b.kind === 'note') {
      b.phase = (b.phase || 0) + dt * (b.wobF || 2);
      b.x += Math.cos(b.phase) * (b.wobA || 24) * dt;
      const np = soulForArena(b.arena || 0);
      if (np) b.x += Math.sign(np.x - b.x) * (b.home || 30) * dt;
    }

    b.x += (b.vx || 0) * dt * speedMul;
    b.y += (b.vy || 0) * dt * speedMul;
    if (b.rotv) b.rot += b.rotv * dt;
    if (b.life != null) b.life -= dt;

    // 回响球：撞到框壁反弹
    if (b.bounce > 0) {
      const bb0 = arenaBoxes[b.arena || 0] || box;
      const rr = b.r || 6;
      let bounced = false;
      if (b.x - rr <= bb0.x && b.vx < 0) { b.x = bb0.x + rr; b.vx = Math.abs(b.vx); b.bounce--; bounced = true; }
      else if (b.x + rr >= bb0.x + bb0.w && b.vx > 0) { b.x = bb0.x + bb0.w - rr; b.vx = -Math.abs(b.vx); b.bounce--; bounced = true; }
      if (b.y - rr <= bb0.y && b.vy < 0) { b.y = bb0.y + rr; b.vy = Math.abs(b.vy); b.bounce--; bounced = true; }
      else if (b.y + rr >= bb0.y + bb0.h && b.vy > 0) { b.y = bb0.y + bb0.h - rr; b.vy = -Math.abs(b.vy); b.bounce--; bounced = true; }
      if (bounced) {
        addRing(b.x, b.y, 4, 20, 'rgba(255,255,255,0.85)', 0.3, 2);
        for (let k = 0; k < 4; k++) {
          sparks.push({
            x: b.x, y: b.y,
            vx: rand(-70, 70), vy: rand(-70, 70),
            life: rand(0.12, 0.28), color: C.white
          });
        }
        Sound.ricochet();
        // 回声球弹够次数后炸成两片碎晶：回响 + 分裂
        if (b.splitOnBounce) {
          b.ric = (b.ric || 0) + 1;
          if (b.ric >= b.splitOnBounce && !b.ricDone) {
            b.ricDone = true;
            const ba = Math.atan2(b.vy || 0, b.vx || 0);
            for (let k = 0; k < 2; k++) {
              const aa = ba + (k ? 0.95 : -0.95);
              bullets.push({
                kind: 'shard', arena: b.arena || 0, x: b.x, y: b.y, r: 5,
                vx: Math.cos(aa) * 165, vy: Math.sin(aa) * 165,
                rot: aa, rotv: 7, color: C.white, tr: []
              });
            }
            addRing(b.x, b.y, 3, 18, 'rgba(255,255,255,0.7)', 0.28, 1.5);
            Sound.split();
          }
        }
      }
    }

    // 运动残影：球、碎片、猫爪、音符保留最近几帧位置
    if (b.kind === 'orb' || b.kind === 'shard' || b.kind === 'paw' || b.kind === 'note') {
      if (!b.tr) b.tr = [];
      b.tr.push({ x: b.x, y: b.y });
      if (b.tr.length > 5) b.tr.shift();
    }

    const bb = arenaBoxes[b.arena || 0] || box;
    const pad = b.outer ? 280 : 80;
    if (b.x + (b.w || 0) < bb.x - pad || b.x > bb.x + bb.w + pad ||
        b.y + (b.h || 0) < bb.y - pad || b.y > bb.y + bb.h + pad ||
        (b.life != null && b.life <= 0)) {
      bullets.splice(i, 1);
      continue;
    }

    const p = soulForArena(b.arena || 0);
    if (!p) continue;

    // 护盾优先：无敌帧内也能挡弹
    if (p.mode === 'green' && shieldBlock(p, b)) {
      const sp = soulRect(p);
      for (let k = 0; k < 8; k++) {
        sparks.push({
          x: sp.x + 6, y: sp.y,
          vx: rand(-100, 100), vy: rand(-100, 30),
          life: rand(0.2, 0.45), color: C.green
        });
      }
      bullets.splice(i, 1);
      continue;
    }

    if (p.invuln > 0) continue;

    if (bulletHits(b, p)) {
      const karmic = b.karmic === true || (b.kind === 'shard');
      hurt(dmg, karmic, p);
      if (state !== 'attack') return;
      if (b.kind !== 'beam') bullets.splice(i, 1);
    }
  }

  updateWheels(dt);
  updateShots(dt);
  if (state !== 'attack') return;

  if (a.t >= a.dur) endAttack();
}

/* ---- 分裂球：到点炸成三颗，封住原来的直线 ---- */
function splitBullet(b) {
  const sp = Math.hypot(b.vx || 0, b.vy || 0) || 1;
  const base = Math.atan2(b.vy || 0, b.vx || 0);
  const n = b.split;
  for (let k = 0; k < n; k++) {
    const ang = base + (k - (n - 1) / 2) * 0.52;
    bullets.push({
      kind: 'orb', arena: b.arena || 0, x: b.x, y: b.y, r: b.splitR || 5,
      vx: Math.cos(ang) * sp * 1.04, vy: Math.sin(ang) * sp * 1.04,
      color: C.white, tr: []
    });
  }
  Sound.split();
  addRing(b.x, b.y, 3, 20, 'rgba(255,255,255,0.7)', 0.3, 1.5);
  // 分裂点偶尔留下一枚审判烙印：刚躲开三颗，还得离开原地
  if (b.sigilOnSplit && Math.random() < 0.55) {
    bullets.push({
      kind: 'sigil', arena: b.arena || 0, x: b.x, y: b.y, r: 10,
      warnT: 0.62, burst: 5, ang: rand(0, Math.PI * 2), color: C.red
    });
  }
}

/* ---- 审判烙印：脉动结束后炸开一圈碎晶 ---- */
function burstSigil(b) {
  const n = b.burst || 6;
  const base = b.ang || 0;
  const sp = b.speed || 132;
  for (let k = 0; k < n; k++) {
    const ang = base + k * Math.PI * 2 / n;
    bullets.push({
      kind: 'shard', arena: b.arena || 0, x: b.x, y: b.y, r: 4,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      rot: ang, rotv: 6, color: C.white, tr: []
    });
  }
  Sound.split();
  addRing(b.x, b.y, 3, 30, 'rgba(255,255,255,0.7)', 0.35, 2);
}

/* ---- 骨栅：贴着框边向内生长，留出的缺口才是安全区 ---- */
function updateGrowBone(b, dt) {
  if (b.growState === 'warn') b.growState = 'out';
  if (b.growState === 'out') {
    b.grow = Math.min(1, (b.grow || 0) + dt * (b.growSpeed || 8.5));
    if (b.grow >= 1) {
      b.growState = 'hold';
      b.growHold = b.holdMax || 0.55;
    }
  } else if (b.growState === 'hold') {
    b.growHold -= dt;
    if (b.growHold <= 0) b.growState = 'in';
  } else if (b.growState === 'in') {
    b.grow = Math.max(0, (b.grow || 0) - dt * (b.growSpeed || 8.5) * 1.7);
    if (b.grow <= 0) { b.growState = 'gone'; return; }
  }
  const e = b.grow * b.grow * (3 - 2 * b.grow);
  const bb = arenaBoxes[b.arena || 0] || box;
  const depth = b.depth * e;
  if (b.edge === 'left') { b.x = bb.x; b.y = b.seg; b.w = depth; b.h = b.len; }
  else if (b.edge === 'right') { b.x = bb.x + bb.w - depth; b.y = b.seg; b.w = depth; b.h = b.len; }
  else if (b.edge === 'top') { b.x = b.seg; b.y = bb.y; b.w = b.len; b.h = depth; }
  else { b.x = b.seg; b.y = bb.y + bb.h - depth; b.w = b.len; b.h = depth; }
}

/* ---- 移动战场：整块框和框内所有东西一起平移 ---- */
function shiftArena(dx, dy) {
  if (!dx && !dy) return;
  box.x += dx;
  box.y += dy;
  for (const b of bullets) {
    b.x += dx;
    b.y += dy;
    if (b.seg != null) b.seg += (b.edge === 'left' || b.edge === 'right') ? dy : dx;
  }
  for (const bm of beams) {
    if (bm.full) continue;
    if (bm.dir === 'top' || bm.dir === 'bottom') bm.pos += dx;
    else bm.pos += dy;
  }
  for (const l of lashes) { l.tipX += dx; l.tipY += dy; }
  for (const w of wheels) { w.cx += dx; w.cy += dy; }
  for (const s of shots) { s.x += dx; s.y += dy; }
  for (const e of effects) { e.x += dx; e.y += dy; }
  for (const s of sparks) { s.x += dx; s.y += dy; }
  if (player) { player.x += dx; player.y += dy; }
  if (player2) { player2.x += dx; player2.y += dy; }
}

function driftArena(a) {
  const bb = arenaBoxes[0] || box;
  const amp = a.brutal ? 54 : (a.hard ? 46 : 38);
  const spd = a.brutal ? 1.5 : 0.9;
  const targetX = BOX.x + Math.sin(a.t * spd) * amp;
  const dx = targetX - bb.x;
  if (Math.abs(dx) > 0.02) shiftArena(dx, 0);
  const off = (bb.x + bb.w / 2) - W / 2;
  setCamera(-off * 0.7, 0, a.brutal ? 1.05 : 1.04);
}

/* ---- 大风车：绕中心旋转的骨环 ---- */
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return dist(px, py, x1 + dx * t, y1 + dy * t);
}

// 骨臂：从轮毂沿方向一直伸到战斗框的边上（不是内切椭圆），
// 这样四条边和角落都会被扫到，蹲角落不再安全。
function wheelArm(w, ang) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const hw = w.hw != null ? w.hw : (w.rx || 0);
  const hh = w.hh != null ? w.hh : (w.ry || 0);
  const tx = Math.abs(ca) > 1e-4 ? hw / Math.abs(ca) : 1e9;
  const ty = Math.abs(sa) > 1e-4 ? hh / Math.abs(sa) : 1e9;
  return { ca, sa, len: Math.min(tx, ty) };
}

function updateWheels(dt) {
  const a = attack;
  for (let i = wheels.length - 1; i >= 0; i--) {
    const w = wheels[i];
    w.t += dt;
    w.ang += w.speed * dt;

    const p = soulForArena(w.arena || 0);
    if (p && w.t > 0.5 && w.t < w.life - 0.3) {
      const s = soulPos(p);
      const grow = Math.min(1, w.t / 0.5);
      let touching = false;
      for (let k = 0; k < w.arms && !touching; k++) {
        const ang = w.ang + k * Math.PI * 2 / w.arms;
        const arm = wheelArm(w, ang);
        const endD = (arm.len + 8) * grow;
        const startD = Math.min(22, endD * 0.55);
        const steps = Math.max(3, Math.ceil((endD - startD) / 5));
        for (let j = 0; j <= steps; j++) {
          const d = startD + (endD - startD) * (j / steps);
          const ax = w.cx + arm.ca * d;
          const ay = w.cy + arm.sa * d;
          if (dist(s.x, s.y, ax, ay) < 9) { touching = true; break; }
        }
        // 骨尖也算一个判定点
        if (!touching && dist(s.x, s.y, w.cx + arm.ca * endD, w.cy + arm.sa * endD) < 10) touching = true;
      }
      if (touching && p.wheelCd <= 0 && p.invuln <= 0) {
        // 风车单独给一段受击冷却，避免同一根骨头连续判定秒杀
        p.wheelCd = 0.6;
        w.flash = 0.2;
        hurt(a && a.brutal ? 2 : 1, false, p);
        if (state !== 'attack') return;
      }
    }
    if (w.flash > 0) w.flash -= dt;
    if (w.t >= w.life) wheels.splice(i, 1);
  }
}

/* ---- 黄色灵魂的射击：打掉可破坏弹幕 ---- */
function bulletHp(b) {
  if (b.hp != null) return b.hp;
  if (b.kind === 'bone') return 3;
  if (b.kind === 'paw') return 3;
  return 1;
}

function updateShots(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    const bb = arenaBoxes[s.arena || 0] || box;
    if (s.life <= 0 || s.x < bb.x - 10 || s.x > bb.x + bb.w + 10 ||
        s.y < bb.y - 10 || s.y > bb.y + bb.h + 10) {
      shots.splice(i, 1);
      continue;
    }

    let consumed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if ((b.arena || 0) !== (s.arena || 0)) continue;
      if (b.delay > 0) continue;
      if (b.outer) {
        // 场外飞入的弹幕同样可以打掉，按圆心距离判定
        const cr = b.kind === 'bone' ? Math.max(b.w, b.h) * 0.5 : (b.r || 6);
        if (dist(s.x, s.y, b.x + (b.w || 0) / 2, b.y + (b.h || 0) / 2) > cr + s.r) continue;
      } else if (b.kind === 'bone') {
        if (!(s.x > b.x - 2 && s.x < b.x + b.w + 2 && s.y > b.y - 2 && s.y < b.y + b.h + 2)) continue;
      } else {
        if (dist(s.x, s.y, b.x, b.y) > (b.r || 6) + s.r) continue;
      }

      const hp = bulletHp(b) - 1;
      b.hp = hp;
      b.hitT = 0.12;
      Sound.pop();
      addRing(s.x, s.y, 3, hp <= 0 ? 26 : 14, 'rgba(255,255,255,0.9)', 0.28, 2);
      for (let k = 0; k < 4; k++) {
        sparks.push({
          x: s.x, y: s.y,
          vx: rand(-90, 90), vy: rand(-90, 90),
          life: rand(0.12, 0.3), color: C.yellow
        });
      }
      if (hp <= 0) {
        bullets.splice(j, 1);
        for (let k = 0; k < 6; k++) {
          sparks.push({
            x: s.x, y: s.y,
            vx: rand(-140, 140), vy: rand(-140, 140),
            life: rand(0.15, 0.4), color: b.color || C.white
          });
        }
      }
      consumed = true;
      break;
    }
    if (consumed) shots.splice(i, 1);
  }
}

function shrinkBox(a) {
  const targetW = a.brutal ? 300 : (a.hard ? 360 : 430);
  const targetH = a.brutal ? 96 : (a.hard ? 106 : 120);
  const k = clamp(a.t / 5.5, 0, 1);
  const back = a.t > a.dur - 2.2 ? clamp((a.dur - a.t) / 2.2, 0, 1) : 1;
  const tw = BOX.w - (BOX.w - targetW) * k;
  const th = BOX.h - (BOX.h - targetH) * k;
  box.w = BOX.w - (BOX.w - tw) * back;
  box.h = BOX.h - (BOX.h - th) * back;
  box.x = (W - box.w) / 2;
  box.y = BOX.y + BOX.h - box.h;
  if (player) {
    player.x = clamp(player.x, box.x + 8, box.x + box.w - 8);
    player.y = clamp(player.y, box.y + 8, box.y + box.h - 8);
  }
}

// 骨栅：从战斗框一侧长出一排骨墙，只在缺口处留活路。
// 单独抽出来，方便激光战里也穿插侧边骨墙。
function spawnBoneWall(ai, b, edge, opts) {
  opts = opts || {};
  const brutal = opts.brutal != null ? opts.brutal : (enraged || thirdPhase);
  const hard = difficulty === 1;
  const depth = opts.depth != null ? opts.depth : (brutal ? 62 : (hard ? 52 : 42));
  const along = (edge === 'top' || edge === 'bottom') ? b.w : b.h;
  const origin = (edge === 'top' || edge === 'bottom') ? b.x : b.y;
  const gapW = Math.min(opts.gapW != null ? opts.gapW : (brutal ? 52 : (hard ? 64 : 80)), along - 30);
  const nGaps = opts.gaps != null ? opts.gaps : (brutal ? 2 : 1);
  const growSpeed = opts.growSpeed != null ? opts.growSpeed : (brutal ? 10 : 8.5);
  const gaps = [];
  for (let g = 0; g < nGaps; g++) {
    const minC = origin + 16 + gapW / 2;
    const maxC = origin + along - 16 - gapW / 2;
    let c = rand(minC, maxC);
    if (gaps.length) {
      for (let tries = 0; tries < 24 && Math.abs(c - gaps[0]) < gapW + 24; tries++) c = rand(minC, maxC);
    }
    gaps.push(c);
  }
  gaps.sort((p, q) => p - q);
  const make = (s, e) => {
    const len = e - s;
    if (len < 12) return;
    const target = {
      kind: 'bone', arena: ai, color: 'white',
      edge, seg: s, len, depth,
      x: 0, y: 0, w: 0, h: 0, vx: 0, vy: 0,
      grow: 0, growState: 'warn', growSpeed,
      holdMax: opts.holdMax != null ? opts.holdMax : (brutal ? 0.45 : (hard ? 0.52 : 0.6)),
      delay: opts.delay != null ? opts.delay : (brutal ? 0.5 : (hard ? 0.56 : 0.66))
    };
    if (edge === 'left') { target.x = b.x; target.y = s; target.w = depth; target.h = len; }
    else if (edge === 'right') { target.x = b.x + b.w - depth; target.y = s; target.w = depth; target.h = len; }
    else if (edge === 'top') { target.x = s; target.y = b.y; target.w = len; target.h = depth; }
    else { target.x = s; target.y = b.y + b.h - depth; target.w = len; target.h = depth; }
    bullets.push(target);
  };
  let start = origin;
  for (const gc of gaps) {
    make(start, gc - gapW / 2);
    start = gc + gapW / 2;
  }
  make(start, origin + along);
  return { edge, gaps, gapW, depth };
}

function spawnForAttack(a) {
  for (let ai = 0; ai < arenaBoxes.length; ai++) {
    spawnOne(a, arenaBoxes[ai], ai);
  }
}

// 混合弹幕：借用另一套攻击的生成器，但按自己的节奏刷新
function spawnMix(a) {
  const m = a.mix;
  for (let ai = 0; ai < arenaBoxes.length; ai++) {
    const proxy = {
      id: m.id, t: a.t, dur: a.dur,
      next: m.next, angle: m.angle, aimT: m.aimT || 1.2, beamT: m.beamT || 2.6,
      spawnT: 0, hard: a.hard, brutal: a.brutal
    };
    spawnOne(proxy, arenaBoxes[ai], ai);
    m.next = proxy.next;
    m.angle = proxy.angle;
    m.aimT = proxy.aimT;
    m.beamT = proxy.beamT;
  }
}

function spawnOne(a, b, ai) {
  const hard = a.hard;
  const brutal = a.brutal;

  if (a.id === 'bones') {
    const gap = Math.min(brutal ? 52 : (hard ? 62 : 82), b.h - 58);
    const speed = brutal ? 300 : (hard ? 220 : 165);
    const gy = b.y + 20 + Math.random() * Math.max(8, b.h - gap - 38);
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: b.y, w: 15, h: gy - b.y, vx: -speed, vy: 0, color: 'white' });
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: gy + gap, w: 15, h: b.y + b.h - (gy + gap), vx: -speed, vy: 0, color: 'white' });
    if (hard) {
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 74, y: b.y, w: 13, h: Math.max(0, gy - b.y - 10), vx: -speed, vy: 0, color: 'white' });
    }
    if (brutal) {
      const gy2 = b.y + 14 + Math.random() * Math.max(6, b.h - gap - 28);
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 132, y: b.y, w: 12, h: gy2 - b.y, vx: -speed, vy: 0, color: 'white' });
      bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 132, y: gy2 + gap, w: 12, h: b.y + b.h - (gy2 + gap), vx: -speed, vy: 0, color: 'white' });
    }
    a.spawnT = brutal ? 0.28 : (hard ? 0.36 : 0.55);
    Sound.menu();
  }

  else if (a.id === 'rain') {
    const blue = Math.random() < 0.27;
    const x = rand(b.x + 14, b.x + b.w - 14);
    bullets.push({
      kind: 'bone', arena: ai, x, y: b.y - 64, w: 13,
      h: rand(26, 54), vx: 0,
      vy: blue ? (hard ? 235 : 180) : (hard ? 315 : 235),
      color: blue ? 'blue' : 'white', delay: 0.24
    });
    if (brutal) {
      const x2 = rand(b.x + 14, b.x + b.w - 14);
      bullets.push({
        kind: 'bone', arena: ai, x: x2, y: b.y - 94, w: 12, h: rand(24, 46),
        vx: 0, vy: hard ? 330 : 250, color: 'white', delay: 0.5
      });
    }
    a.spawnT = brutal ? 0.085 : (hard ? 0.115 : 0.2);
  }

  else if (a.id === 'blueorange') {
    const w = Math.min(rand(54, 112), b.w - 20);
    const color = (a.next++ % 2 === 0) ? 'blue' : 'orange';
    bullets.push({
      kind: 'bone', arena: ai, x: rand(b.x + 8, b.x + b.w - w - 8),
      y: b.y - 16, w, h: 12, vx: 0,
      vy: brutal ? 250 : (hard ? 210 : 160), color
    });
    if (brutal && a.next % 3 === 0) {
      const w2 = Math.min(rand(44, 84), b.w - 20);
      bullets.push({
        kind: 'bone', arena: ai, x: rand(b.x + 8, b.x + b.w - w2 - 8),
        y: b.y - 62, w: w2, h: 11, vx: 0, vy: 210,
        color: (a.next % 2 === 0) ? 'blue' : 'orange'
      });
    }
    a.spawnT = brutal ? 0.34 : (hard ? 0.42 : 0.62);
  }

  else if (a.id === 'blasters') {
    const dirs = ['top', 'top', 'bottom', 'bottom', 'left', 'right'];
    const dir = dirs[randi(0, dirs.length - 1)];
    const width = hard ? 38 : 34;
    let pos;
    if (dir === 'top' || dir === 'bottom') pos = rand(b.x + 14, b.x + b.w - 14 - width);
    else pos = rand(b.y + 14, b.y + b.h - 14 - width);
    beams.push({
      dir, pos, width, arena: ai,
      warn: brutal ? 0.46 : (hard ? 0.6 : 0.85),
      fire: 0.28, t: 0, hit: false
    });
    if (brutal) {
      const dir2 = dir === 'top' || dir === 'bottom' ? 'left' : 'top';
      const pos2 = dir2 === 'left' || dir2 === 'right'
        ? rand(b.y + 12, b.y + b.h - 50)
        : rand(b.x + 12, b.x + b.w - 50);
      beams.push({
        dir: dir2, pos: pos2, width: 30, arena: ai,
        warn: 0.7, fire: 0.26, t: 0, hit: false
      });
    }
    Sound.blaster();
    screenPulse = 0.16;
    if (brutal) {
      const dir3 = dirs[randi(0, dirs.length - 1)];
      const pos3 = (dir3 === 'top' || dir3 === 'bottom')
        ? rand(b.x + 12, b.x + b.w - 40)
        : rand(b.y + 12, b.y + b.h - 40);
      beams.push({ dir: dir3, pos: pos3, width: 26, arena: ai, warn: 0.95, fire: 0.24, t: 0, hit: false });
    }
    a.spawnT = brutal ? 0.4 : (hard ? 0.52 : 0.76);
  }

  else if (a.id === 'spiral') {
    // 螺旋球：两臂旋转，弹幕之间留出足够大的缝隙；
    // 中间穿插审判烙印、白羽和一段侧边骨墙，避免只会转圈
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    a.angle += brutal ? 0.5 : (hard ? 0.46 : 0.4);
    const speed = brutal ? 126 : (hard ? 110 : 90);
    const arms = 2;
    const tick = brutal ? 0.12 : (hard ? 0.16 : 0.22);
    for (let m = 0; m < arms; m++) {
      const ang = a.angle + m * Math.PI;
      // 生成半径必须大于灵魂判定半径：毂心 8px 生成等于站在中心就必中。
      // 26px 让中心成为可站的“风眼”，但瞄准弹仍会把这里赶走。
      bullets.push({
        kind: 'orb', arena: ai,
        x: cx + Math.cos(ang) * 26, y: cy + Math.sin(ang) * 26,
        r: 5, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        color: C.white
      });
    }
    a.spawnT = tick;
    a.aimT -= tick;
    if (a.aimT <= 0) {
      a.aimT = brutal ? 0.95 : (hard ? 1.35 : 1.9);
      const target = soulForArena(ai) ? soulPos(soulForArena(ai)) : { x: cx, y: cy };
      const ang = Math.atan2(target.y - cy, target.x - cx) + rand(-0.12, 0.12);
      const as = brutal ? 245 : (hard ? 205 : 155);
      // 同理，瞄准弹从圈外 26px 起步，不在灵魂身上生成
      bullets.push({
        kind: 'orb', arena: ai, x: cx + Math.cos(ang) * 26, y: cy + Math.sin(ang) * 26, r: 6,
        vx: Math.cos(ang) * as, vy: Math.sin(ang) * as,
        color: C.white, karmic: true
      });
      if (brutal) {
        bullets.push({
          kind: 'orb', arena: ai, x: cx + Math.cos(ang + 0.28) * 26, y: cy + Math.sin(ang + 0.28) * 26, r: 5,
          vx: Math.cos(ang + 0.28) * as, vy: Math.sin(ang + 0.28) * as,
          color: C.white
        });
      }
    }
    // 审判烙印：框内随机落点，倒数完炸开成一圈碎晶
    a.sigilT = (a.sigilT == null ? 1.3 : a.sigilT) - tick;
    if (a.sigilT <= 0) {
      a.sigilT = brutal ? 2.0 : (hard ? 2.6 : 3.4);
      bullets.push({
        kind: 'sigil', arena: ai,
        x: rand(b.x + 34, b.x + b.w - 34), y: rand(b.y + 28, b.y + b.h - 28),
        r: 10, warnT: brutal ? 0.62 : (hard ? 0.74 : 0.86),
        burst: brutal ? 7 : 5, ang: rand(0, Math.PI * 2), speed: 120
      });
    }
    // 侧边骨墙：时不时压进来一半，配合旋转球收窄空间
    a.wallT = (a.wallT == null ? 3.0 : a.wallT) - tick;
    if (a.wallT <= 0) {
      a.wallT = brutal ? 4.2 : (hard ? 5.2 : 6.5);
      spawnBoneWall(ai, b, ['left', 'right', 'bottom'][a.next++ % 3], {
        depth: brutal ? 40 : (hard ? 34 : 30),
        gapW: brutal ? 64 : (hard ? 72 : 82)
      });
      Sound.boneWall();
    }
  }

  else if (a.id === 'dual') {
    const gap = Math.min(hard ? 62 : 80, b.h - 50);
    const speed = brutal ? 270 : (hard ? 200 : 155);
    const gy = b.y + 16 + Math.random() * Math.max(6, b.h - gap - 30);
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: b.y, w: 14, h: gy - b.y, vx: -speed, vy: 0, color: 'white' });
    bullets.push({ kind: 'bone', arena: ai, x: b.x + b.w + 12, y: gy + gap, w: 14, h: b.y + b.h - (gy + gap), vx: -speed, vy: 0, color: 'white' });
    if (a.next % 3 === 0) {
      const p = soulForArena(ai);
      const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      const ang = Math.atan2(t.y - (b.y - 8), t.x - (b.x + b.w / 2)) + rand(-0.1, 0.1);
      bullets.push({
        kind: 'orb', arena: ai, x: b.x + b.w / 2, y: b.y - 8, r: 5,
        vx: Math.cos(ang) * (hard ? 165 : 130),
        vy: Math.sin(ang) * (hard ? 165 : 130),
        color: C.white
      });
    }
    a.next++;
    a.spawnT = brutal ? 0.42 : (hard ? 0.55 : 0.76);
  }

  else if (a.id === 'green') {
    // 回到原来的手感：从随机一条边、随机位置瞄准灵魂射来，每次只来一个方向
    const side = a.next++ % 4;
    const p = soulForArena(ai);
    const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    let sx, sy;
    if (side === 0) { sx = rand(b.x + 18, b.x + b.w - 18); sy = b.y - 72; }
    else if (side === 2) { sx = rand(b.x + 18, b.x + b.w - 18); sy = b.y + b.h + 72; }
    else if (side === 3) { sx = b.x - 72; sy = rand(b.y + 18, b.y + b.h - 18); }
    else { sx = b.x + b.w + 72; sy = rand(b.y + 18, b.y + b.h - 18); }
    const count = brutal ? 3 : (hard ? 2 : 1);
    const speed = brutal ? 225 : (hard ? 185 : 148);
    const base = Math.atan2(t.y - sy, t.x - sx);
    for (let k = 0; k < count; k++) {
      const ang = base + (k - (count - 1) / 2) * 0.16 + rand(-0.03, 0.03);
      bullets.push({
        kind: 'orb', arena: ai, outer: true,
        x: sx + Math.cos(ang) * 8, y: sy + Math.sin(ang) * 8, r: 7,
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        color: C.white
      });
    }
    a.spawnT = brutal ? 0.46 : (hard ? 0.58 : 0.82);
  }

  else if (a.id === 'claw') {
    const p = soulForArena(ai);
    const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const fromRight = Math.random() < 0.6;
    const sx = fromRight ? b.x + b.w + 140 : b.x - 140;
    const sy = rand(b.y - 110, b.y + b.h + 80);
    const base = Math.atan2(t.y - sy, t.x - sx);
    const speed = brutal ? 390 : (hard ? 315 : 248);
    const pushPaw = (turnOff) => bullets.push({
      kind: 'paw', arena: ai, outer: true, x: sx, y: sy, r: 11,
      vx: Math.cos(base + turnOff) * speed,
      vy: Math.sin(base + turnOff) * speed,
      rot: base, life: 3.2,
      color: C.white
    });
    pushPaw(0);
    if (brutal) { pushPaw(rand(-0.3, 0.3)); pushPaw(rand(-0.5, 0.5)); }
    else if (hard && Math.random() < 0.35) pushPaw(rand(-0.26, 0.26));
    addRing(sx, sy, 6, 34, 'rgba(255,255,255,0.85)', 0.34, 3);
    a.spawnT = brutal ? 0.34 : (hard ? 0.48 : 0.7);
  }

  else if (a.id === 'whip') {
    const n = a.next++;
    const sweepCycle = n % 3 === 2;
    if (sweepCycle) {
      // 横扫鞭单独出场：鞭身贴中线以上扫过，下半个框始终是安全跑道
      const fromLeft = (n % 2 === 1);
      const sxp = fromLeft ? b.x + 22 : b.x + b.w - 22;
      const exp = fromLeft ? b.x + b.w - 22 : b.x + 22;
      const midY = b.y + b.h * 0.42;
      lashes.push({
        arena: ai, side: 0, sweep: true,
        sx: sxp, sy: b.y + 18,
        ex: exp, ey: midY,
        tipX: sxp, tipY: b.y + 18,
        bend: (fromLeft ? 1 : -1) * rand(46, 78),
        warn: brutal ? 0.5 : (hard ? 0.68 : 0.88),
        fire: brutal ? 0.36 : (hard ? 0.42 : 0.5),
        t: 0, hit: false
      });
    } else {
      const side = n % 4;
      const mkLash = (sd) => lashes.push({
        arena: ai, side: sd,
        tipX: rand(b.x + 34, b.x + b.w - 34),
        tipY: rand(b.y + 32, b.y + b.h - 32),
        bend: (Math.random() < 0.5 ? -1 : 1) * rand(35, 85),
        warn: brutal ? 0.55 : (hard ? 0.72 : 0.95),
        fire: 0.24, t: 0, hit: false
      });
      mkLash(side);
      // 追加的鞭子只从同一侧甩入，合起来仍是一道单向鞭墙，另一侧始终可退
      if (brutal) { mkLash(side); mkLash(side); }
      else if (hard && Math.random() < 0.4) mkLash(side);
    }
    a.spawnT = brutal ? 0.62 : (hard ? 0.82 : 1.05);
    Sound.blaster();
  }

  else if (a.id === 'laser') {
    const vertical = Math.random() < 0.55;
    const width = brutal ? 56 : (hard ? 46 : 38);
    const fire = 0.34;
    const warn = brutal ? 0.6 : (hard ? 0.8 : 1.0);
    const mkLaser = () => {
      if (vertical) {
        beams.push({
          full: true, dir: 'top', pos: rand(b.x + 26, b.x + b.w - 26 - width),
          width, arena: ai, warn, fire, t: 0, hit: false
        });
      } else {
        beams.push({
          full: true, dir: 'left', pos: rand(b.y + 12, b.y + b.h - 12 - width),
          width, arena: ai, warn, fire, t: 0, hit: false
        });
      }
    };
    mkLaser();
    if (brutal && Math.random() < 0.8) mkLaser();
    else if (hard && Math.random() < 0.4) mkLaser();
    // 激光为主时，隔一波从框侧压进一排骨栅：只靠躲光束会被逼到边上
    a.next = (a.next || 0) + 1;
    if (a.next % 2 === 0) {
      const side = (a.next % 4 === 0) ? 'left' : 'right';
      spawnBoneWall(ai, b, side, {
        gaps: 1,
        depth: brutal ? 50 : (hard ? 42 : 36),
        gapW: brutal ? 62 : (hard ? 70 : 82),
        delay: brutal ? 0.42 : (hard ? 0.5 : 0.6),
        holdMax: brutal ? 0.5 : 0.62
      });
      Sound.boneWall();
    }
    // 每第三波：猫爪从另一侧横着扑过审判之光，逼你换位
    if (a.next % 3 === 0) {
      const p = soulForArena(ai);
      const t = p ? soulPos(p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      const fromLeft = Math.random() < 0.5;
      const px = fromLeft ? b.x - 34 : b.x + b.w + 34;
      const py = rand(b.y + 26, b.y + b.h - 26);
      const base = Math.atan2(t.y - py, t.x - px);
      const n = brutal ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const aa = base + (k - (n - 1) / 2) * 0.22;
        bullets.push({
          kind: 'paw', arena: ai, outer: true, x: px, y: py, r: 12, rot: aa,
          vx: Math.cos(aa) * (brutal ? 240 : 195), vy: Math.sin(aa) * (brutal ? 240 : 195),
          color: C.white, tr: []
        });
      }
      Sound.pop();
    }
    a.spawnT = brutal ? 0.72 : (hard ? 0.98 : 1.4);
    Sound.blaster();
    screenPulse = 0.18;
  }

  else if (a.id === 'fall') {
    // 蓝魂跳跃一次约 0.59s；困难 0.4s 一根会让落地正好压在下一根上。
