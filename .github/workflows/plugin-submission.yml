name: Plugin Submission

on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'plugin-submission') &&
      github.actor != 'github-actions[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'plugin-submission')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure review labels
        run: |
          set -euo pipefail
          gh label create plugin-submission --color 5319e7 --description "桌宠插件投稿" --force
          gh label create plugin-validated --color 0e8a16 --description "投稿已通过自动检查" --force
          gh label create plugin-invalid --color d93f0b --description "投稿未通过自动检查" --force
          gh label create plugin-approved --color 1d76db --description "维护者已批准，等待发布" --force
          gh label create plugin-rejected --color b60205 --description "投稿已被退回" --force
          gh label create plugin-published --color 006b75 --description "插件已发布到插件库" --force

      - name: Validate submission
        run: |
          set -euo pipefail
          python tools/plugin_submission.py validate \
            --event "$GITHUB_EVENT_PATH" \
            --result "$RUNNER_TEMP/validation.json"
          python tools/plugin_submission.py report \
            --result "$RUNNER_TEMP/validation.json" \
            --kind validate > "$RUNNER_TEMP/comment.md"

      - name: Report validation result
        run: |
          set -euo pipefail
          COMMENT_ID="$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- dkl-plugin-check:v1 -->")) | .id' | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          fi
          if jq -e '.ok == true' "$RUNNER_TEMP/validation.json" > /dev/null; then
            gh issue edit "$NUMBER" --add-label plugin-validated --remove-label plugin-invalid
          else
            gh issue edit "$NUMBER" --add-label plugin-invalid --remove-label plugin-validated
          fi

  review:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'plugin-submission') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read review command
        id: command
        run: |
          set -euo pipefail
          FIRST="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" | head -n 1 | tr -d '\r')"
          if [[ "$FIRST" =~ ^/approve([[:space:]]|$) ]]; then
            echo "action=approve" >> "$GITHUB_OUTPUT"
          elif [[ "$FIRST" =~ ^/reject([[:space:]]|$) ]]; then
            echo "action=reject" >> "$GITHUB_OUTPUT"
            printf '%s' "${FIRST#/reject}" > "$RUNNER_TEMP/reason.txt"
          else
            echo "action=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure review labels
        if: steps.command.outputs.action != 'none'
        run: |
          set -euo pipefail
          gh label create plugin-submission --color 5319e7 --description "桌宠插件投稿" --force
          gh label create plugin-validated --color 0e8a16 --description "投稿已通过自动检查" --force
          gh label create plugin-invalid --color d93f0b --description "投稿未通过自动检查" --force
          gh label create plugin-approved --color 1d76db --description "维护者已批准，等待发布" --force
          gh label create plugin-rejected --color b60205 --description "投稿已被退回" --force
          gh label create plugin-published --color 006b75 --description "插件已发布到插件库" --force

      - name: Approve and publish
        if: steps.command.outputs.action == 'approve'
        run: |
          set -euo pipefail
          gh issue edit "$NUMBER" --add-label plugin-approved --remove-label plugin-invalid
          python tools/plugin_submission.py publish \
            --event "$GITHUB_EVENT_PATH" \
            --result "$RUNNER_TEMP/publish.json"
          python tools/plugin_submission.py report \
            --result "$RUNNER_TEMP/publish.json" \
            --kind publish > "$RUNNER_TEMP/publish.md"

      - name: Deploy to plugin library
        if: steps.command.outputs.action == 'approve'
        run: |
          set -euo pipefail
          if jq -e '.ok == true' "$RUNNER_TEMP/publish.json" > /dev/null; then
            python tools/plugin_submission.py deploy \
              --result "$RUNNER_TEMP/publish.json" \
              --repo "$REPO"
          fi

      - name: Report publish result
        if: steps.command.outputs.action == 'approve'
        run: |
          set -euo pipefail
          COMMENT_ID="$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- dkl-plugin-publish:v1 -->")) | .id' | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" \
              -F body=@"$RUNNER_TEMP/publish.md" > /dev/null
          else
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/publish.md"
          fi
          if jq -e '.ok == true' "$RUNNER_TEMP/publish.json" > /dev/null; then
            gh issue edit "$NUMBER" --add-label plugin-published --remove-label plugin-approved
            gh issue close "$NUMBER" --reason completed
          else
            gh issue edit "$NUMBER" --remove-label plugin-approved
          fi

      - name: Reject submission
        if: steps.command.outputs.action == 'reject'
        run: |
          set -euo pipefail
          REASON="$(sed -e 's/^[[:space:]]*//' "$RUNNER_TEMP/reason.txt" 2>/dev/null || true)"
          if [ -z "$REASON" ]; then
            REASON="（维护者没有填写具体原因，请在 Issue 里继续追问）"
          fi
          {
            echo "<!-- dkl-plugin-reject:v1 -->"
            echo "## 投稿未通过"
            echo
            echo "原因："
            echo
            printf '%s\n' "$REASON" | sed 's/^/> /'
            echo
            echo "修改后可以重新投稿；再次投稿前请确认 ZIP 根目录、\`plugin.json\`、权限和版本号都符合要求。"
          } > "$RUNNER_TEMP/reject.md"
          gh issue edit "$NUMBER" --add-label plugin-rejected \
            --remove-label plugin-validated --remove-label plugin-approved
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reject.md"
          gh issue close "$NUMBER" --reason "not planned"
