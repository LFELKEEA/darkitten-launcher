name: Plugin Queue Snapshot

# 把投稿 Issue 的公开状态汇总成同源 JSON，审核看板即使访问不了 api.github.com 也能显示队列。
on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  issues: read

concurrency:
  group: plugin-queue-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: >
      contains(github.event.issue.labels.*.name, 'plugin-submission') ||
      startsWith(github.event.issue.title, '[插件投稿]') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'plugin-submission')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild review queue snapshot
        run: |
          set -euo pipefail
          python tools/plugin_submission.py queue \
            --repo "$GITHUB_REPOSITORY" \
            --upload
